# Espace de travail Python du dépôt POA, géré par uv.
# La racine n'est pas un paquet : chaque paquet Python du dépôt est un membre.
# Installer : make installer (uv sync). Les versions exactes sont figées dans uv.lock.

[tool.uv.workspace]
members = ["02_ease", "03_orchestrations", "04_eke", "11_bancs_publics"]

[dependency-groups]
dev = [
  "datamodel-code-generator>=0.80",
  "pyright[nodejs]>=1.1.400",
  "pytest>=8.3",
  "pytest-xdist>=3.6",
  "ruff>=0.12",
  "types-pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["02_ease/tests", "03_orchestrations/tests", "04_eke/tests", "11_bancs_publics/tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
# Exclus : le code généré par make contrats, contrôlé par son test de fraîcheur et par pyright ;
# les scripts recopiés dans les sources datées de 00_docs, qui restent tels qu'ils ont tourné.
extend-exclude = ["02_ease/src/ease/contrats", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "C4"]
# Typographie française : espaces insécables autour des guillemets, apostrophes et signes.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Tables de données fictives : des textes longs qu'il vaut mieux lire d'un seul tenant.
"09_outillage/scripts/generer_donnees_v1.py" = ["E501"]
"09_outillage/scripts/generer_donnees_v2.py" = ["E501"]
"09_outillage/scripts/generer_complements.py" = ["E501"]
"09_outillage/scripts/generer_domivelle_v1.py" = ["E501"]
"09_outillage/scripts/generer_complements_domivelle.py" = ["E501"]
"09_outillage/scripts/generer_negovelle_v1.py" = ["E501"]

[tool.pyright]
include = ["02_ease/src", "02_ease/tests", "03_orchestrations/src", "03_orchestrations/tests", "04_eke/src", "04_eke/tests", "11_bancs_publics/src", "11_bancs_publics/tests", "09_outillage"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
