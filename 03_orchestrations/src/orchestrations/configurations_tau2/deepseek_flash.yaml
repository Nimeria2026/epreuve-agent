# Agent de reproduction τ²-bench (reproduction_tau2) sur DeepSeek V4.1 Flash, compte officiel, en
# heures creuses. Comme configurations/deepseek_flash.yaml, plus les deux réglages que l'agent de
# τ²-bench 1.0.1 envoie à chaque appel : température 0 (DEFAULT_LLM_ARGS_AGENT, src/tau2/config.py)
# et tool_choice auto (generate, src/tau2/utils/llm_utils.py). Avec raisonnement, la température
# est sans effet chez DeepSeek (00_docs/sources/2026-10-05_reglages_des_modeles.md).
role: agent
modele: deepseek-flash
adresse: https://api.deepseek.com
cle_env: DEEPSEEK_API_KEY
parametres:
  temperature: 0.0
  tool_choice: auto
# Avec des outils, DeepSeek exige qu'on lui renvoie le raisonnement de chaque tour précédent.
raisonnement_renvoye: reasoning_content
delai_appel_secondes: 300
# Au moins un geste par tour : le budget de 100 étapes d'EASE pour τ²-bench tombe le premier.
tours_max: 100
