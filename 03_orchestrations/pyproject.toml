[project]
name = "orchestrations"
version = "0.1.0"
description = "Schémas d'orchestration d'agents mesurés par EASE (projet Épreuve d'agent)"
requires-python = ">=3.12"
dependencies = [
  "anyio>=4.9",
  "httpx2>=2.13",
  "mcp>=2.3",
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrations"]
