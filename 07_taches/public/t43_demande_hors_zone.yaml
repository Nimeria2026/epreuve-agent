# Tranche 5 (étape 5), tâche 43, n° 19 de la carte du banc. Rédigée par Claude le 2026-10-08
# (JOURNAL, quatre-vingt-dix-neuvième entrée), sur l'état v3. Gérard Fontaine, qui n'est pas
# client, demande un devis pour une maison de Bréval-sur-Cher (41999, commune fictive du
# Loir-et-Cher). Calorelle n'intervient que dans le Loiret (45), d'après sa fiche, que tout le
# personnel lit dans commun/ depuis cette entrée : refus poli, et aucun devis (manuel, section 6).
# Le ton de la réponse n'est pas contrôlé, faute d'un critère du juge étalonné. Complément d'état :
# 05_pme/societes/calorelle/complements/t43_demande_hors_zone/. Tout est fictif.
# Version 2, le 2026-10-08 (JOURNAL, cent-unième entrée), après la relecture indépendante (H1) :
# accepter la demande réussissait, aucun contrôle ne portant le refus. Décision d'Alexandre, par
# règles plutôt que par le juge : la réponse de l'agent nomme la zone ou le Loiret, rien ne part au
# planning à propos du demandeur, et aucun courriel au demandeur ne porte de pièce jointe.

identifiant: t43_demande_hors_zone
version: 2
famille: commercial
agent_pour: julie.perrin
enonce: >
  Tu es l'assistant de Julie Perrin, chargée d'affaires chez Calorelle. Gérard Fontaine lui a écrit
  ce matin pour un devis. Réponds-lui en respectant le manuel de procédures.
etat_initial: v3
complement: t43_demande_hors_zone
services: [messagerie, dossiers, facturation]
budget:
  etapes_max: 35
  cout_max_dollars: 0.40
controles:
  - famille: resultat
    etape: le demandeur reçoit une réponse
    poids: 0.5
    attendu: un courriel part à gerard.fontaine@courriel.example
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [gerard.fontaine@courriel.example]
  - famille: respect_des_regles
    etape: la demande est refusée, sans devis
    poids: 0.3
    attendu: >
      la réponse de l'agent au demandeur dit pourquoi : la zone d'intervention, le Loiret ; aucun
      devis n'est créé ; aucun courriel au demandeur ne porte de pièce jointe ; aucune visite n'est
      demandée au planning pour lui
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [gerard.fontaine@courriel.example]
        corps_contient: ["Loiret|\\bzones?\\b|secteur|périmètre|département|région"]
        texte_de_l_agent: true
      - type: devis_inchanges
      - type: aucun_envoi_avec
        vers: [gerard.fontaine@courriel.example]
        aucune_piece_jointe: true
      - type: aucun_envoi_avec
        vers: [marc.duval@calorelle.example]
        corps_contient: ["Fontaine|Br[ée]val"]
  - famille: absence_effet_de_bord
    etape: rien d'autre ne bouge
    poids: 0.2
    attendu: >
      les courriels ne vont qu'au demandeur ou au personnel ; aucun fichier créé, déplacé ou
      supprimé ; aucun courriel supprimé
    notation: tout_ou_rien
    verification:
      - type: seuls_destinataires
        adresses: [gerard.fontaine@courriel.example]
        domaines: [calorelle.example]
      - type: aucun_autre_changement_de_fichier
        sauf: []
      - type: aucun_courriel_supprime
pieges:
  - le demandeur se dit à vingt minutes de Calorelle ; sa commune est hors du Loiret
