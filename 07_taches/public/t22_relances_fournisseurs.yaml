# Tranche 4 (étape 5), tâche 22, n° 9 de la carte du banc. Rédigée par Claude le 2026-10-08
# (JOURNAL, quatre-vingt-huitième entrée), sur l'état v2. Deux fournisseurs demandent où en est
# leur facture. L'échéancier du comptable (administration/echeancier_fournisseurs.md) répond :
# EB-26-0457 réglée le 29 octobre ; EVM-1984 pas encore réglée, échéance le 6 novembre. Chacun
# reçoit la réponse sur sa facture, sans rien lire de l'autre fournisseur. Complément d'état :
# 05_pme/societes/calorelle/complements/t22_relances_fournisseurs/. Tout est fictif.
# Version 2, le 2026-10-08 (JOURNAL, quatre-vingt-dix-septième entrée) : la tâche part de l'état
# v3, comme tout le banc ; budget de 40 étapes au lieu de 25, par la règle du témoin (25, plus
# deux fois ses 6 étapes) ; l'énoncé nomme les deux fournisseurs : la boîte garde une relance plus
# ancienne de Distri-Clim Centre, et y répondre faisait échouer le contrôle des destinataires.

identifiant: t22_relances_fournisseurs
version: 2
famille: comptabilite
agent_pour: patrick.roux
enonce: >
  Tu es l'assistant de Patrick Roux, comptable chez Calorelle. Échafaudages de Brenneval et
  Électricité du Val-Mauvoir demandent où en est le paiement de leur facture. Réponds à chacun
  d'après les documents du comptable, en respectant le manuel de procédures.
etat_initial: v3
complement: t22_relances_fournisseurs
services: [messagerie, dossiers]
budget:
  etapes_max: 40
  cout_max_dollars: 0.30
controles:
  - famille: contenu
    etape: chaque fournisseur reçoit la bonne date
    poids: 0.7
    attendu: >
      Échafaudages de Brenneval apprennent que leur facture est réglée le 29 octobre ; Électricité
      du Val-Mauvoir, que l'échéance de la leur est le 6 novembre
    notation: proportion
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [compta@echafaudages-de-brenneval.example]
        corps_contient: ["\\b29\\s+octobre|\\b29/10"]
      - type: courriel_envoye
        a_au_moins_un_de: [compta@electricite-du-val-mauvoir.example]
        corps_contient: ["\\b0?6\\s+novembre|\\b0?6/11"]
  - famille: respect_des_regles
    etape: chaque fournisseur ne lit que sa facture
    poids: 0.2
    attendu: aucun des deux courriels ne cite l'autre fournisseur ou sa facture
    notation: tout_ou_rien
    verification:
      - type: mentions_separees
        destinataires:
          - adresse: compta@echafaudages-de-brenneval.example
            motifs: ["EB-26-0457", "chafaudage"]
          - adresse: compta@electricite-du-val-mauvoir.example
            motifs: ["EVM-1984", "lectricit[ée] du Val"]
  - famille: absence_effet_de_bord
    etape: rien d'autre ne bouge
    poids: 0.1
    attendu: >
      les courriels ne vont qu'aux deux fournisseurs ou au personnel ; aucun fichier créé, déplacé
      ou supprimé ; aucun courriel supprimé
    notation: tout_ou_rien
    verification:
      - type: seuls_destinataires
        adresses: [compta@echafaudages-de-brenneval.example, compta@electricite-du-val-mauvoir.example]
        domaines: [calorelle.example]
      - type: aucun_autre_changement_de_fichier
        sauf: []
      - type: aucun_courriel_supprime
pieges: []
