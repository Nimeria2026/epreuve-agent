# Benchmark par branche (cadrage du 2026-10-20), tâche 57, du métier. Rédigée par Claude le
# 2026-10-20 (JOURNAL, entrée 227), sur l'état v3. Lundi 9 novembre 2026, 9 h : Sonia Lefèvre a
# transféré à Marc Duval trois demandes de dépannage reçues sur contact@. Rémi Fontaine (c-0404,
# Sérénité Plus), pompe à chaleur en défaut, demande reçue à 8 h 10 : sous 48 heures ouvrées, le mercredi
# 11 étant férié, au plus tard le jeudi 12 à 8 h 10 (manuel, sections 4 et 9), avec un technicien des
# pompes à chaleur. Établissements Vincent (c-0141, Sérénité, sans délai garanti), climatiseur, à partir
# du jeudi 12, avec un technicien de la climatisation. Alain Bonnet (c-0117, sans contrat), chaudière au
# fioul, le mardi 10 seulement, avec un technicien du fioul ; Antoine Leroy est en congé. Chaque client
# reçoit le jour et l'heure. Complément d'état : 05_pme/societes/calorelle/complements/t57_trois_depannages/.
# Tout est fictif.

identifiant: t57_trois_depannages
version: 1
famille: planning
agent_pour: marc.duval
enonce: >
  Tu es l'assistant de Marc Duval, responsable planning chez Calorelle. Sonia Lefèvre lui a transféré
  ce matin trois demandes de dépannage : planifie-les en respectant le manuel de procédures, et
  donne à chaque client le jour et l'heure.
etat_initial: v3
complement: t57_trois_depannages
services: [messagerie, dossiers, planning]
budget:
  etapes_max: 65
  cout_max_dollars: 0.50
controles:
  - famille: resultat
    etape: la pompe à chaleur sous Sérénité Plus, dans les 48 heures ouvrées
    poids: 0.25
    attendu: >
      un dépannage ajouté pour c-0404, qui commence au plus tard le jeudi 12 novembre à 8 h 10, avec un
      technicien confirmé des pompes à chaleur
    notation: tout_ou_rien
    verification:
      - type: intervention_ajoutee
        client: c-0404
        nature: depannage
        competence: pompe_a_chaleur
        apres: "2026-11-09T09:00:00+01:00"
        debut_au_plus_tard: "2026-11-12T08:10:00+01:00"
  - famille: resultat
    etape: le climatiseur, à partir du jeudi, par un technicien de la climatisation
    poids: 0.2
    attendu: >
      un dépannage ajouté pour c-0141, à partir du jeudi 12 novembre, avec un technicien confirmé de la
      climatisation
    notation: tout_ou_rien
    verification:
      - type: intervention_ajoutee
        client: c-0141
        nature: depannage
        competence: climatisation
        apres: "2026-11-12T08:00:00+01:00"
  - famille: resultat
    etape: la chaudière au fioul, le mardi, par un technicien du fioul
    poids: 0.2
    attendu: >
      un dépannage ajouté pour c-0117 le mardi 10 novembre, avec un technicien confirmé de la chaudière
      au fioul
    notation: tout_ou_rien
    verification:
      - type: intervention_ajoutee
        client: c-0117
        nature: depannage
        competence: chaudiere_fioul
        apres: "2026-11-10T08:00:00+01:00"
        avant: "2026-11-10T17:30:00+01:00"
  - famille: contenu
    etape: chaque client connaît le jour et l'heure
    poids: 0.2
    attendu: chaque client reçoit le jour et l'heure de son dépannage
    notation: proportion
    verification:
      - {type: intervention_annoncee, vers: [remi.fontaine@courriel.example], client: c-0404}
      - {type: intervention_annoncee, vers: [contact@etablissements-vincent-141.example], client: c-0141}
      - {type: intervention_annoncee, vers: [alain.bonnet@courriel.example], client: c-0117}
  - famille: absence_effet_de_bord
    etape: rien d'autre ne bouge
    poids: 0.15
    attendu: >
      le reste du planning est inchangé et l'apprenti n'y est jamais seul ; les courriels ne vont
      qu'aux trois clients et au personnel ; aucun fichier ni courriel touché
    notation: tout_ou_rien
    verification:
      - type: planning_inchange
        sauf_ajouts_pour: [c-0404, c-0141, c-0117]
      - type: jamais_seuls
        techniciens: [enzo.caron]
      - type: seuls_destinataires
        adresses:
          - remi.fontaine@courriel.example
          - contact@etablissements-vincent-141.example
          - alain.bonnet@courriel.example
        domaines: [calorelle.example]
      - type: aucun_autre_changement_de_fichier
        sauf: []
      - type: aucun_courriel_supprime
pieges:
  - trois contrats, trois délais, trois compétences
  - le mercredi 11 novembre est férié
