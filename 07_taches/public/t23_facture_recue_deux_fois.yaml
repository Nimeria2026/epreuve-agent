    verification:
      - type: fichier_present
        chemin: administration/factures_fournisseurs/2026-10/outillage-de-mirelande_om-2026-231.pdf
        identique_a_piece: {courriel: m-cpt-301, piece: Facture_OM-2026-231.pdf}
