      - type: aucun_autre_changement_de_fichier
        sauf: [administration/factures_fournisseurs/2026-10/outillage-de-mirelande_om-2026-231.pdf]
      - type: seuls_destinataires
        adresses: [compta@outillage-de-mirelande.example]
        domaines: [calorelle.example]
