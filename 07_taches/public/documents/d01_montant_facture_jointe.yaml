# Jeu « documents » (étape 6), tâche 1. Rédigée par Claude le 2026-10-10 (journal d'EKE,
# vingt-cinquième entrée), sur l'état v3 et son complément. Robinetterie des Saulaies envoie sa
# facture RS-2026-0612 sans en donner le montant dans le courriel : le montant TTC (599,76 €) et la
# date (29 octobre 2026) ne se lisent que dans le PDF, par EKE, une fois la pièce rangée. Échéance
# par les conditions de la fiche du fournisseur, paiement à 30 jours fin de mois : 29 octobre plus
# 30 jours, le 28 novembre, reporté au 30 novembre 2026. Complément d'état :
# 05_pme/societes/calorelle/complements/d01_montant_facture_jointe/. Tout est fictif.
# Budget par la règle du témoin : 25, plus deux fois ses 8 étapes, arrondi aux cinq du dessus.

identifiant: d01_montant_facture_jointe
version: 1
famille: comptabilite
agent_pour: patrick.roux
enonce: >
  Tu es l'assistant de Patrick Roux, comptable de Calorelle. Une facture de Robinetterie des
  Saulaies est arrivée ce matin dans la boîte comptabilite@. Range-la dans les dossiers partagés en
  respectant le manuel de procédures, puis envoie à Hélène Marchal, la gérante, son montant TTC et
  son échéance : l'échéancier ne l'a pas encore.
etat_initial: v3
complement: d01_montant_facture_jointe
services: [messagerie, dossiers, eke]
budget:
  etapes_max: 45
  cout_max_dollars: 0.40
controles:
  - famille: resultat
    etape: la facture est rangée
    poids: 0.3
    attendu: >
      administration/factures_fournisseurs/2026-10/robinetterie-des-saulaies_rs-2026-0612.pdf
      correspond à la pièce jointe de m-cpt-601
    notation: tout_ou_rien
    verification:
      - type: fichier_present
        chemin: administration/factures_fournisseurs/2026-10/robinetterie-des-saulaies_rs-2026-0612.pdf
        identique_a_piece: {courriel: m-cpt-601, piece: Facture_RS-2026-0612.pdf}
  - famille: resultat
    etape: la gérante reçoit le montant et l'échéance
    poids: 0.5
    attendu: >
      un courriel à helene.marchal@calorelle.example donne 599,76 € TTC et l'échéance du
      30 novembre 2026
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [helene.marchal@calorelle.example]
        corps_contient: ["\\b599[,.]76\\b", "\\b30\\s+nov|\\b30[/.]11\\b|\\b2026-11-30\\b"]
  - famille: absence_effet_de_bord
    etape: rien d'autre ne bouge
    poids: 0.2
    attendu: >
      aucun autre fichier créé, déplacé ou supprimé ; aucun courriel hors de Calorelle ; aucun
      courriel supprimé
    notation: tout_ou_rien
    verification:
      - type: aucun_autre_changement_de_fichier
        sauf:
          - administration/factures_fournisseurs/2026-10/robinetterie-des-saulaies_rs-2026-0612.pdf
      - type: aucun_envoi_hors_de
        domaine: calorelle.example
      - type: aucun_courriel_supprime
pieges:
  - le courriel ne donne ni le montant ni la date de la facture, que seul le PDF porte
  - l'échéance se calcule avec les conditions de la fiche du fournisseur, à 30 jours fin de mois
