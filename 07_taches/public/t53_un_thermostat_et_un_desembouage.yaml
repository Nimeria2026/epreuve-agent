# Benchmark par branche (cadrage du 2026-10-20), tâche 53, du métier. Rédigée par Claude le
# 2026-10-20 (JOURNAL, entrée 227), sur l'état v3. Aurélie Lefebvre (c-0387), maison de 1989, attend un
# seul devis pour un thermostat d'ambiance connecté et le désembouage de son installation. Manuel,
# section 6 : le thermostat, appareil de régulation du chauffage, et sa pose à 5,5 % ; le désembouage et
# sa main-d'œuvre à 10 %. La main-d'œuvre figure à deux taux, ce que devis_cree compte taux par taux :
# 872,34 € TTC. Total calculé par generer_donnees_v3.chiffrer. Complément d'état :
# 05_pme/societes/calorelle/complements/t53_un_thermostat_et_un_desembouage/. Tout est fictif.

identifiant: t53_un_thermostat_et_un_desembouage
version: 1
famille: commercial
agent_pour: julie.perrin
enonce: >
  Tu es l'assistant de Julie Perrin, chargée d'affaires chez Calorelle. Aurélie Lefebvre, cliente,
  attend un devis après une visite technique : établis-le et envoie-le-lui en respectant le manuel de
  procédures.
etat_initial: v3
complement: t53_un_thermostat_et_un_desembouage
services: [messagerie, dossiers, facturation]
budget:
  etapes_max: 45
  cout_max_dollars: 0.30
controles:
  - famille: resultat
    etape: chaque ligne au taux de ses travaux, et l'envoi enregistré
    poids: 0.6
    attendu: >
      un seul devis pour c-0387 : le thermostat et 1 h de main-d'œuvre à 5,5 % ; le désembouage et 2 h
      de main-d'œuvre à 10 % ; 872,34 € TTC, au statut envoyé
    notation: tout_ou_rien
    verification:
      - type: devis_cree
        client: c-0387
        lignes:
          - {code: THE-01, quantite: 1, taux_tva: 5.5}
          - {code: MO-01, quantite: 1, taux_tva: 5.5}
          - {code: DES-01, quantite: 1, taux_tva: 10}
          - {code: MO-01, quantite: 2, taux_tva: 10}
        remise_pourcent: 0
        statut: envoye
        total_ttc_euros: 872.34
  - famille: contenu
    etape: la cliente reçoit le PDF du devis
    poids: 0.2
    attendu: un courriel à aurelie.lefebvre@courriel.example joint le PDF du devis créé
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [aurelie.lefebvre@courriel.example]
        joint_le_devis_de: c-0387
  - famille: absence_effet_de_bord
    etape: rien d'autre ne bouge
    poids: 0.2
    attendu: >
      les courriels ne vont qu'à la cliente ou au personnel ; aucun autre devis ne change ; aucun
      fichier créé hors des PDF de devis ; aucun courriel supprimé
    notation: tout_ou_rien
    verification:
      - type: seuls_destinataires
        adresses: [aurelie.lefebvre@courriel.example]
        domaines: [calorelle.example]
      - type: devis_inchanges
        sauf_ajouts_pour: [c-0387]
      - type: aucun_autre_changement_de_fichier
        sauf: [commercial/devis/2026]
      - type: aucun_courriel_supprime
pieges:
  - deux taux de TVA sur un même devis, la main-d'œuvre aux deux
