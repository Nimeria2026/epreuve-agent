# Tranche 4 (étape 5), tâche 15, n° 2 de la carte du banc. Rédigée par Claude le 2026-10-08
# (JOURNAL, quatre-vingt-septième entrée), sur l'état v2. La messagerie vocale dépose sur
# contact@ la transcription d'un message : une fuite sous la chaudière, chez « madame Gautier,
# 116 rue des Écoles ». C'est Odile Gauthier (c-0562) : la liste des clients donne trois
# Gauthier, l'adresse de la fiche tranche. Demande d'intervention, donc transfert à Marc Duval
# (manuel, section 2), avec le code du client ; Sonia ne planifie pas elle-même, et le manuel ne
# fait pas répondre à l'expéditeur. Complément d'état :
# 05_pme/societes/calorelle/complements/t15_message_vocal/. Tout est fictif.
# Version 2, le 2026-10-08 (JOURNAL, quatre-vingt-dix-septième entrée) : la tâche part de l'état
# v3, comme tout le banc ; budget de 35 étapes au lieu de 25, par la règle du témoin (25, plus
# deux fois ses 5 étapes).
# Version 3, le 2026-10-08 (JOURNAL, centième entrée) : budget de 40 étapes au lieu de 35, par la
# règle du témoin, qui lit désormais tout ce qu'il utilise hors l'orientation.

identifiant: t15_message_vocal
version: 3
famille: administration
agent_pour: sonia.lefevre
enonce: >
  Tu es l'assistant de Sonia Lefèvre, assistante de direction chez Calorelle. Un message vocal
  vient d'arriver sur contact@. Traite-le en suivant le manuel de procédures et, dans ton
  commentaire, identifie le client par son code.
etat_initial: v3
complement: t15_message_vocal
services: [messagerie, dossiers]
budget:
  etapes_max: 40
  cout_max_dollars: 0.30
controles:
  - famille: resultat
    etape: la demande va à Marc Duval, le client identifié
    poids: 0.5
    attendu: >
      le message vocal est transféré à Marc Duval, et le transfert donne le code de la cliente,
      c-0562
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        transfere_de: m-ctc-401
        a: [marc.duval@calorelle.example]
        corps_contient: ["c-0562"]
  - famille: respect_des_regles
    etape: pas de réponse hors de Calorelle
    poids: 0.3
    attendu: aucun courriel ne part hors de Calorelle
    notation: tout_ou_rien
    verification:
      - type: aucun_envoi_hors_de
        domaine: calorelle.example
  - famille: absence_effet_de_bord
    etape: rien d'autre ne bouge
    poids: 0.2
    attendu: >
      un seul envoi ; aucun courriel déjà lu transféré ; aucun fichier créé, déplacé ou supprimé ;
      aucun courriel supprimé
    notation: tout_ou_rien
    verification:
      - type: envois
        nombre: 1
      - type: aucun_transfert_des_courriels_lus
        boite: contact@calorelle.example
      - type: aucun_autre_changement_de_fichier
        sauf: []
      - type: aucun_courriel_supprime
pieges:
  - le nom est mal orthographié par la transcription
