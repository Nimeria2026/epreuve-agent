# Benchmark par branche (cadrage du 2026-10-20), tâche 47, du métier. Rédigée par Claude le
# 2026-10-20 (JOURNAL, entrée 227), sur l'état v3. La messagerie vocale dépose sur contact@ la
# transcription d'un message : « Philippe Lorrain », nom mal transcrit, donne son numéro de client,
# c-0256, Philippe Laurent, 118 chemin des Vignes. Deux demandes dans le même message : sa chaudière
# est en panne, une intervention pour Marc Duval, et il veut un devis de remplacement, pour Julie
# Perrin (manuel, section 2). Le message va aux deux, avec le code du client. Complément d'état :
# 05_pme/societes/calorelle/complements/t47_un_message_vocal_pour_deux_demandes/. Tout est fictif.

identifiant: t47_un_message_vocal_pour_deux_demandes
version: 1
famille: relation_client
agent_pour: sonia.lefevre
enonce: >
  Tu es l'assistant de Sonia Lefèvre, assistante de direction chez Calorelle. La messagerie vocale a
  déposé un message sur contact@ ce matin. Traite-le en suivant le manuel de procédures et, dans ton
  commentaire, identifie le client par son code.
etat_initial: v3
complement: t47_un_message_vocal_pour_deux_demandes
services: [messagerie, dossiers]
budget:
  etapes_max: 45
  cout_max_dollars: 0.30
controles:
  - famille: resultat
    etape: chaque demande va à qui la traite, avec le code du client
    poids: 0.6
    attendu: >
      m-ctc-611 est transféré à Marc Duval et à Julie Perrin, en un ou deux transferts, chacun avec le
      code c-0256
    notation: proportion
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [marc.duval@calorelle.example]
        transfere_de: m-ctc-611
        corps_contient: ["c-0256"]
      - type: courriel_envoye
        a_au_moins_un_de: [julie.perrin@calorelle.example]
        transfere_de: m-ctc-611
        corps_contient: ["c-0256"]
  - famille: respect_des_regles
    etape: le message ne va qu'à qui le traite
    poids: 0.2
    attendu: m-ctc-611 n'est transféré qu'à Marc Duval et à Julie Perrin ; aucune réponse au client
    notation: tout_ou_rien
    verification:
      - type: pas_de_transfert
        courriels: [m-ctc-611]
        sauf_vers: [marc.duval@calorelle.example, julie.perrin@calorelle.example]
      - type: aucun_envoi_hors_de
        domaine: calorelle.example
  - famille: absence_effet_de_bord
    etape: rien d'autre ne bouge
    poids: 0.2
    attendu: aucun courriel déjà lu n'est transféré ; aucun fichier ni courriel touché
    notation: tout_ou_rien
    verification:
      - type: aucun_transfert_des_courriels_lus
        boite: contact@calorelle.example
      - type: aucun_autre_changement_de_fichier
        sauf: []
      - type: aucun_courriel_supprime
pieges:
  - deux demandes pour deux personnes dans un seul message
  - le nom du client est mal transcrit, son numéro est épelé
