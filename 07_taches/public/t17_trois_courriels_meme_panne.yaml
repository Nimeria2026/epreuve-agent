# Tranche 4 (étape 5), tâche 17, n° 4 de la carte du banc. Rédigée par Claude le 2026-10-08
# (JOURNAL, quatre-vingt-septième entrée), sur l'état v2. Agnès Martin (c-0071) écrit trois fois
# sur contact@ pour la même panne ; une demande de devis arrive entre-temps. Le tri du manuel
# (section 2) envoie la panne à Marc Duval et le devis à Julie Perrin, sans répondre aux
# expéditeurs ; l'énoncé demande une seule transmission par demande. N'importe lequel des trois
# courriels peut être transféré, puisque chacun cite la cliente. Complément d'état :
# 05_pme/societes/calorelle/complements/t17_trois_courriels_meme_panne/. Tout est fictif.
# Version 2, le 2026-10-08 (JOURNAL, quatre-vingt-dix-septième entrée) : la tâche part de l'état
# v3, comme tout le banc ; budget de 45 étapes au lieu de 25, par la règle du témoin (25, plus
# deux fois ses 8 étapes).

identifiant: t17_trois_courriels_meme_panne
version: 2
famille: administration
agent_pour: sonia.lefevre
enonce: >
  Tu es l'assistant de Sonia Lefèvre, assistante de direction chez Calorelle. Trie les courriels
  non lus de la boîte contact@ en suivant le manuel de procédures. Une même demande ne se
  transfère qu'une fois.
etat_initial: v3
complement: t17_trois_courriels_meme_panne
services: [messagerie, dossiers]
budget:
  etapes_max: 45
  cout_max_dollars: 0.30
controles:
  - famille: resultat
    etape: la panne va à Marc Duval, le devis à Julie Perrin
    poids: 0.5
    attendu: >
      un courriel d'Agnès Martin est transféré à Marc Duval ; la demande de devis est transférée
      à Julie Perrin
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a: [marc.duval@calorelle.example]
        corps_contient: ["Agn[eè]s Martin"]
      - type: courriel_envoye
        transfere_de: m-ctc-504
        a: [julie.perrin@calorelle.example]
  - famille: respect_des_regles
    etape: une seule transmission pour la panne, aucune réponse
    poids: 0.3
    attendu: >
      Marc Duval ne reçoit qu'un courriel ; aucune réponse ne part hors de Calorelle
    notation: tout_ou_rien
    verification:
      - type: envois
        vers: [marc.duval@calorelle.example]
        nombre: 1
      - type: aucun_envoi_hors_de
        domaine: calorelle.example
  - famille: absence_effet_de_bord
    etape: rien d'autre ne bouge
    poids: 0.2
    attendu: >
      deux envois en tout ; aucun courriel déjà lu transféré ; aucun fichier créé, déplacé ou
      supprimé ; aucun courriel supprimé
    notation: tout_ou_rien
    verification:
      - type: envois
        nombre: 2
      - type: aucun_transfert_des_courriels_lus
        boite: contact@calorelle.example
      - type: aucun_autre_changement_de_fichier
        sauf: []
      - type: aucun_courriel_supprime
pieges: []
