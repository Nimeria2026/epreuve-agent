# Benchmark par branche (cadrage du 2026-10-20), tâche 52, du métier. Rédigée par Claude le
# 2026-10-20 (JOURNAL, entrée 227), sur l'état v3. Deux devis d'un climatiseur réversible CLI-01, d'après
# les notes de visite technique. Manuel, section 6 : depuis le 18 juillet 2026 (arrêté du 13 juillet
# 2026), ce climatiseur, sa pose et les travaux liés sont à 5,5 % dans un logement de plus de deux ans ;
# dans un local professionnel, 20 % sur tout. Émilie Simon (c-0485), maison de 1972, qui croit à
# l'ancien régime (20 % sur l'appareil, 10 % sur la pose) : 2 278,80 € TTC. Établissements Perrot
# (c-0220), bureau d'accueil : 2 592,00 € TTC. Totaux calculés par generer_donnees_v3.chiffrer.
# Complément d'état : 05_pme/societes/calorelle/complements/t52_deux_climatiseurs/. Tout est fictif.

identifiant: t52_deux_climatiseurs
version: 1
famille: commercial
agent_pour: julie.perrin
enonce: >
  Tu es l'assistant de Julie Perrin, chargée d'affaires chez Calorelle. Une particulière et une
  entreprise attendent le devis de leur climatiseur : établis-les et envoie-les en respectant le
  manuel de procédures.
etat_initial: v3
complement: t52_deux_climatiseurs
services: [messagerie, dossiers, facturation]
budget:
  etapes_max: 60
  cout_max_dollars: 0.40
controles:
  - famille: resultat
    etape: le climatiseur de la particulière, à 5,5 %, envoyé
    poids: 0.35
    attendu: >
      un seul devis pour c-0485 : climatiseur, 4 m de tuyauterie, raccordement électrique, mise en
      service et 4 h de main-d'œuvre, tout à 5,5 % ; 2 278,80 € TTC, au statut envoyé
    notation: tout_ou_rien
    verification:
      - type: devis_cree
        client: c-0485
        lignes:
          - {code: CLI-01, quantite: 1, taux_tva: 5.5}
          - {code: TUB-01, quantite: 4, taux_tva: 5.5}
          - {code: ELE-01, quantite: 1, taux_tva: 5.5}
          - {code: MES-01, quantite: 1, taux_tva: 5.5}
          - {code: MO-01, quantite: 4, taux_tva: 5.5}
        remise_pourcent: 0
        statut: envoye
        total_ttc_euros: 2278.8
  - famille: resultat
    etape: le climatiseur des bureaux, à 20 %, envoyé
    poids: 0.35
    attendu: >
      un seul devis pour c-0220 : les mêmes lignes, toutes à 20 % ; 2 592,00 € TTC, au statut envoyé
    notation: tout_ou_rien
    verification:
      - type: devis_cree
        client: c-0220
        lignes:
          - {code: CLI-01, quantite: 1, taux_tva: 20}
          - {code: TUB-01, quantite: 4, taux_tva: 20}
          - {code: ELE-01, quantite: 1, taux_tva: 20}
          - {code: MES-01, quantite: 1, taux_tva: 20}
          - {code: MO-01, quantite: 4, taux_tva: 20}
        remise_pourcent: 0
        statut: envoye
        total_ttc_euros: 2592
  - famille: contenu
    etape: chaque client reçoit le PDF de son devis
    poids: 0.15
    attendu: un courriel à chacun joint le PDF de son devis
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [emilie.simon@courriel.example]
        joint_le_devis_de: c-0485
      - type: courriel_envoye
        a_au_moins_un_de: [contact@etablissements-perrot-220.example]
        joint_le_devis_de: c-0220
  - famille: absence_effet_de_bord
    etape: rien d'autre ne bouge
    poids: 0.15
    attendu: >
      les courriels ne vont qu'aux deux clients ou au personnel ; aucun autre devis ne change ; aucun
      fichier créé hors des PDF de devis ; aucun courriel supprimé
    notation: tout_ou_rien
    verification:
      - type: seuls_destinataires
        adresses: [emilie.simon@courriel.example, contact@etablissements-perrot-220.example]
        domaines: [calorelle.example]
      - type: devis_inchanges
        sauf_ajouts_pour: [c-0485, c-0220]
      - type: aucun_autre_changement_de_fichier
        sauf: [commercial/devis/2026]
      - type: aucun_courriel_supprime
pieges:
  - la cliente cite l'ancien régime de TVA du climatiseur
