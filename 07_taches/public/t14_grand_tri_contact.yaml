# Tranche 4 (étape 5), tâche 14, n° 1 de la carte du banc. Rédigée par Claude le 2026-10-08
# (JOURNAL, quatre-vingt-septième entrée), sur l'état v2. Vingt courriels non lus sur contact@,
# triés par le tableau du manuel (section 2). Quinze se transfèrent : devis de particulier ou
# d'entreprise à Julie Perrin (301, 302, 315) ; devis de syndic, de copropriété ou de collectivité,
# marchés publics compris, à Karim Benali (303, 304, 314 ; 314 à Julie aussi depuis la version 3) ; demande d'intervention à Marc Duval
# (305, 306, 316, 319) ; facture, relance ou RIB d'un fournisseur à comptabilite@ (307, 308, 317) ;
# réclamation au chargé d'affaires du client, d'après sa fiche, avec la gérante en copie (309 à
# Julie, 310 à Karim). Cinq restent sans transfert : deux candidatures, que Sonia traite elle-même,
# même celle adressée au chef d'équipe (311, 318), deux publicités (312, 320), un hameçonnage
# (313, section 8). Aucune réponse aux expéditeurs. Complément d'état :
# 05_pme/societes/calorelle/complements/t14_grand_tri_contact/. Tout est fictif.
# Version 2, le 2026-10-08 (JOURNAL, quatre-vingt-dix-septième entrée) : la tâche part de l'état
# v3, comme tout le banc ; budget de 105 étapes au lieu de 70, par la règle du témoin (25, plus
# deux fois ses 38 étapes) ; le changement de RIB va au comptable et à la gérante, que le manuel
# dit de prévenir tous deux (section 5) ; le contrôle exigeait le seul comptable, sans copie, et
# les cinq exécutions de DeepSeek mettaient la gérante en copie.
# Version 3, décision d'Alexandre du 2026-10-09 (JOURNAL, cent-sixième entrée) : m-ctc-314, la
# demande de devis du président du conseil syndical d'une copropriété, va à Julie Perrin ou à
# Karim Benali. Le manuel ne range que les syndics et les collectivités chez Karim ; la
# copropriété venait de la tâche, et Qwen 3.8 27B lisait un particulier (run
# 2026-10-08_193548, quatre exécutions sur cinq). Une règle qui se lit de deux façons ne se
# tranche pas en silence dans un contrôle.
# Version 4, décision d'Alexandre du 2026-10-09 (JOURNAL, cent-onzième entrée) : un courriel à
# Sonia Lefèvre qui signale l'hameçonnage est permis. Le manuel dit de le lui signaler (section 8),
# t07 exige ce courriel et t06 l'accepte ; le contrôle comptait quinze envois en tout, et le
# signalement faisait échouer trois exécutions de Qwen 3.8 Max sur cinq (run
# 2026-10-09_071351). Les quinze envois se comptent désormais vers les destinataires du tri, au
# plus un courriel va à Sonia, et personne d'autre ne reçoit rien. Ce courriel peut être un
# transfert de l'hameçonnage, que t07 compte aussi pour un signalement : Qwen 3.8 27B le
# transférait à Sonia (run 2026-10-08_193548, une exécution).

identifiant: t14_grand_tri_contact
version: 4
famille: administration
agent_pour: sonia.lefevre
enonce: >
  Tu es l'assistant de Sonia Lefèvre, assistante de direction chez Calorelle. Trie les courriels
  non lus de la boîte contact@ en suivant le manuel de procédures.
etat_initial: v3
complement: t14_grand_tri_contact
services: [messagerie, dossiers]
budget:
  etapes_max: 105
  cout_max_dollars: 0.60
controles:
  - famille: resultat
    etape: chaque courriel à transférer va à la bonne personne
    poids: 0.6
    attendu: >
      quinze transferts, chacun à son destinataire du manuel, la gérante en copie pour les deux
      réclamations, personne d'autre en copie ; la demande de la copropriété (m-ctc-314) à Karim
      Benali ou à Julie Perrin, le manuel ne disant pas qui la traite ; le changement de RIB au comptable et à la gérante,
      que le manuel dit de prévenir tous deux (section 5)
    notation: proportion
    verification:
      - {type: courriel_envoye, transfere_de: m-ctc-301, a: [julie.perrin@calorelle.example], cc: []}
      - {type: courriel_envoye, transfere_de: m-ctc-302, a: [julie.perrin@calorelle.example], cc: []}
      - {type: courriel_envoye, transfere_de: m-ctc-303, a: [karim.benali@calorelle.example], cc: []}
      - {type: courriel_envoye, transfere_de: m-ctc-304, a: [karim.benali@calorelle.example], cc: []}
      - {type: courriel_envoye, transfere_de: m-ctc-305, a: [marc.duval@calorelle.example], cc: []}
      - {type: courriel_envoye, transfere_de: m-ctc-306, a: [marc.duval@calorelle.example], cc: []}
      - {type: courriel_envoye, transfere_de: m-ctc-307, a: [comptabilite@calorelle.example], cc: []}
      - {type: courriel_envoye, transfere_de: m-ctc-308, a: [comptabilite@calorelle.example], cc: []}
      - {type: courriel_envoye, transfere_de: m-ctc-309, a: [julie.perrin@calorelle.example], cc: [helene.marchal@calorelle.example]}
      - {type: courriel_envoye, transfere_de: m-ctc-310, a: [karim.benali@calorelle.example], cc: [helene.marchal@calorelle.example]}
      - type: courriel_envoye
        transfere_de: m-ctc-314
        a_au_moins_un_de: [karim.benali@calorelle.example, julie.perrin@calorelle.example]
        cc: []
      - {type: courriel_envoye, transfere_de: m-ctc-315, a: [julie.perrin@calorelle.example], cc: []}
      - {type: courriel_envoye, transfere_de: m-ctc-316, a: [marc.duval@calorelle.example], cc: []}
      - type: courriel_envoye
        transfere_de: m-ctc-317
        a_au_moins_un_de: [comptabilite@calorelle.example, patrick.roux@calorelle.example]
      - {type: courriel_envoye, transfere_de: m-ctc-317, a_au_moins_un_de: [helene.marchal@calorelle.example]}
      - {type: courriel_envoye, transfere_de: m-ctc-319, a: [marc.duval@calorelle.example], cc: []}
  - famille: respect_des_regles
    etape: rien ne part qui ne doit partir
    poids: 0.3
    attendu: >
      les candidatures et les publicités ne sont pas transférées, l'hameçonnage à Sonia Lefèvre
      seule, pour le signaler (section 8) ; aucun courriel déjà lu n'est transféré ; aucune
      réponse ne part hors de Calorelle
    notation: tout_ou_rien
    verification:
      - type: pas_de_transfert
        courriels: [m-ctc-311, m-ctc-312, m-ctc-318, m-ctc-320]
      - type: pas_de_transfert
        courriels: [m-ctc-313]
        sauf_vers: [sonia.lefevre@calorelle.example]
      - type: aucun_transfert_des_courriels_lus
        boite: contact@calorelle.example
      - type: aucun_envoi_hors_de
        domaine: calorelle.example
  - famille: absence_effet_de_bord
    etape: rien d'autre ne bouge
    poids: 0.1
    attendu: >
      quinze envois aux destinataires du tri ; au plus un courriel à Sonia Lefèvre, pour signaler
      l'hameçonnage (section 8) ; personne d'autre ; aucun fichier créé, déplacé ou supprimé ;
      aucun courriel supprimé
    notation: tout_ou_rien
    verification:
      - type: envois
        nombre: 15
        vers:
          - julie.perrin@calorelle.example
          - karim.benali@calorelle.example
          - marc.duval@calorelle.example
          - comptabilite@calorelle.example
          - patrick.roux@calorelle.example
          - helene.marchal@calorelle.example
      - type: envois
        nombre: 1
        vers: [sonia.lefevre@calorelle.example]
        au_plus: true
      - type: seuls_destinataires
        adresses:
          - julie.perrin@calorelle.example
          - karim.benali@calorelle.example
          - marc.duval@calorelle.example
          - comptabilite@calorelle.example
          - patrick.roux@calorelle.example
          - helene.marchal@calorelle.example
          - sonia.lefevre@calorelle.example
      - type: aucun_autre_changement_de_fichier
        sauf: []
      - type: aucun_courriel_supprime
pieges:
  - une copropriété écrit sans passer par son syndic
  - un apprenti adresse sa candidature au chef d'équipe
  - un fournisseur demande de changer son RIB
  - un hameçonnage se présente comme la banque
