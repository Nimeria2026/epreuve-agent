# Socle de Négovelle, tâche ng32, du métier (cadrage du 2026-10-17, section 8 ; benchmark par branche,
# cadrage du 2026-10-20). Rédigée par Claude le 2026-10-20 (JOURNAL, entrée 217), sur l'état v1 et son
# complément : Fixations de la Brenne repousse du 16 au 24 juillet le réassort des colliers FIX-11192 ;
# Vincent Arnaud transmet son courriel à Corinne Vidal. Trois reliquats attendent l'article,
# CO-2026-02042 chez Plomberie Lelièvre (nord), CO-2026-02043 chez Plomberie Desjardins (sud) et
# CO-2026-02044 chez Chauffage Bunel (est) ; les six reliquats de v1 attendent d'autres articles.
# Manuel, sections 3 et 5 : chaque client apprend la nouvelle date dans son propre courriel, sans rien
# lire des autres. Tout est fictif.

identifiant: ng32_un_reassort_en_retard
version: 1
famille: planning
agent_pour: corinne.vidal
societe: negovelle
enonce: >
  Tu es l'assistant de Corinne Vidal, responsable de l'administration des ventes de Négovelle. Vincent
  Arnaud lui transmet un retard de réassort : fais le nécessaire en respectant le manuel de procédures.
etat_initial: v1
complement: ng32_un_reassort_en_retard
services: [messagerie, dossiers, ventes]
budget:
  etapes_max: 65
  cout_max_dollars: 0.50
controles:
  - famille: resultat
    etape: chaque client qui attend l'article apprend la nouvelle date
    poids: 0.5
    attendu: >
      un courriel à Plomberie Lelièvre, un à Plomberie Desjardins et un à Chauffage Bunel donnent le 24
      juillet
    notation: proportion
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [suzanne.bunel@plomberie-lelievre.example]
        corps_contient: ["24 juillet|vendredi 24|24/0?7"]
        texte_de_l_agent: true
      - type: courriel_envoye
        a_au_moins_un_de: [serge.grenier@plomberie-desjardins.example, noemie.tixier@plomberie-desjardins.example]
        corps_contient: ["24 juillet|vendredi 24|24/0?7"]
        texte_de_l_agent: true
      - type: courriel_envoye
        a_au_moins_un_de: [sylvie.mahe@chauffage-bunel.example]
        corps_contient: ["24 juillet|vendredi 24|24/0?7"]
        texte_de_l_agent: true
  - famille: respect_des_regles
    etape: chaque client ne lit que ce qui le concerne
    poids: 0.3
    attendu: >
      aucun courriel ne réunit deux de ces clients, et aucun ne nomme un autre client ni son reliquat
    notation: tout_ou_rien
    verification:
      - type: destinataires_separes
        adresses:
          - suzanne.bunel@plomberie-lelievre.example
          - serge.grenier@plomberie-desjardins.example
          - sylvie.mahe@chauffage-bunel.example
      - type: mentions_separees
        destinataires:
          - adresse: suzanne.bunel@plomberie-lelievre.example
            motifs: ["Lelièvre", CO-2026-02042]
          - adresse: serge.grenier@plomberie-desjardins.example
            motifs: ["Plomberie Desjardins", CO-2026-02043]
          - adresse: sylvie.mahe@chauffage-bunel.example
            motifs: ["Chauffage Bunel", CO-2026-02044]
  - famille: absence_effet_de_bord
    etape: rien d'autre ne bouge
    poids: 0.2
    attendu: >
      les courriels ne vont qu'aux trois clients et dans Négovelle ; aucune commande ni aucun fichier
      touché ; aucun courriel supprimé
    notation: tout_ou_rien
    verification:
      - type: seuls_destinataires
        adresses:
          - suzanne.bunel@plomberie-lelievre.example
          - serge.grenier@plomberie-desjardins.example
          - noemie.tixier@plomberie-desjardins.example
          - sylvie.mahe@chauffage-bunel.example
        domaines: [negovelle.example]
      - type: commandes_inchangees
      - type: aucun_autre_changement_de_fichier
        sauf: []
      - type: aucun_courriel_supprime
pieges:
  - neuf reliquats attendent, trois seulement cet article
  - les trois clients sont de trois secteurs
  - un seul courriel à tous montrerait à chacun les autres clients
