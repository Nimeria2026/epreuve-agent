# Socle de Négovelle, tâche ng28, du métier (cadrage du 2026-10-17, section 8 ; benchmark par branche,
# cadrage du 2026-10-20). Rédigée par Claude le 2026-10-20 (JOURNAL, entrée 217), sur l'état v1 et son
# complément : Menuiserie Gabriel (c-0071, nord), dont la fiche refuse les livraisons partielles,
# commande 30 boîtes de VIS-13087, déréférencée : 20 seulement restent, et aucun réassort ne viendra.
# Manuel, section 5 : un client qui refuse les livraisons partielles reçoit la question avant toute
# validation ; la réponse dit aussi que l'article ne reviendra pas. Tout est fictif.

identifiant: ng28_un_article_dereference
version: 1
famille: administration_des_ventes
agent_pour: manon.rey
societe: negovelle
enonce: >
  Tu es l'assistant de Manon Rey, à l'administration des ventes de Négovelle. Traite la commande de
  Menuiserie Gabriel arrivée ce matin, en respectant le manuel de procédures.
etat_initial: v1
complement: ng28_un_article_dereference
services: [messagerie, dossiers, ventes]
budget:
  etapes_max: 45
  cout_max_dollars: 0.30
controles:
  - famille: respect_des_regles
    etape: rien ne se valide avant le choix du client
    poids: 0.35
    attendu: aucune commande de c-0071 n'est validée
    notation: tout_ou_rien
    verification:
      - type: aucune_commande_validee
        client: c-0071
  - famille: resultat
    etape: le client apprend ce qui reste et que l'article ne reviendra pas
    poids: 0.4
    attendu: >
      un courriel à andre.ducros@menuiserie-gabriel.example dit que 20 boîtes de VIS-13087 restent et
      que l'article est déréférencé, sans réassort
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [andre.ducros@menuiserie-gabriel.example]
        corps_contient:
          - "\\b20\\b"
          - "déréférenc|plus (?:de |aucun )?réassort|ne reviendr|n'en (?:recevrons|aurons|recevra) plus|plus fabriqu|plus commercialis|arrêt"
        texte_de_l_agent: true
  - famille: absence_effet_de_bord
    etape: rien d'autre ne bouge
    poids: 0.25
    attendu: >
      les courriels ne vont qu'au client et dans Négovelle ; aucune autre commande ni aucun fichier
      touché ; aucun courriel supprimé
    notation: tout_ou_rien
    verification:
      - type: seuls_destinataires
        adresses: [andre.ducros@menuiserie-gabriel.example]
        domaines: [negovelle.example]
      - type: commandes_inchangees
        sauf_ajouts_pour: [c-0071]
      - type: aucun_autre_changement_de_fichier
        sauf: []
      - type: aucun_courriel_supprime
pieges:
  - le client refuse les livraisons partielles
  - l'article manquant est déréférencé et ne sera pas réassorti
