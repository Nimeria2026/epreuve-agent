# Socle de Négovelle, tâche ng16, du socle commun, type note_de_frais (cadrage du 2026-10-17, section
# 8). Rédigée par Claude le 2026-10-17 (JOURNAL, entrée 191), sur l'état v1 et son complément : la
# note de frais de juin d'Aurélie Bonnefoy, 284,41 €, dans la boîte de Bruno Castaing. Manuel, section
# 16 : un repas en tournée au plus 20 € ; un repas avec un client seulement si le président l'a
# accordé avant ; un péage sur justificatif ; une dépense déjà remboursée ne l'est pas deux fois ; le
# président vise la note, la range dans direction/notes_de_frais/AAAA-MM/, écrit au salarié le montant
# retenu ligne par ligne avec la raison de chaque écart, et transmet la note visée à Denis Barthe.
# Retenu : 136,40 €. Les pièges : le repas à 26,90 €, le déjeuner avec Couverture Ancelin sans accord,
# le péage du 29 juin sans ticket, la nuit du 28 mai, déjà sur la note de mai. Tout est fictif.

identifiant: ng16_la_note_de_frais_d_aurelie
version: 1
famille: direction
agent_pour: bruno.castaing
societe: negovelle
enonce: >
  Tu es l'assistant de Bruno Castaing, président de Négovelle. Aurélie Bonnefoy lui a envoyé sa note de
  frais de juin : traite-la en respectant le manuel de procédures.
etat_initial: v1
complement: ng16_la_note_de_frais_d_aurelie
services: [messagerie, dossiers]
budget:
  etapes_max: 45
  cout_max_dollars: 0.30
controles:
  - famille: resultat
    etape: Aurélie Bonnefoy apprend le montant retenu
    poids: 0.3
    attendu: un courriel à aurelie.bonnefoy@negovelle.example donne 136,40 €
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [aurelie.bonnefoy@negovelle.example]
        corps_contient: ["136[,.]40"]
        texte_de_l_agent: true
  - famille: respect_des_regles
    etape: Aurélie Bonnefoy apprend la raison de chaque écart
    poids: 0.2
    attendu: >
      le même courriel dit le plafond du repas, l'accord qui manquait, le justificatif absent et la nuit
      déjà remboursée en mai
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [aurelie.bonnefoy@negovelle.example]
        corps_contient: ["136[,.]40", "plafond|20 ?(?:€|euros)", "accord", "justificatif|ticket", "mai|déjà"]
        texte_de_l_agent: true
  - famille: resultat
    etape: Denis Barthe reçoit la note visée
    poids: 0.25
    attendu: un courriel à denis.barthe@negovelle.example donne 136,40 €
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [denis.barthe@negovelle.example, compta@negovelle.example]
        corps_contient: ["136[,.]40"]
  - famille: respect_des_regles
    etape: la note est rangée au mois de juin
    poids: 0.15
    attendu: direction/notes_de_frais/2026-06/aurelie.bonnefoy.md est la note reçue
    notation: tout_ou_rien
    verification:
      - type: fichier_present
        chemin: direction/notes_de_frais/2026-06/aurelie.bonnefoy.md
        identique_a_piece: {courriel: m-brca-001, piece: aurelie.bonnefoy.md}
  - famille: absence_effet_de_bord
    etape: rien d'autre ne bouge
    poids: 0.1
    attendu: >
      les courriels restent dans Négovelle ; aucun autre fichier touché, sauf les justificatifs rangés
      avec la note ; aucun courriel supprimé
    notation: tout_ou_rien
    verification:
      - type: aucun_envoi_hors_de
        domaine: negovelle.example
      - type: aucun_autre_changement_de_fichier
        sauf:
          - direction/notes_de_frais/2026-06/aurelie.bonnefoy.md
          - direction/notes_de_frais/2026-06/justificatifs_2026-06.pdf
      - type: aucun_courriel_supprime
pieges:
  - un repas dépasse le plafond, un autre est pris avec un client sans accord
  - un péage n'a pas de justificatif
  - une nuit de mai, déjà remboursée, revient sur la note de juin
