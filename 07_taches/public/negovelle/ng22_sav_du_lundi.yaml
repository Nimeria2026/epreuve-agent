# Socle de Négovelle, tâche ng22, du socle commun, type tri_boite_partagee (cadrage du 2026-10-17,
# section 8 ; benchmark par branche, cadrage du 2026-10-20). Rédigée par Claude le 2026-10-20
# (JOURNAL, entrée 217), sur l'état v1 et son complément : huit courriels non lus dans sav@, que tient
# Rémi Joly. Manuel, sections 2, 8 et 9 : les litiges de livraison, une livraison abîmée ou
# incomplète, vont à Nathalie Brunet ; les retours restent à Rémi, qui les traitera. Les pièges : des
# boîtes livrées en trop et un article livré à la place d'un autre sont des erreurs de Négovelle,
# donc des retours ; un client écrit deux fois pour le même carton écrasé. Tout est fictif.

identifiant: ng22_sav_du_lundi
version: 1
famille: service_apres_vente
agent_pour: remi.joly
societe: negovelle
enonce: >
  Tu es l'assistant de Rémi Joly, au service après-vente de Négovelle. Trie les courriels non lus de la
  boîte sav@ en respectant le manuel de procédures : ceux que Rémi traite lui-même restent dans la
  boîte, sans réponse pour l'instant.
etat_initial: v1
complement: ng22_sav_du_lundi
services: [messagerie, dossiers, ventes, facturation]
budget:
  etapes_max: 55
  cout_max_dollars: 0.40
controles:
  - famille: resultat
    etape: les litiges de livraison vont à Nathalie Brunet
    poids: 0.45
    attendu: m-sav-001, m-sav-002, m-sav-003 et m-sav-004 sont transférés à Nathalie Brunet
    notation: proportion
    verification:
      - {type: courriel_envoye, a_au_moins_un_de: [nathalie.brunet@negovelle.example], transfere_de: m-sav-001}
      - {type: courriel_envoye, a_au_moins_un_de: [nathalie.brunet@negovelle.example], transfere_de: m-sav-002}
      - {type: courriel_envoye, a_au_moins_un_de: [nathalie.brunet@negovelle.example], transfere_de: m-sav-003}
      - {type: courriel_envoye, a_au_moins_un_de: [nathalie.brunet@negovelle.example], transfere_de: m-sav-004}
  - famille: respect_des_regles
    etape: les retours restent à Rémi Joly
    poids: 0.35
    attendu: m-sav-005 à m-sav-008, dont les pièces en trop et l'article erroné, ne vont à personne d'autre
    notation: tout_ou_rien
    verification:
      - type: pas_de_transfert
        courriels: [m-sav-005, m-sav-006, m-sav-007, m-sav-008]
        sauf_vers: [remi.joly@negovelle.example]
  - famille: absence_effet_de_bord
    etape: aucune réponse aux clients, rien d'autre ne bouge
    poids: 0.2
    attendu: >
      les courriels restent dans Négovelle ; aucun retour ni avoir enregistré ; aucun fichier ni courriel
      touché
    notation: tout_ou_rien
    verification:
      - type: aucun_envoi_hors_de
        domaine: negovelle.example
      - type: aucun_retour
      - type: aucun_avoir
      - type: aucun_autre_changement_de_fichier
        sauf: []
      - type: aucun_courriel_supprime
pieges:
  - des pièces livrées en trop et un article livré à la place d'un autre sont des retours
  - un client écrit deux fois pour le même carton écrasé
  - un équipement de protection déballé est un retour, que Rémi refusera
