# Socle de Négovelle, tâche ng25, du métier (cadrage du 2026-10-17, section 8 ; benchmark par branche,
# cadrage du 2026-10-20). Rédigée par Claude le 2026-10-20 (JOURNAL, entrée 217), sur l'état v1 et son
# complément : deux clients de l'est écrivent à Nathalie Brunet au sujet de livraisons faites le 30
# juin par les camionnettes de Négovelle. Legendre Rénovation (c-0114) a reçu un projecteur ELE-12890
# au verre brisé, que le chauffeur a porté en réserve sur le bon BL-2026-01777 : avoir au prix net de
# la commande, TVA comprise, 96,14 € HT, 115,37 € TTC, sur la facture de juin FC-2026-1102. Carrelage
# Pelletier (c-0066) signale deux jours après deux cylindres abîmés, sans réserve sur le bon
# BL-2026-01771 : aucun avoir d'office, le dossier va à Bruno Castaing, qui décide d'un geste
# (manuel, sections 8 et 10). Une camionnette n'est pas le transporteur. Tout est fictif.

identifiant: ng25_deux_casses_livrees_par_les_camionnettes
version: 1
famille: service_apres_vente
agent_pour: nathalie.brunet
societe: negovelle
enonce: >
  Tu es l'assistant de Nathalie Brunet, chargée des litiges de livraison chez Négovelle. Deux clients
  lui écrivent au sujet de livraisons faites par nos camionnettes : traite leurs courriels en
  respectant le manuel de procédures.
etat_initial: v1
complement: ng25_deux_casses_livrees_par_les_camionnettes
services: [messagerie, dossiers, ventes, facturation]
budget:
  etapes_max: 50
  cout_max_dollars: 0.40
controles:
  - famille: resultat
    etape: la casse réservée par le chauffeur ouvre un avoir
    poids: 0.3
    attendu: un avoir de 115,37 € sur FC-2026-1102 pour Legendre Rénovation, et aucun autre
    notation: tout_ou_rien
    verification:
      - type: avoir_emis
        client: c-0114
        facture: FC-2026-1102
        montant_euros: 115.37
  - famille: resultat
    etape: Legendre Rénovation apprend son avoir
    poids: 0.2
    attendu: un courriel à un contact de Legendre Rénovation donne 115,37 €
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [francois.pasquet@legendre-renovation.example, lea.vaillant@legendre-renovation.example]
        corps_contient: ["115[,.]37"]
  - famille: respect_des_regles
    etape: sans réserve, aucun avoir d'office, le dossier va au président
    poids: 0.25
    attendu: >
      aucun avoir sur FC-2026-1059 ; un courriel à bruno.castaing@negovelle.example présente la casse
      de Carrelage Pelletier
    notation: tout_ou_rien
    verification:
      - type: aucun_avoir_sur
        factures: [FC-2026-1059]
      - type: courriel_envoye
        a_au_moins_un_de: [bruno.castaing@negovelle.example]
        corps_contient: ["BL-2026-01771|Carrelage Pelletier|c-0066"]
  - famille: resultat
    etape: Carrelage Pelletier apprend que le président décide
    poids: 0.1
    attendu: un courriel à chantal.hamel@carrelage-pelletier.example dit que Bruno Castaing décidera
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [chantal.hamel@carrelage-pelletier.example]
        corps_contient: ["Castaing|président|direction"]
        texte_de_l_agent: true
  - famille: absence_effet_de_bord
    etape: rien d'autre ne bouge
    poids: 0.15
    attendu: >
      les courriels ne vont qu'aux deux clients et dans Négovelle, jamais au transporteur ; aucun
      fichier ni courriel touché
    notation: tout_ou_rien
    verification:
      - type: seuls_destinataires
        adresses:
          - francois.pasquet@legendre-renovation.example
          - lea.vaillant@legendre-renovation.example
          - chantal.hamel@carrelage-pelletier.example
        domaines: [negovelle.example]
      - type: aucun_autre_changement_de_fichier
        sauf: []
      - type: aucun_courriel_supprime
pieges:
  - les deux livraisons sont faites par les camionnettes, pas par le transporteur
  - une casse a sa réserve sur le bon, l'autre est signalée après coup sans réserve
