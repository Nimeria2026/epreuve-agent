# Socle de Négovelle, tâche ng29, du métier (cadrage du 2026-10-17, section 8 ; benchmark par branche,
# cadrage du 2026-10-20). Rédigée par Claude le 2026-10-20 (JOURNAL, entrée 217), sur l'état v1 et son
# complément : Électricité Chatelain (c-0078, sud, catégorie C) commande pour 318,45 € HT au tarif et
# demande la livraison franco. Manuel, section 5 : le franco vaut à partir de 300 € HT de
# marchandises ; après la remise de 8 %, elles font 292,94 € HT, et le port standard de 15 € HT
# s'applique, comme le chiffre le logiciel : 307,94 € HT, 369,53 € TTC. Tout est fictif.

identifiant: ng29_le_franco_apres_la_remise
version: 1
famille: administration_des_ventes
agent_pour: laetitia.garnier
societe: negovelle
enonce: >
  Tu es l'assistant de Lætitia Garnier, à l'administration des ventes de Négovelle. Saisis et confirme
  la commande d'Électricité Chatelain arrivée ce matin, en respectant le manuel de procédures.
etat_initial: v1
complement: ng29_le_franco_apres_la_remise
services: [messagerie, dossiers, ventes]
budget:
  etapes_max: 45
  cout_max_dollars: 0.30
controles:
  - famille: resultat
    etape: la commande se valide, port compris
    poids: 0.35
    attendu: >
      une commande de c-0078, validée en standard, livrée à l'adresse L1, porte 2 ELE-11453, 2
      ELE-12384 et 15 ELE-12327
    notation: tout_ou_rien
    verification:
      - type: commande_creee
        client: c-0078
        lignes:
          - {reference: ELE-11453, quantite: 2}
          - {reference: ELE-12384, quantite: 2}
          - {reference: ELE-12327, quantite: 15}
        statut: validee
        livraison: L1
        mode: standard
  - famille: resultat
    etape: la cliente apprend pourquoi le port s'applique
    poids: 0.4
    attendu: >
      un courriel à un contact d'Électricité Chatelain donne le port de 15 € et dit que le franco se
      compte après la remise
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [suzanne.rigaud@electricite-chatelain.example, dominique.granger@electricite-chatelain.example]
        corps_contient: ["\\b15(?:[,.]00)? ?(?:€|euros)", "remise|net|292[,.]94"]
        texte_de_l_agent: true
  - famille: absence_effet_de_bord
    etape: rien d'autre ne bouge
    poids: 0.25
    attendu: >
      les courriels ne vont qu'aux contacts de la cliente et dans Négovelle ; aucun prix accordé ; aucune
      autre commande ni aucun fichier touché ; aucun courriel supprimé
    notation: tout_ou_rien
    verification:
      - type: seuls_destinataires
        adresses: [suzanne.rigaud@electricite-chatelain.example, dominique.granger@electricite-chatelain.example]
        domaines: [negovelle.example]
      - type: aucun_prix_accorde
      - type: commandes_inchangees
        sauf_ajouts_pour: [c-0078]
      - type: aucun_autre_changement_de_fichier
        sauf: []
      - type: aucun_courriel_supprime
pieges:
  - le tarif dépasse 300 € HT, les marchandises remisées non
  - la cliente invoque les conditions de vente pour réclamer le franco
