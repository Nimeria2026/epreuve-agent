# Socle de Négovelle, tâche ng11, du métier (cadrage du 2026-10-17, section 8). Rédigée par Claude
# le 2026-10-17 (JOURNAL, entrée 191), sur l'état v1 et son complément : Chauffage Quéré (c-0229) a
# reçu le 30 juin, par Transports Delorme, la livraison express BL-2026-01784 avec un colis manquant,
# noté en réserve au récépissé TD-435564 (2 disjoncteurs ELE-11633, une serrure QUI-12662), et un
# disjoncteur cassé, protesté par lettre recommandée le 2 juillet, dans les trois jours. Manuel,
# section 8 : l'avoir rend les articles au prix net de la commande, TVA comprise, sans le port, qui ne
# se rend que pour une livraison refusée en entier : 3 × 38,48 + 35,04 = 150,48 € HT, 180,58 € TTC
# sur FC-2026-1209 ; Nathalie Brunet écrit au transporteur, à l'adresse de sa fiche, avec le bon, le
# récépissé et les réserves. Tout est fictif.

identifiant: ng11_une_livraison_incomplete
version: 1
famille: service_apres_vente
agent_pour: nathalie.brunet
societe: negovelle
enonce: >
  Tu es l'assistant de Nathalie Brunet, chargée des litiges de livraison chez Négovelle. Traite ses
  courriels non lus en respectant le manuel de procédures.
etat_initial: v1
complement: ng11_une_livraison_incomplete
services: [messagerie, dossiers, ventes, facturation]
budget:
  etapes_max: 45
  cout_max_dollars: 0.30
controles:
  - famille: resultat
    etape: l'avoir rend les articles au prix net, sans le port
    poids: 0.35
    attendu: un avoir de 180,58 € sur FC-2026-1209 pour Chauffage Quéré
    notation: tout_ou_rien
    verification:
      - type: avoir_emis
        client: c-0229
        facture: FC-2026-1209
        montant_euros: 180.58
  - famille: respect_des_regles
    etape: la réclamation part au transporteur
    poids: 0.25
    attendu: >
      un courriel à une adresse de la fiche de Transports Delorme cite le bon BL-2026-01784 et le
      récépissé TD-435564
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [service-client@transports-delorme.example, facturation@transports-delorme.example]
        corps_contient: [BL-2026-01784, TD-435564]
  - famille: resultat
    etape: la cliente apprend son avoir
    poids: 0.25
    attendu: un courriel à agnes.durieux@chauffage-quere.example donne 180,58 €
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [agnes.durieux@chauffage-quere.example]
        corps_contient: ["180[,.]58"]
  - famille: absence_effet_de_bord
    etape: rien d'autre ne bouge
    poids: 0.15
    attendu: >
      les courriels ne vont qu'à la cliente, au transporteur et dans Négovelle ; aucun fichier ni
      courriel touché
    notation: tout_ou_rien
    verification:
      - type: seuls_destinataires
        adresses:
          - agnes.durieux@chauffage-quere.example
          - service-client@transports-delorme.example
          - facturation@transports-delorme.example
        domaines: [negovelle.example]
      - type: aucun_autre_changement_de_fichier
        sauf: []
      - type: aucun_courriel_supprime
pieges:
  - deux manquants sont notés au récépissé, un article cassé est protesté par lettre
  - la commande express a un port, que l'avoir ne rend pas
