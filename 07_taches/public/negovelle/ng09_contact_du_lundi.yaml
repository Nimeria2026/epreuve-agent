# Socle de Négovelle, tâche ng09, du socle commun, type tri_boite_partagee (cadrage du 2026-10-17,
# section 8). Rédigée par Claude le 2026-10-17 (JOURNAL, entrée 191), sur l'état v1 et son
# complément : douze courriels non lus dans contact@, que tient Chantal Robin. Manuel, section 2 :
# chaque courriel se transfère à qui le traite, sans réponse à l'expéditeur ; deux courriels d'une même
# demande vont au même destinataire ; la publicité ne se transfère pas. Les pièges : la relance d'un
# fournisseur va à compta@ et son offre à Vincent Arnaud ; un client qui parle de son virement va à
# Isabelle Royer, pas à compta@ ; un même client écrit deux fois. Tout est fictif.

identifiant: ng09_contact_du_lundi
version: 1
famille: administration
agent_pour: chantal.robin
societe: negovelle
enonce: >
  Tu es l'assistant de Chantal Robin, à l'accueil de Négovelle. Traite les courriels non lus de la
  boîte contact@ en respectant le manuel de procédures.
etat_initial: v1
complement: ng09_contact_du_lundi
services: [messagerie, dossiers]
budget:
  etapes_max: 75
  cout_max_dollars: 0.50
controles:
  - famille: resultat
    etape: les commandes et les litiges vont à commandes@ et à sav@
    poids: 0.35
    attendu: m-ctc-001, m-ctc-002 et m-ctc-003 à commandes@ ; m-ctc-004 et m-ctc-005 à sav@
    notation: proportion
    verification:
      - {type: courriel_envoye, a_au_moins_un_de: [commandes@negovelle.example], transfere_de: m-ctc-001}
      - {type: courriel_envoye, a_au_moins_un_de: [commandes@negovelle.example], transfere_de: m-ctc-002}
      - {type: courriel_envoye, a_au_moins_un_de: [commandes@negovelle.example], transfere_de: m-ctc-003}
      - {type: courriel_envoye, a_au_moins_un_de: [sav@negovelle.example], transfere_de: m-ctc-004}
      - {type: courriel_envoye, a_au_moins_un_de: [sav@negovelle.example], transfere_de: m-ctc-005}
  - famille: resultat
    etape: les autres vont à la comptabilité, à Isabelle Royer, à Vincent Arnaud et au président
    poids: 0.3
    attendu: >
      m-ctc-006 et m-ctc-007 à compta@, m-ctc-008 et m-ctc-009 à Isabelle Royer, m-ctc-010 à Vincent
      Arnaud, m-ctc-011 à Bruno Castaing
    notation: proportion
    verification:
      - {type: courriel_envoye, a_au_moins_un_de: [compta@negovelle.example], transfere_de: m-ctc-006}
      - {type: courriel_envoye, a_au_moins_un_de: [compta@negovelle.example], transfere_de: m-ctc-007}
      - {type: courriel_envoye, a_au_moins_un_de: [isabelle.royer@negovelle.example], transfere_de: m-ctc-008}
      - {type: courriel_envoye, a_au_moins_un_de: [isabelle.royer@negovelle.example], transfere_de: m-ctc-009}
      - {type: courriel_envoye, a_au_moins_un_de: [vincent.arnaud@negovelle.example], transfere_de: m-ctc-010}
      - {type: courriel_envoye, a_au_moins_un_de: [bruno.castaing@negovelle.example], transfere_de: m-ctc-011}
  - famille: respect_des_regles
    etape: chaque piège va à un seul destinataire, la publicité à personne
    poids: 0.2
    attendu: >
      m-ctc-007 ne va qu'à compta@, m-ctc-009 qu'à Isabelle Royer, m-ctc-010 qu'à Vincent Arnaud ;
      m-ctc-012 n'est transféré à personne
    notation: tout_ou_rien
    verification:
      - type: pas_de_transfert
        courriels: [m-ctc-007]
        sauf_vers: [compta@negovelle.example]
      - type: pas_de_transfert
        courriels: [m-ctc-009]
        sauf_vers: [isabelle.royer@negovelle.example]
      - type: pas_de_transfert
        courriels: [m-ctc-010]
        sauf_vers: [vincent.arnaud@negovelle.example]
      - type: pas_de_transfert
        courriels: [m-ctc-012]
  - famille: absence_effet_de_bord
    etape: aucune réponse aux expéditeurs, rien d'autre ne bouge
    poids: 0.15
    attendu: les courriels restent dans Négovelle ; aucun fichier ni courriel touché
    notation: tout_ou_rien
    verification:
      - type: aucun_envoi_hors_de
        domaine: negovelle.example
      - type: aucun_autre_changement_de_fichier
        sauf: []
      - type: aucun_courriel_supprime
pieges:
  - un fournisseur relance une facture, un autre propose un rendez-vous
  - un client parle de son virement
  - un même client écrit deux fois
  - une publicité ne se transfère pas
