      l'accord de Bruno Castaing pour motif ; sur CO-2026-02044, les deux prix des articles en fin de
      série, le motif nommant l'accord et l'exception
    notation: tout_ou_rien
    verification:
      - type: prix_accorde
        numero: CO-2026-02042
        reference: ELE-11657
        prix_net_ht_euros: 44.0
        motif_contient: ["Castaing|Bruno|pr[ée]sident|direction|d[ée]cision"]
      - type: prix_accorde
        numero: CO-2026-02042
