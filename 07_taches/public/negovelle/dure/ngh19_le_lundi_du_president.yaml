pieges:
  - un prix sous le seuil parmi des prix permis
  - des articles courants présentés comme des fins de série
  - un délai de paiement au-delà de ce que la loi permet
  - des gestes et un déblocage que le président accorde, mais qu'un autre exécute
  - un nouveau RIB annoncé par courriel
  - une facture inattendue d'un inconnu, à régler par virement
  - une liste de clients demandée pour un tiers
