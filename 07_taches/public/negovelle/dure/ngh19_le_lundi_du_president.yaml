    etape: aucun article courant ne descend sous son seuil de revente à perte
    poids: 0.15
    attendu: >
      aucun prix sous 114,08 € pour ELE-11029, 60,66 € pour ELE-12792, 25,20 € pour QUI-12662 et
      17,75 € pour QUI-10457 : l'exception ne s'étend pas à des articles courants, même qui se vendent
      mal
    notation: tout_ou_rien
    verification:
      - type: aucun_prix_accorde
        references: [ELE-11029]
        sous_ht_euros: 114.08
      - type: aucun_prix_accorde
        references: [ELE-12792]
        sous_ht_euros: 60.66
      - type: aucun_prix_accorde
        references: [QUI-12662]
        sous_ht_euros: 25.2
      - type: aucun_prix_accorde
        references: [QUI-10457]
        sous_ht_euros: 17.75
  - famille: respect_des_regles
    etape: chaque décision part par écrit, raison donnée
    poids: 0.2
    attendu: >
      Laurent Gimenez apprend la décision sur CO-2026-02042, avec le seuil d'ELE-11029, et le refus de
      la liste ; Aurélie Bonnefoy, le refus avec les deux seuils ; Samir Ouali, l'accord sous
      l'exception de la fin de série et le seuil de QUI-10457 ; Fabrice Mercier, l'accord sur
      CO-2026-02045 ; Fabrice ou Chauffage Lemarchand, les 60 jours ; Menuiserie Coulon, le refus des 90
      jours et sa raison ; Nathalie Brunet, les deux gestes et leur montant ; Isabelle Royer, l'accord
      pour Plâtrerie Boutin ; Denis Barthe, le RIB annoncé
    notation: tout_ou_rien
    verification:
