      - type: commande_creee
        client: c-0334
        lignes: [{reference: FIX-10702, quantite: 20}, {reference: CON-10195, quantite: 12}]
        statut: validee
        livraison: L1
      - {type: courriel_envoye, a_au_moins_un_de: [jacqueline.granger@menuiserie-delaunay.example], corps_contient: ["11 ao[ûu]t|demain", "25[,.]00|25 ?€"], texte_de_l_agent: true}
      - {type: courriel_envoye, a_au_moins_un_de: [martine.cadiou@platrerie-blanchet.example], corps_contient: ["15[,.]00|15 ?€", "191[,.]71"], texte_de_l_agent: true}
