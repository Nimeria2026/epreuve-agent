      - {type: courriel_envoye, a_au_moins_un_de: [aurelie.dufour@rocher-industrie.example, etienne.boisson@rocher-industrie.example], corps_contient: ["CO-2026-[0-9]{5}", "13 ao[ûu]t"], texte_de_l_agent: true}
      - {type: courriel_envoye, a_au_moins_un_de: [maxime.combes@auger-maintenance.example, jean.gabriel@auger-maintenance.example], corps_contient: ["CO-2026-[0-9]{5}", "13 ao[ûu]t"], texte_de_l_agent: true}
      - {type: courriel_envoye, a_au_moins_un_de: [hugo.desjardins@charpente-dore.example, julie.cazenave@charpente-dore.example], corps_contient: ["CO-2026-[0-9]{5}", "13 ao[ûu]t"], texte_de_l_agent: true}
