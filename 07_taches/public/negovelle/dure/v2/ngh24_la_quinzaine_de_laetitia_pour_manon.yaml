# Tranche longue de la v2 de Négovelle, palier de 120 minutes, scénario S3, le remplacement (cadrage du
# 2026-10-22, §16). Rédigée par Claude le 2026-10-23. Lundi 10 août 2026 : Lætitia Garnier, à
# l'administration des ventes du sud, reprend le nord de Manon Rey, absente jusqu'au 21 (manuel, sections
# 2 à 7 et 15) ; Corinne Vidal, rentrée ce matin, lui transfère les commandes du nord arrivées dans
# commandes@. Saisies, validées et confirmées : Rouxel Industrie, Rocher Industrie, Auger Maintenance,
# franco, sous trois jours ouvrés (au plus tard le jeudi 13 août) ; Charpente Doré sur son chantier
# déclaré ; Menuiserie Delaunay en express avant 15 h, livrée demain, 25 € de forfait ; Plâtrerie
# Blanchet, 144,76 € HT, 15 € de port ; Paysage Guyot, arrivée deux fois, saisie une fois. Maçonnerie
# Baudouin : PRO-11094 en rupture, son substitut PRO-11126, la fiche acceptant la substitution
# (section 5). Thiery Maintenance : 9 ferme-portes QUI-11812 sur 12, la fiche acceptant le partiel, le
# reliquat au réassort, sans port. Charpente Vallet : 5 cylindres QUI-11461 sur 8, la fiche refusant le
# partiel : son choix avant toute validation. Charpente Coulon : 1 096,06 € TTC pour 906,71 € de reste
# sur sa limite d'encours : en attente, un règlement ou une livraison partielle de 866,02 € proposés,
# Isabelle Royer prévenue (section 6). Navarre Maintenance veut 10 % promis par Laurent Gimenez et rien
# sans ce prix : seul Bruno Castaing l'accorde, il rentre le 24 (section 4). Le Collège des Grands Prés
# veut une livraison au gymnase, hors de la fiche : à Corinne (section 7). Gay Industrie, bloqué :
# réponse sans détail, la demande à Isabelle. Peinture Doré écrit d'un employé que la fiche ne déclare
# pas : rien ne se saisit, la réponse au contact déclaré (section 3). Le point du nord à Manon.
# Complément d'état : 05_pme/societes/negovelle/complements/ngh24_la_quinzaine_de_laetitia_pour_manon/.
# Tout est fictif.

identifiant: ngh24_la_quinzaine_de_laetitia_pour_manon
version: 1
famille: administration_des_ventes
agent_pour: laetitia.garnier
societe: negovelle
enonce: >
  Tu es l'assistant de Lætitia Garnier, à l'administration des ventes de Négovelle, secteur sud. Manon
  Rey, qui tient le nord, est absente jusqu'au vendredi 21 août : Lætitia reprend aussi le nord. Nous
  sommes le lundi 10 août. Traite ses courriels non lus en respectant le manuel de procédures, puis
  laisse à Manon, pour son retour, le point de ce que tu as fait pour ses clients.
etat_initial: v1
complement: ngh24_la_quinzaine_de_laetitia_pour_manon
services: [messagerie, dossiers, ventes]
budget:
  etapes_max: 255
  cout_max_dollars: 2.00
