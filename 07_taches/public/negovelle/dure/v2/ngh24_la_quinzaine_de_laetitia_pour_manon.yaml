    etape: l'express part avant 15 h, et le port suit le franco
    poids: 0.08
    attendu: >
      Menuiserie Delaunay est livrée demain en express, forfait de 25 € HT ; Plâtrerie Blanchet, sous 300 € HT,
      paie 15 € de port ; chacune a sa confirmation
