# Tranche longue de la v2 de Négovelle, palier de 240 minutes, scénario S2, la clôture (cadrage du
# 2026-10-22, §16). Rédigée par Claude le 2026-10-23. Lundi 31 août 2026 : Isabelle Royer relance les
# factures de juin et de juillet de quarante clients, au relevé de juillet et à celui d'août (manuel,
# sections 3, 6, 10 et 11 : un rappel à partir du 7e jour après l'échéance, une seconde relance avec les
# 40 € à partir du 21e, une mise en demeure et le blocage à partir du 30e ; un règlement lu au relevé
# arrête la relance ; comptant pour un client nouveau ses six premiers mois, puis 30 jours). Mises en
# demeure et blocages : Morel Travaux publics, Navarre Rénovation (le virement « NAVARRE » règle la
# facture de Navarre Maintenance), Chauffage Clerc (1 401,66 €, l'avoir du 25 août déduit), Péron
# Rénovation (au comptant jusqu'au 8 septembre), Plomberie Hervé (sa facture de juillet réglée, pas
# celle de juin), Hamel et Fils, l'Office public de l'habitat du Val de Vaumoreau. Secondes relances :
# Garage Quéré (le virement « QUÉRÉ » est celui de Quéré Rénovation), Électricité Lacour, Becker
# Industrie. Rappels : le Syndicat d'électrification du canton de Laubrissac, Plâtrerie Chatelain (à 30
# jours depuis ses six mois, le 8 juillet, quand sa fiche dit encore comptant), la Résidence autonomie
# de Corvalet, la Mairie de Mérolles-en-Brenne (échue de 7 jours). Rien : Ernault Travaux publics et
# Ateliers Lagarde (60 jours), Maçonnerie Allard (30 jours depuis le 22 juillet), Maçonnerie Bocquet,
# Quéré Rénovation, Électricité Grondin, Durieux Bâtiment (réglée moins l'avoir). Déblocages : trois sur
# l'accord écrit de Bruno du 24 août (ngh26), Électricité Lagarde après son règlement ; Couverture
# Bellanger, dont l'acompte laisse la commande 66,68 € au-delà de sa limite, attend ; Carrelage Grondin,
# bloqué, ne se débloque pas. Questions : deux clients nouveaux, 90 jours refusés, un virement, un
# cabinet comptable que la fiche ne déclare pas. Le point à Bruno. Complément d'état :
# 05_pme/societes/negovelle/complements/ngh27_la_fin_d_aout_d_isabelle_royer/. Tout est fictif.

