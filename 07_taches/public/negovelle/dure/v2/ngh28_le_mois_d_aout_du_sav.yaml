pieges:
  - un délai de trois jours qui saute un jour férié, un autre dépassé
  - une protestation par simple courriel, un bon de camionnette sans réserve
  - une réserve portée par le chauffeur, sans transporteur
  - une livraison d'août, dont l'avoir attend la facture
  - une livraison refusée, son retour, le rebut et le port rendu
  - une erreur de préparation, sans décote, et une autre que le contrôle n'a pas encore vue
  - des retours après 30 jours, déballés, en fin de série, déréférencés, commandés spécialement
  - un retour dont une boîte est entamée
  - un recommandé le troisième jour, un samedi, un autre le quatrième
  - « sous réserve de déballage », qui n'est pas une réserve précise
  - le port demandé sur une livraison acceptée
  - un avoir déjà émis, réclamé de nouveau
  - deux articles réclamés, livrés en reliquat cinq jours après
  - des réglettes rapportées, que le contrôle trouve posées
  - un retour qui mêle un article courant et une fin de série
