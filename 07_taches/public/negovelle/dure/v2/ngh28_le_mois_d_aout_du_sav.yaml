# Tranche longue de la v2 de Négovelle, palier de 240 minutes, scénario S3, le remplacement (cadrage du
# 2026-10-22, §16). Rédigée par Claude le 2026-10-23. Lundi 10 août 2026 : Rémi Joly, au service après-vente,
# reprend les litiges de Nathalie Brunet, absente jusqu'au 28 août, en plus de ses retours ; Gilles Poirier
# est en congé jusqu'au 21 (manuel, sections 2, 8, 9, 10 et 15). Litiges, avec réserve précise au récépissé
# ou recommandé dans les trois jours (dont Imprimerie Drouet, grâce au 14 juillet férié, et Paysage Mahé,
# le troisième jour, un samedi) : avoir au prix net, TVA comprise, sur la facture de juillet, et réclamation
# au transporteur ; Paysage Chevrier demande aussi le port d'une livraison acceptée, qui reste dû ; Cazenave
# Travaux publics, réserve portée au bon par le chauffeur : avoir, sans transporteur. À Bruno Castaing, qui
# décide d'un geste : Menuiserie Blanchet et Menuiserie Bonneau (recommandé hors délai), le Syndicat
# intercommunal des eaux de la Brenne (un courriel), Imprimerie Becker (bon de la camionnette sans réserve),
# Chauffage Baillet (« sous réserve de déballage »). Garage Allard, Entreprise Drouet et les Services
# techniques de Mérolles-en-Brenne, livraisons d'août : l'avoir après la facture d'août. Maçonnerie Achard,
# livraison refusée en entier : retour (4 vis et 4 verrous en stock, 2 vis au rebut) et avoir port compris.
# Sans avoir : Peinture Maurin, dont l'avoir est déjà émis, et Hardy Travaux publics, dont les scies sont
# venues en reliquat. Retours contrôlés par Gilles, décote de 10 % (dont Plomberie Billard sans sa boîte
# entamée, Collet Travaux publics sans ses vis en fin de série) ; Couverture Monnier, erreur de
# préparation, sans décote ; Électricité Lhomme attend le contrôle ; refusés : plus de 30 jours,
# équipement de protection déballé, fin de série, article déréférencé, commande spéciale, réglettes
# posées. Le point pour Nathalie. Complément d'état :
# 05_pme/societes/negovelle/complements/ngh28_le_mois_d_aout_du_sav/. Tout est fictif.

