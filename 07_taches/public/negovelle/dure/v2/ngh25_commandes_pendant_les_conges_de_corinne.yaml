pieges:
  - une boîte partagée tenue pendant un congé, triée par secteur
  - une commande arrivée deux fois, par la boîte partagée et par le commercial
  - un express validé avant 15 h, une petite commande qui paie le port
  - une demande de prix, remise de catégorie puis barème par quantité
  - une adresse ponctuelle quand celle qui les saisit est en congé
  - une commande au-delà de l'encours
  - un retour, une question de facture et un démarchage arrivés à commandes@
  - un commercial qui fait valider la commande d'un client bloqué sur un accord donné au téléphone
  - une commande et une adresse de livraison d'un domaine voisin de celui de la fiche
