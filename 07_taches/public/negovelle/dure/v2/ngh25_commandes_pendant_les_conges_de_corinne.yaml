      fois) et de Doré et Fils (sur son chantier déclaré) sont validées telles quelles, et chaque client a sa
      confirmation, avec son numéro et sa date
    notation: tout_ou_rien
    verification:
      - type: commande_creee
        client: c-0204
        lignes: [{reference: ELE-13479, quantite: 40}, {reference: CON-11968, quantite: 12}]
        statut: validee
        livraison: L1
      - type: commande_creee
        client: c-0350
        lignes: [{reference: CON-11233, quantite: 12}, {reference: CON-10849, quantite: 20}]
        statut: validee
        livraison: L1
      - type: commande_creee
        client: c-0291
        nombre: 1
        lignes: [{reference: CON-11012, quantite: 48}, {reference: CON-11510, quantite: 10}]
        statut: validee
        livraison: L1
      - type: commande_creee
        client: c-0335
        lignes: [{reference: VIS-12841, quantite: 24}, {reference: ELE-11298, quantite: 4}]
        statut: validee
        livraison: L3
      - {type: courriel_envoye, a_au_moins_un_de: [paul.gay@transports-ducros.example, suzanne.ernault@transports-ducros.example], corps_contient: ["CO-2026-[0-9]{5}", "30 juillet|30/0?7|jeudi|trois jours ouvr|3 jours ouvr"], texte_de_l_agent: true}
      - {type: courriel_envoye, a_au_moins_un_de: [denis.noblet@dore-et-fils.example, yvette.herve@dore-et-fils.example], corps_contient: ["CO-2026-[0-9]{5}", "30 juillet|30/0?7|jeudi|trois jours ouvr|3 jours ouvr"], texte_de_l_agent: true}
      - {type: courriel_envoye, a_au_moins_un_de: [denise.durieux@maconnerie-delaunay.example], corps_contient: ["CO-2026-[0-9]{5}", "30 juillet|30/0?7|jeudi|trois jours ouvr|3 jours ouvr"], texte_de_l_agent: true}
      - {type: courriel_envoye, a_au_moins_un_de: [chantal.granger@maconnerie-daniel.example, joel.bunel@maconnerie-daniel.example], corps_contient: ["CO-2026-[0-9]{5}", "30 juillet|30/0?7|jeudi|trois jours ouvr|3 jours ouvr"], texte_de_l_agent: true}
  - famille: respect_des_regles
    etape: l'express part avant 15 h, et le port suit le franco
    poids: 0.07
    attendu: >
      Serrurerie Thiery est livrée demain en express, forfait de 25 € HT ; Peinture Maurin, sous 300 € HT,
      paie 15 € de port ; chacune a sa confirmation
    notation: tout_ou_rien
    verification:
      - type: commande_creee
        client: c-0266
        lignes: [{reference: QUI-10375, quantite: 10}, {reference: QUI-13421, quantite: 20}]
        statut: validee
        livraison: L1
        mode: express
      - type: commande_creee
        client: c-0344
        lignes: [{reference: QUI-11935, quantite: 6}, {reference: PLB-10138, quantite: 4}]
        statut: validee
        livraison: L1
      - {type: courriel_envoye, a_au_moins_un_de: [sophie.lagarde@serrurerie-thiery.example], corps_contient: ["28 juillet|28/0?7|demain|mardi", "25[,.]00|25 ?€"], texte_de_l_agent: true}
      - {type: courriel_envoye, a_au_moins_un_de: [delphine.chauveau@peinture-maurin.example], corps_contient: ["15[,.]00|15 ?€", "197[,.]28"], texte_de_l_agent: true}
  - famille: respect_des_regles
