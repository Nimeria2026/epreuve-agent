      - {type: courriel_envoye, a_au_moins_un_de: [manon.rey@negovelle.example], transfere_de: m-cmd-007}
      - {type: courriel_envoye, a_au_moins_un_de: [laetitia.garnier@negovelle.example], transfere_de: m-cmd-008}
      - {type: courriel_envoye, a_au_moins_un_de: [laetitia.garnier@negovelle.example], transfere_de: m-cmd-009}
      - {type: courriel_envoye, a_au_moins_un_de: [oceane.collin@negovelle.example], transfere_de: m-cmd-010}
      - {type: courriel_envoye, a_au_moins_un_de: [oceane.collin@negovelle.example], transfere_de: m-cmd-011}
      - {type: courriel_envoye, a_au_moins_un_de: [oceane.collin@negovelle.example], transfere_de: m-cmd-012}
  - famille: respect_des_regles
    etape: le reste suit le tableau du manuel
    poids: 0.05
    attendu: >
      le retour de Menuiserie Pelletier va à sav@, la question de facture de Chauffage Simonet à Isabelle
