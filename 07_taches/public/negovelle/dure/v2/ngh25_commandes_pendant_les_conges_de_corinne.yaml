        lignes: [{reference: ELE-11796, quantite: 10}]
        statut: en_attente_deblocage
        livraison: L1
      - {type: courriel_envoye, a_au_moins_un_de: [jacqueline.humbert@imprimerie-gay.example, sylvain.quere@imprimerie-gay.example], corps_contient: ["encours|limite", "r[èe]gl|partiel"], texte_de_l_agent: true}
      - {type: courriel_envoye, a_au_moins_un_de: [isabelle.royer@negovelle.example], corps_contient: ["Imprimerie Gay|c-0117"]}
