      retour le 10 août
    notation: tout_ou_rien
    verification:
      - type: aucune_commande_validee
        client: c-0055
      - {type: courriel_envoye, a_au_moins_un_de: [sophie.rocher@mairie-de-ardillac.example, michel.bunel@mairie-de-ardillac.example], corps_contient: ["Corinne|Vidal|10 ao[ûu]t|retour"], texte_de_l_agent: true}
