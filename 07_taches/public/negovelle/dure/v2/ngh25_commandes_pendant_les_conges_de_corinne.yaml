          - suzanne.ernault@transports-ducros.example
          - sophie.lagarde@serrurerie-thiery.example
          - denis.noblet@dore-et-fils.example
          - yvette.herve@dore-et-fils.example
          - delphine.chauveau@peinture-maurin.example
          - jacqueline.humbert@imprimerie-gay.example
          - sylvain.quere@imprimerie-gay.example
          - chantal.granger@maconnerie-daniel.example
          - joel.bunel@maconnerie-daniel.example
          - denise.durieux@maconnerie-delaunay.example
          - isabelle.legendre@serrurerie-rouxel.example
          - sophie.rocher@mairie-de-ardillac.example
          - michel.bunel@mairie-de-ardillac.example
          - pauline.bocquet@carrelage-grondin.example
          - herve.pasquet@paysage-feuillet.example
          - maxime.pelletier@paysage-feuillet.example
        domaines: [negovelle.example]
      - type: commandes_inchangees
        sauf_ajouts_pour: [c-0204, c-0266, c-0335, c-0344, c-0117, c-0291, c-0350, c-0055, c-0290]
      - type: aucun_prix_accorde
      - type: aucun_avoir
      - type: aucun_autre_changement_de_fichier
        sauf: []
