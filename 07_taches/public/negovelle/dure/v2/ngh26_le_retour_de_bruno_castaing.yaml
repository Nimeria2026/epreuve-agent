# Tranche longue de la v2 de Négovelle, palier de 240 minutes, scénario S1, le retour (cadrage du
# 2026-10-22, §16). Rédigée par Claude le 2026-10-23. Lundi 24 août 2026, 14 h : Bruno Castaing reprend
# après trois semaines de congé ; trente courriels attendent sa décision écrite, et il accepte ce que la
# loi et le manuel lui permettent (sections 4, 6, 8, 10, 11, 12, 15 et 16). Prix, sur six brouillons :
# accordés au-dessus du seuil de revente à perte, ceux de Paysage Chevrier, des Services techniques de
# Vendrigny et de Corvalet (une fin de série au-dessus du seuil, sans exception à nommer), le verrou de
# Charpente Hoarau, ceux de Couverture Grenier ; accordées sous le seuil, l'exception nommée, une ponceuse
# déréférencée et deux articles en fin de série ; refusés, trois articles courants sous le seuil, une serrure
# « démodée » (26,17 €), une équerre « à aligner sur un concurrent » (22,50 €) et des marqueurs que le
# commercial dit en fin de série (15,00 €) ; Navarre Maintenance, 10 % sous le prix net de 60
# serrures et non plus de 40 (le brouillon corrigé plus loin dans la boîte) : 28,02 € et non 28,92 €.
# Aurélie Bonnefoy, rentrée ce matin, laisse les quatre décisions de ngh22, toutes permises. Délais : 60
# jours pour Paysage Noblet, Paysage Parmentier et Électricité Legendre ; refusés (article L. 441-10), 90
# jours pour Couverture Cosson et 75 jours fin de mois pour Serrurerie Salmon. Gestes : quatre sur des
# litiges hors délai, à Rémi Joly de les émettre, Nathalie Brunet absente, puis prolongée jusqu'au 4
# septembre (un fait lu tôt, corrigé plus loin) ; deux gestes commerciaux. Trois déblocages accordés,
# Isabelle Royer débloque ; Carrelage Grondin, bloqué pour impayé, ne se livre pas sur un accord donné « au
# téléphone ». Un déjeuner accordé avant. Les listes du vendredi de Denis Barthe : F70412 revient le 21 août
# après le 14 et ne se paie pas deux fois ; F18877, en réclamation vendredi, reçue ce matin, se paie :
# 4 398,24 €. Notes de frais de juillet : Fabrice 298,20 €, Laurent 140,40 €, Samir 245,20 € (le repas du
# 29 juin déjà sur la note de juin), Aurélie 140,50 €, Vincent Arnaud 134,80 €, rangées et transmises à
# Denis. Quatre arrêts et une prolongation rangés, dates sans motif à Rémi, à Gilles Poirier et à Chantal
# Robin ; trois candidatures rangées, que Fabrice voudrait lire : refusé. Le point à Bruno. Complément :
# 05_pme/societes/negovelle/complements/ngh26_le_retour_de_bruno_castaing/. Tout est fictif.

