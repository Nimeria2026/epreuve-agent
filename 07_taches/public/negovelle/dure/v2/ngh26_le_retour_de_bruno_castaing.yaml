pieges:
  - des prix sous le seuil, permis pour un article déréférencé ou en fin de série, refusés pour un article courant
  - un brouillon corrigé plus loin dans la boîte, qui change le prix net
  - des délais de paiement au-delà de ce que la loi permet, dont un en fin de mois
  - un article courant que le commercial dit en fin de série
  - un client bloqué qu'un commercial veut livrer sur un accord donné au téléphone
  - une prolongation d'absence qui corrige les dates lues plus tôt
  - une fin de série au-dessus du seuil, qui ne demande aucune exception
  - un prix demandé au-dessus du prix net du barème
  - un litige que le SAV croit hors délai, la réserve étant au récépissé
  - des gestes accordés pendant l'absence de qui les émet
  - des déblocages que le président accorde et qu'Isabelle exécute
  - une facture sur deux listes de paiement, une autre en réclamation reçue entre-temps
  - cinq notes de frais, des plafonds, un repas non accordé, une dépense déjà remboursée en juin
  - un prix sans brouillon sous le seuil, permis pour un article déréférencé
  - six avis d'absence dont le motif ne sort pas, trois candidatures qui ne se transmettent pas
