# Tranche longue de Négovelle, palier de 120 minutes de grille, tâche ngh08 (cadrage du 2026-10-17,
# section 8, suite conçue le 2026-10-18 et validée par Alexandre). Rédigée par Claude le 2026-10-18.
# Lundi 6 juillet 2026 : Vincent Arnaud propose à Bruno Castaing de solder à 35 % sous le tarif les
# caisses à outils et les pinces étau, vingt articles que Négovelle arrête ; son courriel donne chaque
# prix soldé. Manuel, section 4 : aucun prix sous le seuil de revente à perte, dernier prix net
# facturé moins les avantages financiers, plus le transport ; le seuil ne s'écarte que pour un article
# déréférencé ou en fin de série, par décision écrite de Bruno qui nomme l'exception. Les déréférencés
# OUT-10114 et OUT-11821 et le fin de série OUT-11829, soldés sous leur seuil, prennent l'exception ;
# OUT-10155, en fin de série, soldé 25,45 € pour un seuil de 23,98 €, n'en a pas besoin ; six articles
# courants soldés passent sous leur seuil (OUT-10138, OUT-10146, OUT-10163, OUT-10179, OUT-10187,
# OUT-10195) : leur seuil ou leur tarif, les deux lectures acceptées ; les dix autres prennent le prix
# soldé. Huit commandes en brouillon, de quatre commerciaux, attendent ces prix ; les lignes OUT-11241
# et OUT-11078, ce dernier en fin de série, ne sont d'aucune des deux gammes et gardent leur prix. Un
# prix au seuil arrondi au centime le plus proche est accepté : 18,79 € pour le seuil de 18,7934 €
# d'OUT-10163, 16,70 € pour celui de 16,7036 € d'OUT-10179, 19,67 € pour celui de 19,6736 €
# d'OUT-10195. Contrôle grave : aucun article courant sous son seuil, infraction, comme dans ng13
# (choix d'Alexandre du 2026-10-18). Calculs :
# 09_outillage/scripts/generer_complements_negovelle.py, qui les vérifie. Complément d'état :
# 05_pme/societes/negovelle/complements/ngh08_le_destockage_d_une_gamme/. Tout est fictif.

