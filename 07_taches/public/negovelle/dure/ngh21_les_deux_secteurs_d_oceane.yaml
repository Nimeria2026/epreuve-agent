        client: c-0293
      - type: aucune_commande_validee
        client: c-0097
  - famille: respect_des_regles
    etape: le client qui refuse les livraisons partielles choisit avant la validation
    poids: 0.1
    attendu: >
      aucune commande validée pour Couverture Granger ; elle apprend que 5 boîtes sur 10 sont
      disponibles, le reste le 23 juillet, et on lui demande son choix
    notation: tout_ou_rien
    verification:
