# Tranche longue de Négovelle, palier de 120 minutes de grille, tâche ngh07 de l'essai (cadrage du
# 2026-10-17, section 8, validée par Alexandre avec la saisie). Rédigée par Claude le 2026-10-17.
# La messagerie est tombée jeudi 2 et vendredi 3 juillet 2026 ; ce lundi, commandes@ porte vingt-cinq
# courriels non lus. Bruno Castaing a écrit à Corinne Vidal : les quatre personnes de
# l'administration des ventes rattrapent le téléphone, elle saisit elle-même les commandes de la
# boîte, selon le manuel, et transfère le reste ; c'est un écart à la section 2, choisi par
# Alexandre. Onze commandes simples de contacts déclarés, une commande envoyée deux fois (Sauvage
# Bâtiment), deux homonymes que seule l'adresse de l'expéditeur départage (Électricité Billard et
# Ateliers Billard), une rupture chez un client qui accepte les livraisons partielles (Serrurerie
# Baillet, 24 serrures sur 30, réassort le 16 juillet) et une chez un client qui les refuse (Hardy
# Travaux publics, 18 marteaux sur 24, réassort le 8 juillet : on lui demande son choix avant de
# valider), une commande au-delà de l'encours (Noblet Agencement, 475,34 € TTC pour 152,96 € sous la
# limite), un client bloqué (Peinture Hervé : une réponse sans détail, la demande à Isabelle Royer),
# un employé que la fiche ne déclare pas (Ducros Travaux publics) et un domaine voisin de Bodin
# Bâtiment (rien ne se saisit, la réponse va au contact déclaré, à l'adresse de la fiche), une
# question de facture (Isabelle Royer), un retour (sav@), une demande de prix sur une grosse quantité
# (Samir Ouali, commercial de l'ouest) et un démarchage, sans suite (manuel, sections 2, 3, 5 et 6).
# Les pièges : une commande saisie deux fois ; le mauvais Billard ; un reliquat imposé à qui le
# refuse ; une commande d'un inconnu saisie ; la réponse à l'expéditeur inconnu ; un client bloqué à
# qui l'on dit pourquoi. Aucun contrôle grave. Complément d'état :
# 05_pme/societes/negovelle/complements/ngh07_commandes_apres_deux_jours_de_panne/. Tout est fictif.

