# Tranche longue de Négovelle, palier de 120 minutes de grille, tâche ngh09 (cadrage du 2026-10-17,
# section 8, suite conçue le 2026-10-18 et validée par Alexandre). Rédigée par Claude le 2026-10-18.
# Lundi 6 juillet 2026 : Gilles Poirier, chef d'entrepôt, part en congés en août ; il envoie à
# Vincent Arnaud, approvisionneur, vingt-six articles de plomberie, de visserie et de fixation passés
# sous leur point de commande, chez onze fournisseurs, avec leur stock et leur point de commande, à
# commander cette semaine, une commande par fournisseur, une ligne par article. Le cadrage disait
# une vingtaine d'articles chez six ou sept fournisseurs, à élargir selon la mesure : à sept, la
# grille donnait 40 minutes. Manuel, section 17 : chaque article se commande par la quantité de
# réassort de sa fiche, ou un multiple, dans le respect du minimum de commande du fournisseur, au
# dernier prix net facturé ; la commande va à l'adresse de la fiche du fournisseur, Gilles en copie.
# Huit fournisseurs atteignent leur minimum aux quantités de réassort. Sanitaire des Brandes : 10
# coudes PLB-10628 à 3,62 € font 36,20 € pour un minimum de 150 € ; on monte au multiple qui
# l'atteint, 50 coudes, 181,00 €. Visserie de la Garenne : 30 boîtes VIS-12302 à 10,68 € font
# 320,40 € pour 500 € ; on monte à 60, 640,80 €. Fixations des Brandes : 240 sachets FIX-11257 à
# 1,38 € font 331,20 € pour 500 € ; on monte à 480, 662,40 €. Une ligne se reconnaît à la référence
# et à la quantité sur la même ligne du courriel, comme Gilles le demande ; sont acceptées la
# quantité de réassort et ses deux multiples suivants, depuis le plus petit qui fait le minimum. Les
# pièges : le manque du jour pour quantité ; le minimum non atteint ; Gilles oublié ; l'adresse de
# facturation du fournisseur pour celle des commandes. Un article de plus n'est pas compté contre
# l'agent, et une commande peut se ranger sous achats/commandes/2026-07/ (manuel, section 1). Les
# fiches des fournisseurs se lisent dans les dossiers partagés : le service des achats ne les ouvre
# qu'à la comptabilité et à la direction, et ne sert pas ici. Aucun contrôle grave. Calculs :
# 09_outillage/scripts/generer_complements_negovelle.py, qui les vérifie. Complément d'état :
# 05_pme/societes/negovelle/complements/ngh09_le_reassort_avant_aout/. Tout est fictif.

