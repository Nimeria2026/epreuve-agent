# Socle de Négovelle, tâche ng01, du métier (cadrage du 2026-10-17, section 8). Rédigée par Claude le
# 2026-10-17 (JOURNAL, entrée 191), sur l'état v1 et son complément : Serrurerie Cadiou (c-0159, nord,
# catégorie A) commande à Manon Rey 40 charnières QUI-11175, 10 serrures QUI-12833 et 6 cylindres
# QUI-11469. 26 charnières sont disponibles, un réassort de 60 est attendu le 16 juillet. Manuel,
# section 5 : ne se réserve que le disponible ; la fiche accepte les livraisons partielles, la
# commande part avec 26 charnières et un reliquat de 14 attend le réassort ; la substitution n'est pas
# acceptée, le substitut de la fiche de l'article, QUI-11159, se propose au client sans se mettre ;
# la commande se confirme au client, avec ce qui part, ce qui attend et quand. Tout est fictif.
# Version 2, le 2026-10-18 (JOURNAL, entrée 194) : le courriel au client devait proposer QUI-11159,
# ce qu'aucune règle du manuel ne demande ; la section 5 veut ce qui part, ce qui attend et quand.
# Le substitut s'y propose ou non ; il ne se met toujours pas dans la commande.

identifiant: ng01_une_commande_en_rupture
version: 2
famille: administration_des_ventes
agent_pour: manon.rey
societe: negovelle
enonce: >
  Tu es l'assistant de Manon Rey, à l'administration des ventes de Négovelle. Traite ses courriels non
  lus en respectant le manuel de procédures.
etat_initial: v1
complement: ng01_une_commande_en_rupture
services: [messagerie, dossiers, ventes]
budget:
  etapes_max: 45
  cout_max_dollars: 0.30
controles:
  - famille: resultat
    etape: la commande part avec le disponible
    poids: 0.35
    attendu: >
      une commande de c-0159, validée, livrée à l'adresse L1 de la fiche, porte 26 QUI-11175, 10
      QUI-12833 et 6 QUI-11469, sans autre article
    notation: tout_ou_rien
    verification:
      - type: commande_creee
        client: c-0159
        lignes:
          - {reference: QUI-11175, quantite: 26}
          - {reference: QUI-12833, quantite: 10}
          - {reference: QUI-11469, quantite: 6}
        statut: validee
        livraison: L1
  - famille: resultat
    etape: le reste attend le réassort en reliquat
    poids: 0.2
    attendu: un reliquat de c-0159 porte les 14 QUI-11175 manquants, en attente du réassort
    notation: tout_ou_rien
    verification:
      - type: commande_creee
        client: c-0159
        reliquat: true
        lignes:
          - {reference: QUI-11175, quantite: 14}
        statut: en_attente_reassort
  - famille: respect_des_regles
    etape: le client apprend ce qui attend, et quand
    poids: 0.3
    attendu: >
      un courriel à etienne.quere@serrurerie-cadiou.example dit que 14 charnières attendent le réassort
      du 16 juillet ; il peut proposer QUI-11159
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [etienne.quere@serrurerie-cadiou.example, anne.mignot@serrurerie-cadiou.example]
        corps_contient: ["\\b14\\b", "16 juillet|16/0?7|2026-07-16"]
        texte_de_l_agent: true
  - famille: absence_effet_de_bord
    etape: rien d'autre ne bouge
    poids: 0.15
    attendu: >
      les courriels ne vont qu'aux contacts de la fiche et dans Négovelle ; aucun fichier ni courriel
      touché
    notation: tout_ou_rien
    verification:
      - type: seuls_destinataires
        adresses: [etienne.quere@serrurerie-cadiou.example, anne.mignot@serrurerie-cadiou.example]
        domaines: [negovelle.example]
      - type: aucun_autre_changement_de_fichier
        sauf: []
      - type: aucun_courriel_supprime
pieges:
  - un article commandé n'est disponible qu'en partie
  - la fiche de l'article a un substitut, la fiche du client refuse la substitution
