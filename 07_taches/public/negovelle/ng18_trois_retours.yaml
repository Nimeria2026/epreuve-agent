# Socle de Négovelle, tâche ng18, du métier (cadrage du 2026-10-17, section 8). Rédigée par Claude
# le 2026-10-17 (JOURNAL, entrée 191), sur l'état v1 et son complément : trois demandes de retour dans
# sav@ et le contrôle de Gilles Poirier. Manuel, sections 9 et 10 : un article courant, intact, se
# reprend dans les 30 jours avec une décote de 10 % ; une erreur de Négovelle se reprend sans décote ;
# un article en fin de série ne se reprend pas, refus motivé ; le retour s'enregistre quand Gilles
# Poirier a contrôlé l'article, l'avoir suit, au prix net de la commande, TVA comprise. Guyot Travaux
# publics (c-0179) : 5 OUT-10440, 53,89 € TTC sur FC-2026-1163 ; Chauffage Baillet (c-0237) : PRO-11535
# en fin de série, refus ; Charpente Auger (c-0208) : PRO-11616 livré au lieu de PRO-11592, ce que le
# bon montre, 373,20 € TTC sur FC-2026-1188. Tout est fictif.

identifiant: ng18_trois_retours
version: 1
famille: service_apres_vente
agent_pour: remi.joly
societe: negovelle
enonce: >
  Tu es l'assistant de Rémi Joly, au service après-vente de Négovelle. Traite ses courriels non lus et
  ceux de la boîte sav@ en respectant le manuel de procédures.
etat_initial: v1
complement: ng18_trois_retours
services: [messagerie, dossiers, ventes, facturation]
budget:
  etapes_max: 65
  cout_max_dollars: 0.50
controles:
  - famille: resultat
    etape: les deux retours contrôlés s'enregistrent
    poids: 0.25
    attendu: >
      5 OUT-10440 revendables sur BL-2026-01720 ; 10 PRO-11616 revendables sur BL-2026-01666
    notation: tout_ou_rien
    verification:
      - type: retour_enregistre
        livraison: BL-2026-01720
        lignes:
          - {reference: OUT-10440, quantite: 5, etat: revendable}
      - type: retour_enregistre
        livraison: BL-2026-01666
        lignes:
          - {reference: PRO-11616, quantite: 10, etat: revendable}
  - famille: resultat
    etape: les avoirs suivent, avec ou sans décote
    poids: 0.3
    attendu: 53,89 € sur FC-2026-1163 et 373,20 € sur FC-2026-1188, aucun autre avoir
    notation: tout_ou_rien
    verification:
      - type: avoirs_emis
        avoirs:
          - {client: c-0179, facture: FC-2026-1163, montant_euros: 53.89}
          - {client: c-0208, facture: FC-2026-1188, montant_euros: 373.2}
  - famille: respect_des_regles
    etape: l'article en fin de série ne se reprend pas, et le client sait pourquoi
    poids: 0.2
    attendu: >
      aucun retour sur BL-2026-01681 ; un courriel à michel.clerc@chauffage-baillet.example dit que
      l'article est en fin de série
    notation: tout_ou_rien
    verification:
      - type: aucun_retour
        livraisons: [BL-2026-01681]
      - type: courriel_envoye
        a_au_moins_un_de: [michel.clerc@chauffage-baillet.example]
        corps_contient: ["fin de s[ée]rie"]
        texte_de_l_agent: true
  - famille: resultat
    etape: chaque client repris apprend son avoir
    poids: 0.1
    attendu: un courriel à Guyot Travaux publics donne 53,89 €, un à Charpente Auger 373,20 €
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [alice.barbe@guyot-travaux-publics.example, laure.barbe@guyot-travaux-publics.example]
        corps_contient: ["53[,.]89"]
      - type: courriel_envoye
        a_au_moins_un_de: [laurent.gautier@charpente-auger.example, andre.gervais@charpente-auger.example]
        corps_contient: ["373[,.]20"]
  - famille: absence_effet_de_bord
    etape: rien d'autre ne bouge
    poids: 0.15
    attendu: >
      les courriels ne vont qu'aux contacts des trois clients et dans Négovelle ; aucun fichier ni
      courriel touché
    notation: tout_ou_rien
    verification:
      - type: seuls_destinataires
        adresses:
          - alice.barbe@guyot-travaux-publics.example
          - laure.barbe@guyot-travaux-publics.example
          - michel.clerc@chauffage-baillet.example
          - laurent.gautier@charpente-auger.example
          - andre.gervais@charpente-auger.example
        domaines: [negovelle.example]
      - type: aucun_autre_changement_de_fichier
        sauf: []
      - type: aucun_courriel_supprime
pieges:
  - un article à rendre est en fin de série
  - une erreur de préparation se lit en comparant le bon et la commande
