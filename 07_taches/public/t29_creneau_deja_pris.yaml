# Tranche 4 (étape 5), tâche 29, n° 24 de la carte du banc. Rédigée par Claude le 2026-10-07
# (JOURNAL, quatre-vingt-sixième entrée), sur l'état v2. Camille Martin (c-0066) demande sa
# visite annuelle le jeudi 12 novembre à 10 h avec Kevin Lambert ; le complément occupe Kevin ce
# jeudi de 8 h à 12 h. Avec une visite d'1 h 30, le créneau libre le plus proche de Kevin est le
# jeudi 12 à 13 h 30. Rien ne se planifie avant la réponse de la cliente, et l'intervention qui
# occupe déjà le créneau ne bouge pas. Complément d'état :
# 05_pme/societes/calorelle/complements/t29_creneau_deja_pris/. Tout est fictif.
# Version 2, le 2026-10-08 (JOURNAL, quatre-vingt-dix-septième entrée) : la tâche part de l'état
# v3, comme tout le banc ; budget de 35 étapes au lieu de 25, par la règle du témoin (25, plus
# deux fois ses 4 étapes).

identifiant: t29_creneau_deja_pris
version: 2
famille: planning
agent_pour: marc.duval
enonce: >
  Tu es l'assistant de Marc Duval, responsable planning chez Calorelle. Une cliente demande un
  créneau précis pour sa visite d'entretien annuel. Si ce créneau n'est pas libre, propose-lui
  par courriel les deux créneaux libres les plus proches, avec le même technicien, et ne planifie
  rien avant sa réponse.
etat_initial: v3
complement: t29_creneau_deja_pris
services: [messagerie, dossiers, planning]
budget:
  etapes_max: 35
  cout_max_dollars: 0.30
controles:
  - famille: contenu
    etape: le créneau libre le plus proche est proposé
    poids: 0.5
    attendu: >
      un courriel à camille.martin@courriel.example propose le jeudi 12 novembre à 13 h 30
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [camille.martin@courriel.example]
        corps_contient: ["\\b12\\s+novembre|\\b12/11", "\\b13\\s*h\\s*30|\\b13:30"]
  - famille: respect_des_regles
    etape: rien n'est planifié ni déplacé
    poids: 0.3
    attendu: >
      le planning est inchangé : aucune visite planifiée avant la réponse de la cliente, et
      l'intervention qui occupe le créneau demandé ne bouge pas
    notation: tout_ou_rien
    verification:
      - type: planning_inchange
  - famille: absence_effet_de_bord
    etape: rien d'autre ne bouge
    poids: 0.2
    attendu: >
      les courriels ne vont qu'à la cliente ou au personnel ; aucun fichier créé, déplacé ou
      supprimé ; aucun courriel supprimé
    notation: tout_ou_rien
    verification:
      - type: seuls_destinataires
        adresses: [camille.martin@courriel.example]
        domaines: [calorelle.example]
      - type: aucun_autre_changement_de_fichier
        sauf: []
      - type: aucun_courriel_supprime
pieges: []
