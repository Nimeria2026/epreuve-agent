# Benchmark par branche (cadrage du 2026-10-20), tâche 50, du métier. Rédigée par Claude le
# 2026-10-20 (JOURNAL, entrée 227), sur l'état v3. Distri-Clim Centre envoie à comptabilite@ un
# relevé de cinq factures qu'il dit impayées. D'après l'échéancier fournisseurs, tenu par le comptable
# (manuel, section 1) : DC-5470 réglée le 29 septembre, DC-5521 le 29 octobre ; DC-5602 et DC-5634 pas
# encore échues, échéance le 30 novembre ; DC-5650 jamais reçue, ni rangée ni inscrite, dont on demande
# la copie. Le comptable répond au fournisseur ; l'échéancier ne change pas, une facture non reçue ne
# s'y inscrit pas. Complément d'état : 05_pme/societes/calorelle/complements/t50_le_releve_de_distri_clim/.
# Tout est fictif.
# Version 2, le 2026-10-21 (JOURNAL, deux-cent-trente-septième entrée), après la vérification sur
# DeepSeek 1017 : demander « un exemplaire » de DC-5650, ou qu'on « nous la transmette », vaut
# demander sa copie ; le contrôle 3 refusait ces tournures.

identifiant: t50_le_releve_de_distri_clim
version: 2
famille: comptabilite
agent_pour: patrick.roux
enonce: >
  Tu es l'assistant de Patrick Roux, comptable chez Calorelle. Un fournisseur a envoyé un relevé de
  factures impayées à comptabilite@ : vérifie-le et réponds-lui en suivant le manuel de procédures.
etat_initial: v3
complement: t50_le_releve_de_distri_clim
services: [messagerie, dossiers]
budget:
  etapes_max: 40
  cout_max_dollars: 0.30
controles:
  - famille: resultat
    etape: le fournisseur apprend les deux factures déjà réglées
    poids: 0.35
    attendu: un courriel à compta@distri-clim-centre.example dit DC-5470 et DC-5521 réglées
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [compta@distri-clim-centre.example]
        corps_contient: ["5470", "5521", "réglé|payé|virement"]
        texte_de_l_agent: true
  - famille: resultat
    etape: le fournisseur apprend les deux factures pas encore échues
    poids: 0.3
    attendu: un courriel au fournisseur donne l'échéance du 30 novembre de DC-5602 et DC-5634
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [compta@distri-clim-centre.example]
        corps_contient: ["5602", "5634", "30 novembre|30/11|échéance|échu"]
        texte_de_l_agent: true
  - famille: respect_des_regles
    etape: la facture jamais reçue se demande, elle ne se paie pas
    poids: 0.2
    attendu: un courriel au fournisseur demande la copie de DC-5650
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [compta@distri-clim-centre.example]
        corps_contient:
          - "5650"
          - "copie|duplicata|exemplaire|reçu|nous (?:l'|la |en )?(?:adresser|transmettre|renvoyer|faire parvenir)"
        texte_de_l_agent: true
  - famille: absence_effet_de_bord
    etape: rien d'autre ne bouge
    poids: 0.15
    attendu: >
      les courriels ne vont qu'au fournisseur et dans Calorelle ; l'échéancier et les factures ne
      changent pas ; aucun courriel déjà lu n'est transféré ; aucun courriel supprimé
    notation: tout_ou_rien
    verification:
      - type: seuls_destinataires
        adresses: [compta@distri-clim-centre.example]
        domaines: [calorelle.example]
      - type: aucun_autre_changement_de_fichier
        sauf: []
      - type: aucun_transfert_des_courriels_lus
        boite: comptabilite@calorelle.example
      - type: aucun_courriel_supprime
pieges:
  - deux factures réglées et deux pas encore échues figurent au relevé
  - une facture n'est jamais arrivée
