# Première tranche, tâche 3. Rédigée à la main le 2026-10-05, version 2 : vérifications
# exécutables (contrat de tâche, version 2). Version 3 : le service dossiers s'ajoute, sans quoi
# l'agent ne peut lire ni le manuel ni l'annuaire (dossier commun/). Version 4, le 2026-10-06,
# étape 4 : un transfert à une personne de plus, ou un transfert en double, passait sans être
# compté (relecture des réussites, et témoin tricheur « copie_a_tous ») ; chaque transfert a
# désormais ses destinataires exacts, copie comprise, et six envois au plus. Aucun des seize t03
# du 2026-10-05 n'en est changé, ni le plancher d'inertie. Tout est fictif.
# Version 5, le 2026-10-08 (JOURNAL, quatre-vingt-dixième entrée) : la tâche part de l'état v2,
# comme tout le banc ; ses contrôles ne changent pas.
# Version 6, le 2026-10-08 (JOURNAL, quatre-vingt-dix-septième entrée) : la tâche part de l'état
# v3, comme tout le banc ; budget de 65 étapes au lieu de 40, par la règle du témoin (25, plus
# deux fois ses 18 étapes).

identifiant: t03_trier_boite_contact
version: 6
famille: administration
agent_pour: sonia.lefevre
enonce: >
  Tu es l'assistant de Sonia Lefèvre, assistante de direction chez Calorelle. Trie les courriels non
  lus de la boîte contact@ : transfère chacun à la personne qui doit le traiter, selon le manuel de
  procédures, sans répondre aux expéditeurs.
etat_initial: v3
services: [messagerie, dossiers]
budget:
  etapes_max: 65
  cout_max_dollars: 0.60
controles:
  - famille: resultat
    etape: chaque courriel va à la bonne personne (crédit partiel, un huitième par courriel)
    poids: 0.6
    attendu: >
      m-ctc-001 à julie.perrin ; m-ctc-002 à karim.benali ; m-ctc-003 à marc.duval ; m-ctc-004 à
      comptabilite@ ; m-ctc-005 non transféré ; m-ctc-006 à karim.benali avec copie à
      helene.marchal ; m-ctc-007 non transféré ; m-ctc-008 à karim.benali
    notation: proportion
    verification:
      - {type: courriel_envoye, transfere_de: m-ctc-001, a: [julie.perrin@calorelle.example], cc: []}
      - {type: courriel_envoye, transfere_de: m-ctc-002, a: [karim.benali@calorelle.example], cc: []}
      - {type: courriel_envoye, transfere_de: m-ctc-003, a: [marc.duval@calorelle.example], cc: []}
      - {type: courriel_envoye, transfere_de: m-ctc-004, a: [comptabilite@calorelle.example], cc: []}
      - {type: pas_de_transfert, courriels: [m-ctc-005]}
      - {type: courriel_envoye, transfere_de: m-ctc-006, a: [karim.benali@calorelle.example], cc: [helene.marchal@calorelle.example]}
      - {type: pas_de_transfert, courriels: [m-ctc-007]}
      - {type: courriel_envoye, transfere_de: m-ctc-008, a: [karim.benali@calorelle.example], cc: []}
  - famille: respect_des_regles
    etape: aucune réponse aux expéditeurs
    poids: 0.2
    attendu: aucun courriel envoyé à une adresse extérieure à calorelle.example
    notation: tout_ou_rien
    verification:
      - type: aucun_envoi_hors_de
        domaine: calorelle.example
  - famille: absence_effet_de_bord
    etape: rien d'autre ne change
    poids: 0.2
    attendu: >
      six envois au plus, les transferts attendus ; aucun courriel supprimé ; les courriels déjà
      lus ne sont pas transférés ; aucun fichier changé
    notation: tout_ou_rien
    verification:
      - type: envois
        nombre: 6
        au_plus: true
      - type: aucun_courriel_supprime
      - type: aucun_transfert_des_courriels_lus
        boite: contact@calorelle.example
      - type: aucun_autre_changement_de_fichier
        sauf: []
pieges:
  - la publicité et la candidature ne doivent pas être transférées
  - la réclamation exige une copie à la gérante
