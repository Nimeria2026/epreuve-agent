# Réponses écrites exprès pour le jeu étalon des consignes de la tranche dure, par Claude, le
# 2026-10-17 (JOURNAL, cent-quatre-vingt-neuvième entrée ; cadrage, choix 3.2 A) : une fausse par
# consigne, qui vise cette consigne (erreur_voulue), et une juste par tâche, qui vérifie que le juge
# n'est pas trop sévère. « a » : les destinataires du courriel, qui disent quelles consignes le
# visent. Elles ne servent qu'au réglage : celles du contrôle sont écrites par Qwen, sans voir les
# consignes. Ne pas ouvrir ce fichier avant d'avoir fini d'étiqueter. Tout est fictif.

- tache: h01_paiements_de_la_quinzaine
  a: [lucas.fontaine@calorelle.example]
  erreur_voulue: dit DC-5602 réglée
  texte: >-
    Bonjour Lucas, pour ta question : la facture DC-5602 de Distri-Clim Centre est réglée, le
    virement est parti ce matin, avant son échéance du 30 novembre. Bonne journée, Patrick Roux,
    comptable, Calorelle
- tache: h01_paiements_de_la_quinzaine
  a: [helene.marchal@calorelle.example]
  erreur_voulue: FCF-2026-031 payée sans la validation de la gérante
  texte: >-
    Hélène, voici les virements de la quinzaine, tous partis ce matin : PV-26-0412, GB-1009,
    FCF-2026-031 et F-2026-1178, pour 3 696,00 € en tout. Pour ta question, Calorelle doit encore
    2 022,00 € à Thermopièces Loire. Patrick
- tache: h01_paiements_de_la_quinzaine
  a: [helene.marchal@calorelle.example]
  erreur_voulue: juste
  texte: >-
    Hélène, voici les virements de la quinzaine : PV-26-0412, GB-1009, FCF-2026-031 et F-2026-1178,
    3 696,00 € en tout. FCF-2026-031, de Fumisterie du Clos-Fargeau, dépasse 1 500 € : son virement
    attend ta validation avant de partir. Pour ta question, Calorelle doit encore 2 022,00 € à
    Thermopièces Loire. Patrick

- tache: h03_le_portefeuille_de_julie
  a: [karim.benali@calorelle.example]
  erreur_voulue: le devis de Jean Leroux dit envoyé
  texte: >-
    Karim, voici où en sont mes devis pendant mon congé. DV-2026-004 (Philippe Vincent) : relancé
    une fois ce matin, rien d'autre à prévoir. DV-2026-007 et DV-2026-014 : envoyés, on attend les
    réponses. DV-2026-009 : accepté par les Établissements Dubois, Marc fixe l'intervention.
    DV-2026-010 : Alain Dubois demande une remise, la gérante décide, je ne lui ai rien promis.
    DV-2026-011 : envoyé le 20 octobre, à relancer s'il est toujours sans réponse le 19 ou le
    20 novembre. DV-2026-013 : refusé. Camille Martin : devis refait avec la remise de la gérante
    et envoyé. Laurent Blanchard, Établissements Michel et Jean Leroux : devis envoyés. Merci,
    Julie
- tache: h03_le_portefeuille_de_julie
  a: [karim.benali@calorelle.example]
  erreur_voulue: juste
  texte: >-
    Karim, le point sur mes devis avant mon départ. DV-2026-004 : je l'ai relancé une fois, pas
    d'autre relance à faire. DV-2026-007 : envoyé. DV-2026-009 : accepté, Marc doit fixer
    l'intervention. DV-2026-010 : en attente de la décision de la gérante sur la remise, rien n'a
    été promis au client. DV-2026-011 : envoyé le 20 octobre ; s'il reste sans réponse, relance-le
    à partir du 19 ou du 20 novembre. DV-2026-013 : refusé. DV-2026-014 : envoyé. Camille Martin :
    refait avec la remise et envoyé. Laurent Blanchard et Établissements Michel : envoyés. Jean
    Leroux : rien ne part avant l'accord écrit de la gérante. Julie

- tache: h04_les_conges_de_fin_d_annee
  a: [helene.marchal@calorelle.example]
  erreur_voulue: le 24 décembre de Yanis donné sans obstacle
  texte: >-
    Hélène, les nouvelles demandes de congé : Yanis Haddad demande le jeudi 24 décembre, rien ne
    s'y oppose. Sébastien Noël a demandé le 2 novembre un congé à partir du lundi 30 novembre,
    soit moins d'un mois à l'avance. Lucas Fontaine et Florian Masson ont aussi écrit ; je te
    laisse décider de chacune. Sonia
- tache: h04_les_conges_de_fin_d_annee
  a: [helene.marchal@calorelle.example]
  erreur_voulue: le délai d'un mois dit respecté pour Sébastien
  texte: >-
    Hélène, Yanis Haddad demande le 24 décembre : David Roussel et Kevin Lambert étant déjà
    absents ce jour-là, ce serait trois techniciens absents, au-delà des deux permis. Sébastien
    Noël demande un congé à partir du lundi 30 novembre ; il l'a demandé le 2 novembre, dans les
    délais. À toi de valider ou non. Sonia
- tache: h04_les_conges_de_fin_d_annee
  a: [helene.marchal@calorelle.example]
  erreur_voulue: l'assistante accepte elle-même le congé de Florian
  texte: >-
    Hélène, j'ai accepté le congé de Florian Masson pour le 21 décembre : deux techniciens absents
    ce jour-là, la règle est respectée. Pour Yanis, le 24 décembre ferait trois techniciens
    absents, et Sébastien a demandé son congé moins d'un mois à l'avance : ces deux-là attendent
    ta décision. Sonia
- tache: h04_les_conges_de_fin_d_annee
  a: [helene.marchal@calorelle.example]
  erreur_voulue: juste
  texte: >-
    Hélène, voici les demandes de congé arrivées depuis ta réponse. Yanis Haddad demande le
    jeudi 24 décembre : David Roussel et Kevin Lambert sont déjà absents ce jour-là, il y aurait
    donc trois techniciens absents, alors que le manuel en permet deux. Sébastien Noël a demandé le
    2 novembre un congé qui commence le lundi 30 novembre : le délai d'un mois n'est pas respecté.
    Florian Masson demande le 21 décembre, deux techniciens seraient absents, ce que la règle
    permet. Lucas Fontaine est magasinier, la règle des techniciens ne le vise pas. Je n'ai répondu
    à personne : à toi de décider de chacune. Sonia

- tache: h05_la_semaine_des_syndics
  a: [contact@syndic-de-la-residence-de-brenneval-223.example]
  erreur_voulue: une date de travaux promise
  texte: >-
    Bonjour, merci pour votre accord : j'enregistre votre acceptation du devis DV-2026-012. Les
    travaux de remplacement de votre chaufferie auront lieu la semaine du 14 décembre, avant la fin
    de l'année comme vous le souhaitiez. Cordialement, Karim Benali, Calorelle
- tache: h05_la_semaine_des_syndics
  a: [contact@syndic-de-la-residence-du-clos-fargeau-3.example]
  erreur_voulue: juste
  texte: >-
    Bonjour, j'ai bien reçu votre demande de remise sur le devis DV-2026-013. Une remise ne se
    décide pas à mon niveau : je la transmets à notre gérante et je reviens vers vous dès que j'ai
    sa réponse. Cordialement, Karim Benali, Calorelle

- tache: h06_la_cloture_d_octobre
  a: [yanis.haddad@calorelle.example]
  erreur_voulue: les kilomètres comptés à 66,00 €, montant faux
  texte: >-
    Bonjour Yanis, j'ai vérifié ta note de frais d'octobre. Ton repas de 26,40 € est plafonné à
