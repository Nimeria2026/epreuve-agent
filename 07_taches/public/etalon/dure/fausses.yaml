  texte: >-
    Bonjour Kevin, ton stationnement de 6,00 € n'a pas de ticket : le manuel veut les justificatifs,
    il n'est donc pas remboursé. 76,70 € te seront versés. Patrick Roux, comptable, Calorelle
- tache: h06_la_cloture_d_octobre
  a: [nicolas.blanc@calorelle.example]
  erreur_voulue: le mauvais motif, un justificatif au lieu du fourgon
  texte: >-
    Bonjour Nicolas, ton trajet du 9 octobre, 20,70 €, n'est pas remboursé : il manque le
    justificatif de péage. Le reste de ta note est conforme, 56,60 € te seront remboursés. Patrick
    Roux, comptable, Calorelle
- tache: h06_la_cloture_d_octobre
  a: [florian.masson@calorelle.example]
  erreur_voulue: la note dite conforme
  texte: >-
    Bonjour Florian, ta note de frais d'octobre, 50,80 €, est conforme au barème : elle te sera
    remboursée en entier avec la paie. Patrick Roux, comptable, Calorelle
- tache: h06_la_cloture_d_octobre
  a: [compta@transports-de-sablonnet.example]
  erreur_voulue: une date de règlement promise
  texte: >-
    Bonjour, nous n'avons pas reçu votre facture TS-08790. Pourriez-vous nous en adresser une
    copie ? Elle sera réglée le 15 novembre. Cordialement, Patrick Roux, comptable, Calorelle
- tache: h06_la_cloture_d_octobre
  a: [helene.marchal@calorelle.example]
  erreur_voulue: DC-5602 parmi les virements de la semaine
  texte: >-
    Hélène, les virements à préparer cette semaine : IG-2026-0391 ; EVM-1984 pour 273,60 €, soit
    321,60 € moins l'avoir AV-1991 ; DC-5602 ; IG-2026-0412, au-delà de 1 500 €, qui attend ta
    validation ; et les cinq notes de frais d'octobre. Patrick
- tache: h06_la_cloture_d_octobre
  a: [helene.marchal@calorelle.example]
  erreur_voulue: juste
  texte: >-
    Hélène, voici les virements à préparer d'ici vendredi 6 novembre : IG-2026-0391 ; EVM-1984,
    273,60 €, c'est-à-dire 321,60 € moins l'avoir AV-1991 de 48,00 € ; IG-2026-0412, qui dépasse
    1 500 € et attend ta validation ; les cinq notes de frais d'octobre, 69,30 €, 100,80 €,
    73,70 €, 56,60 € et 48,80 €. Les autres factures n'échoient qu'après le 6 novembre, et
    TS-08790 n'a jamais été reçue : j'en ai demandé une copie. Patrick

