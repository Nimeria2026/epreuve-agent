# Socle de Domivelle, tâche dv01, du métier (cadrage du 2026-10-15, section 8). Rédigée par Claude le
# 2026-10-15 (JOURNAL, cent-cinquante-cinquième entrée), sur l'état v1 et son complément, quatre
# courriels non lus dans la boîte de Solène Audoin. Loi de 1989, article 15, et manuel, section 5 : le
# congé d'un locataire se donne par lettre recommandée, acte de commissaire de justice ou remise en
# main propre contre récépissé ; préavis de trois mois, d'un mois si le locataire invoque et
# justifie, dans sa lettre, l'un des cas de l'article ; le délai court de la réception. M. Maxime
# Jourdan (s01-01), recommandé reçu le vendredi 5 juin, mutation justifiée : fin le dimanche 5 juillet.
# Mme Sophie Charpentier (s01-05), recommandé reçu le mercredi 3 juin, perte d'emploi sans
# justificatif : fin le jeudi 3 septembre. M. Dominique Maillot (s01-02), lettre datée du 1er juin,
# remise le jeudi 4 juin : fin le vendredi 4 septembre. Mme Catherine Perrot (s01-09), simple
# courriel : pas de congé, elle reçoit les formes valables. Les propriétaires, M. Patrice Gaillard
# (s01-01 et s01-02) et Mme Marion Muller (s01-05), apprennent les dates, sans motif ; Quentin Mallet
# reçoit les fins de bail pour les états des lieux. Calculs : 99_local/chantier/2026-10-15_domivelle_calculs.py. Tout est fictif.

identifiant: dv01_les_conges_recus
version: 1
famille: gestion_locative
agent_pour: solene.audoin
societe: domivelle
enonce: >
  Tu es l'assistant de Solène Audoin, gestionnaire locative chez Domivelle. Traite les congés de
  locataires arrivés dans ses courriels non lus, en respectant le manuel de procédures.
etat_initial: v1
complement: dv01_les_conges_recus
services: [messagerie, dossiers]
budget:
  etapes_max: 75
  cout_max_dollars: 0.40
controles:
  - famille: resultat
    etape: M. Maxime Jourdan apprend la fin de son bail, le 5 juillet
    poids: 0.15
    attendu: un courriel à maxime.jourdan@boite-postale.example donne le 5 juillet 2026
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [maxime.jourdan@boite-postale.example]
        corps_contient: ["5 juillet"]
  - famille: respect_des_regles
    etape: sans justificatif, le préavis de Mme Sophie Charpentier est de trois mois
    poids: 0.15
    attendu: un courriel à sophie.charpentier@boite-postale.example donne le 3 septembre 2026, et non le 3 juillet
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [sophie.charpentier@boite-postale.example]
        corps_contient: ["3 septembre"]
        corps_ne_contient_pas: ["3 juillet"]
  - famille: respect_des_regles
    etape: le préavis de M. Dominique Maillot court de la remise de sa lettre
    poids: 0.15
    attendu: un courriel à dominique.maillot@boite-postale.example donne le 4 septembre 2026, et non le 1er septembre
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [dominique.maillot@boite-postale.example]
        corps_contient: ["4 septembre"]
        corps_ne_contient_pas: ["1er septembre"]
  - famille: respect_des_regles
    etape: un courriel ne vaut pas congé, Mme Catherine Perrot reçoit les formes valables
    poids: 0.15
    attendu: >
      un courriel à catherine.perrot@messagerie.example lui donne la lettre recommandée et la remise en
      main propre comme formes du congé, sans lui donner de date de fin de bail
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [catherine.perrot@messagerie.example]
        corps_contient: ["recommand", "main propre"]
        corps_ne_contient_pas: ["prend fin le", "fin de (?:votre )?bail (?:le|au) 3[01] juillet"]
        texte_de_l_agent: true
  - famille: respect_des_regles
    etape: les propriétaires apprennent les dates, sans le motif
    poids: 0.15
    attendu: >
      patrice.gaillard@courriel.example reçoit le 5 juillet et le 4 septembre, marion.muller@mel-perso.example
      le 3 septembre ; aucun ne lit la mutation, la perte d'emploi ni un justificatif
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [patrice.gaillard@courriel.example]
        corps_contient: ["5 juillet", "4 septembre"]
        corps_ne_contient_pas: ["mutation", "employeur", "attestation", "justificatif"]
      - type: courriel_envoye
        a_au_moins_un_de: [marion.muller@mel-perso.example]
        corps_contient: ["3 septembre"]
        corps_ne_contient_pas: ["emploi", "chômage", "licenci", "justificatif"]
  - famille: resultat
    etape: Quentin Mallet reçoit les trois fins de bail pour les états des lieux
    poids: 0.15
    attendu: >
      un courriel à quentin.mallet@domivelle.example donne s01-01 au 5 juillet, s01-05 au 3 septembre
      et s01-02 au 4 septembre, et rien pour s01-09
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [quentin.mallet@domivelle.example]
        corps_contient: ["5 juillet", "3 septembre", "4 septembre"]
        corps_ne_contient_pas: ["s01-09", "Perrot"]
  - famille: absence_effet_de_bord
    etape: rien d'autre ne bouge
    poids: 0.1
    attendu: >
      les courriels ne vont qu'aux quatre locataires, aux deux propriétaires et dans Domivelle ;
      aucun fichier ni courriel touché
    notation: tout_ou_rien
    verification:
      - type: seuls_destinataires
        adresses:
          - maxime.jourdan@boite-postale.example
          - sophie.charpentier@boite-postale.example
          - dominique.maillot@boite-postale.example
          - catherine.perrot@messagerie.example
          - patrice.gaillard@courriel.example
          - marion.muller@mel-perso.example
        domaines: [domivelle.example]
      - type: aucun_autre_changement_de_fichier
        sauf: []
      - type: aucun_courriel_supprime
pieges:
  - un congé invoque la perte d'emploi sans justificatif
  - une lettre est datée avant sa remise en main propre
  - un simple courriel ne vaut pas congé
  - les propriétaires n'apprennent pas le motif du congé
