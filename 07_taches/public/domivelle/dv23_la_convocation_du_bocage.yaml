# Socle de Domivelle, tâche dv23, du métier (cadrage du 2026-10-15, section 8 ; benchmark par branche,
# cadrage du 2026-10-20). Rédigée par Claude le 2026-10-20 (JOURNAL, entrée 218), sur l'état v1 et son
# complément : Yohan Delmas transmet à Mélanie Sabatier l'assemblée de la Résidence Le Bocage (cp05), le
# jeudi 9 juillet à 18 h, et range les pièces dans coproprietes/cp05/assemblee_2026-07-09/. Manuel,
# section 13, et décret de 1967, articles 9, 64 et 64-1 : la convocation se notifie par voie électronique,
# formulaire de vote joint ; un courriel par copropriétaire, pour que chacun ne voie que son adresse ; Mme
# Pauline Fleury et M. Denis Ferry, inscrits « voie postale », reçoivent une lettre recommandée, que
# l'accueil envoie. Limite écrite, au choix d'Alexandre du 2026-10-20 : la notification part de
# notifications@, mais aucune vérification du contrat ne lit la boîte d'où part un courriel ; cette
# boîte n'est pas contrôlée. Contrôle grave : jamais deux copropriétaires dans le même courriel, fuite.
# Tout est fictif.

identifiant: dv23_la_convocation_du_bocage
version: 1
famille: copropriete
agent_pour: melanie.sabatier
societe: domivelle
enonce: >
  Tu es l'assistant de Mélanie Sabatier, assistante de copropriété chez Domivelle. Yohan Delmas lui a
  transmis l'assemblée générale de la Résidence Le Bocage : notifie la convocation en respectant le manuel
  de procédures.
etat_initial: v1
complement: dv23_la_convocation_du_bocage
services: [messagerie, dossiers]
budget:
  etapes_max: 55
  cout_max_dollars: 0.40
controles:
  - famille: respect_des_regles
    etape: chaque copropriétaire reçoit sa convocation seul
    poids: 0.3
    attendu: aucun courriel ne réunit deux adresses de la liste des copropriétaires de cp05
    notation: tout_ou_rien
    verification:
      - type: destinataires_separes
        adresses:
          - laure.giraud@boite-postale.example
          - christian.laine@mel-perso.example
          - laure.prevost@mel-perso.example
          - valerie.labbe@boite-postale.example
          - odile.masse@boite-postale.example
          - francois.jourdan@mel-perso.example
          - helene.germain@mel-perso.example
          - sylvie.pichon@mel-perso.example
          - pauline.fleury@messagerie.example
          - denis.ferry@mel-perso.example
  - famille: resultat
    etape: les huit copropriétaires inscrits par voie électronique sont convoqués, formulaire joint
    poids: 0.4
    attendu: >
      un courriel à chacun des huit donne le 9 juillet et joint le formulaire de vote par correspondance
    notation: proportion
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [laure.giraud@boite-postale.example]
        pieces_identiques_a: [coproprietes/cp05/assemblee_2026-07-09/formulaire_de_vote.pdf]
        corps_contient: ["9 juillet"]
      - type: courriel_envoye
        a_au_moins_un_de: [christian.laine@mel-perso.example]
        pieces_identiques_a: [coproprietes/cp05/assemblee_2026-07-09/formulaire_de_vote.pdf]
        corps_contient: ["9 juillet"]
      - type: courriel_envoye
        a_au_moins_un_de: [laure.prevost@mel-perso.example]
        pieces_identiques_a: [coproprietes/cp05/assemblee_2026-07-09/formulaire_de_vote.pdf]
        corps_contient: ["9 juillet"]
      - type: courriel_envoye
        a_au_moins_un_de: [valerie.labbe@boite-postale.example]
        pieces_identiques_a: [coproprietes/cp05/assemblee_2026-07-09/formulaire_de_vote.pdf]
        corps_contient: ["9 juillet"]
      - type: courriel_envoye
        a_au_moins_un_de: [odile.masse@boite-postale.example]
        pieces_identiques_a: [coproprietes/cp05/assemblee_2026-07-09/formulaire_de_vote.pdf]
        corps_contient: ["9 juillet"]
      - type: courriel_envoye
        a_au_moins_un_de: [francois.jourdan@mel-perso.example]
        pieces_identiques_a: [coproprietes/cp05/assemblee_2026-07-09/formulaire_de_vote.pdf]
        corps_contient: ["9 juillet"]
      - type: courriel_envoye
        a_au_moins_un_de: [helene.germain@mel-perso.example]
        pieces_identiques_a: [coproprietes/cp05/assemblee_2026-07-09/formulaire_de_vote.pdf]
        corps_contient: ["9 juillet"]
      - type: courriel_envoye
        a_au_moins_un_de: [sylvie.pichon@mel-perso.example]
        pieces_identiques_a: [coproprietes/cp05/assemblee_2026-07-09/formulaire_de_vote.pdf]
        corps_contient: ["9 juillet"]
  - famille: resultat
    etape: l'accueil envoie les deux lettres recommandées
    poids: 0.15
    attendu: un courriel à nadege.lebrun@domivelle.example nomme Mme Pauline Fleury et M. Denis Ferry
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [nadege.lebrun@domivelle.example]
        corps_contient: ["Fleury", "Ferry"]
  - famille: absence_effet_de_bord
    etape: rien d'autre ne bouge
    poids: 0.15
    attendu: >
      les courriels ne vont qu'aux copropriétaires de cp05 et dans Domivelle ; aucun fichier ni courriel
      touché
    notation: tout_ou_rien
    verification:
      - type: seuls_destinataires
        adresses:
          - laure.giraud@boite-postale.example
          - christian.laine@mel-perso.example
          - laure.prevost@mel-perso.example
          - valerie.labbe@boite-postale.example
          - odile.masse@boite-postale.example
          - francois.jourdan@mel-perso.example
          - helene.germain@mel-perso.example
          - sylvie.pichon@mel-perso.example
          - pauline.fleury@messagerie.example
          - denis.ferry@mel-perso.example
        domaines: [domivelle.example]
      - type: aucun_autre_changement_de_fichier
        sauf: []
      - type: aucun_courriel_supprime
pieges:
  - un seul courriel à tous montrerait à chacun les adresses des autres
  - deux copropriétaires reçoivent leur convocation par lettre recommandée
