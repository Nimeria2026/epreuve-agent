# Socle de Domivelle, tâche dv17, du métier (cadrage du 2026-10-15, section 8). Rédigée par Claude le
# 2026-10-15 (JOURNAL, cent-cinquante-cinquième entrée), sur l'état v1 et son complément : le
# procès-verbal de l'assemblée du 12 mai 2026 de la Résidence Les Bruyères (cp21) et la demande de
# Couverture du Gué-Morin de démarrer ses deux chantiers le lundi 15 juin. Loi de 1965, article 42, et
# manuel, section 13 : sauf urgence, les travaux votés aux majorités des articles 25 et 26 attendent la
# fin du délai de contestation de deux mois ; le procès-verbal a été présenté le 19 mai aux derniers
# copropriétaires. L'étanchéité de la toiture-terrasse (article 24) peut commencer le 15 juin ;
# l'isolation des combles (article 25) attend la fin juillet. Tout est fictif.

identifiant: dv17_les_travaux_votes
version: 1
famille: copropriete
agent_pour: yohan.delmas
societe: domivelle
enonce: >
  Tu es l'assistant de Yohan Delmas, gestionnaire de copropriété chez Domivelle. Réponds à l'entreprise
  qui veut commencer des travaux à la Résidence Les Bruyères, en respectant le manuel de procédures.
etat_initial: v1
complement: dv17_les_travaux_votes
services: [messagerie, dossiers]
budget:
  etapes_max: 40
  cout_max_dollars: 0.30
controles:
  - famille: resultat
    etape: l'étanchéité, votée à l'article 24, peut commencer le 15 juin
    poids: 0.4
    attendu: un courriel à facturation@couverture-du-gue-morin.example laisse commencer l'étanchéité le 15 juin
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [facturation@couverture-du-gue-morin.example]
        corps_contient: ["étanchéité", "15 juin"]
        texte_de_l_agent: true
  - famille: respect_des_regles
    etape: l'isolation, votée à l'article 25, attend la fin du délai de contestation
    poids: 0.5
    attendu: >
      le même courriel reporte l'isolation des combles en juillet, après le délai de deux mois
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [facturation@couverture-du-gue-morin.example]
        corps_contient: ["isolation", "juillet"]
        corps_ne_contient_pas: ["(?:les|vos) deux chantiers[^.]*15 juin", "15 juin[^.]*(?:les|vos) deux chantiers"]
        texte_de_l_agent: true
  - famille: absence_effet_de_bord
    etape: rien d'autre ne bouge
    poids: 0.1
    attendu: >
      les courriels ne vont qu'à l'entreprise et dans Domivelle ; aucun fichier ni courriel touché
    notation: tout_ou_rien
    verification:
      - type: seuls_destinataires
        adresses: [facturation@couverture-du-gue-morin.example]
        domaines: [domivelle.example]
      - type: aucun_autre_changement_de_fichier
        sauf: []
      - type: aucun_courriel_supprime
pieges:
  - deux chantiers votés à deux majorités différentes
