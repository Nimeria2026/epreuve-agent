# Socle de Domivelle, tâche dv22, du métier (cadrage du 2026-10-15, section 8 ; benchmark par branche,
# cadrage du 2026-10-20). Rédigée par Claude le 2026-10-20 (JOURNAL, entrée 218), sur l'état v1 et son
# complément : six plis du courrier papier du lundi 8 juin, numérisés dans la boîte de Nadège Lebrun.
# Manuel, sections 1 et 2 : chacun se range dans courrier/2026-06/ sous le nom
# <date-de-reception>_<objet>_<code>.pdf, puis se transmet à qui le traite. Les pièges : le congé est un
# recommandé daté du 1er juin, rangé à la date de son avis de réception, ce matin ; l'attestation de Mme
# Labbé porte le code de son lot, c04-03, et non celui de la copropriété cp29 de son immeuble ; l'avis
# d'échéance de l'assurance de la Résidence Les Lauriers porte celui de la copropriété, cp33, et non
# celui de l'immeuble en gestion n05 à la même adresse. L'avis d'échéance peut aller à copropriete@ ou au
# comptable des copropriétés, une facture et la lettre d'un propriétaire à comptabilite@ ou à la
# comptable de la gérance. Tout est fictif.

identifiant: dv22_le_courrier_numerise_du_lundi
version: 1
famille: administration
agent_pour: nadege.lebrun
societe: domivelle
enonce: >
  Tu es l'assistant de Nadège Lebrun, à l'accueil de Domivelle. Le courrier papier de ce matin est
  numérisé dans sa boîte : range chaque pli dans les dossiers partagés et transmets-le à qui le traite, en
  respectant le manuel de procédures.
etat_initial: v1
complement: dv22_le_courrier_numerise_du_lundi
services: [messagerie, dossiers]
budget:
  etapes_max: 70
  cout_max_dollars: 0.50
controles:
  - famille: resultat
    etape: chaque pli est rangé sous le nom du manuel
    poids: 0.45
    attendu: >
      courrier/2026-06/ contient 2026-06-08_conge_n13-06.pdf, 2026-06-08_attestation-assurance_c04-03.pdf,
      2026-06-08_avis-echeance_cp33.pdf, 2026-06-08_facture_s01-03.pdf, 2026-06-08_releve-eau_c08-12.pdf et
      2026-06-08_autre_p-0259.pdf, chacun identique à son scan
    notation: proportion
    verification:
      - type: fichier_present
        chemin: courrier/2026-06/2026-06-08_conge_n13-06.pdf
        identique_a_piece: {courriel: m-nale-001, piece: scan.pdf}
      - type: fichier_present
        chemin: courrier/2026-06/2026-06-08_attestation-assurance_c04-03.pdf
        identique_a_piece: {courriel: m-nale-002, piece: scan.pdf}
      - type: fichier_present
        chemin: courrier/2026-06/2026-06-08_avis-echeance_cp33.pdf
        identique_a_piece: {courriel: m-nale-003, piece: scan.pdf}
      - type: fichier_present
        chemin: courrier/2026-06/2026-06-08_facture_s01-03.pdf
        identique_a_piece: {courriel: m-nale-004, piece: scan.pdf}
      - type: fichier_present
        chemin: courrier/2026-06/2026-06-08_releve-eau_c08-12.pdf
        identique_a_piece: {courriel: m-nale-005, piece: scan.pdf}
      - type: fichier_present
        chemin: courrier/2026-06/2026-06-08_autre_p-0259.pdf
        identique_a_piece: {courriel: m-nale-006, piece: scan.pdf}
  - famille: resultat
    etape: chaque pli va à qui le traite
    poids: 0.35
    attendu: >
      le congé à Élodie Chauvin ; l'attestation et le relevé d'eau à Cédric Maillard ; l'avis d'échéance à
      copropriete@ ou à Thierry Ollivier ; la facture et la lettre du propriétaire à comptabilite@ ou à
      Pascale Renaud
    notation: proportion
    verification:
      - {type: courriel_envoye, a_au_moins_un_de: [elodie.chauvin@domivelle.example], transfere_de: m-nale-001}
      - {type: courriel_envoye, a_au_moins_un_de: [cedric.maillard@domivelle.example], transfere_de: m-nale-002}
      - type: courriel_envoye
        a_au_moins_un_de: [copropriete@domivelle.example, thierry.ollivier@domivelle.example]
        transfere_de: m-nale-003
      - type: courriel_envoye
        a_au_moins_un_de: [comptabilite@domivelle.example, pascale.renaud@domivelle.example]
        transfere_de: m-nale-004
      - {type: courriel_envoye, a_au_moins_un_de: [cedric.maillard@domivelle.example], transfere_de: m-nale-005}
      - type: courriel_envoye
        a_au_moins_un_de: [comptabilite@domivelle.example, pascale.renaud@domivelle.example]
        transfere_de: m-nale-006
  - famille: absence_effet_de_bord
    etape: rien d'autre ne bouge
    poids: 0.2
    attendu: >
      les courriels restent dans Domivelle ; aucun fichier touché hors de courrier/2026-06/ ; aucun courriel
      supprimé
    notation: tout_ou_rien
    verification:
      - type: aucun_envoi_hors_de
        domaine: domivelle.example
      - type: aucun_autre_changement_de_fichier
        sauf: [courrier/2026-06]
      - type: aucun_courriel_supprime
pieges:
  - un recommandé se range à la date de son avis de réception, pas à celle de la lettre
  - un lot en gestion dans une copropriété du syndic garde le code de son lot
  - une copropriété et un immeuble en gestion partagent la même adresse
