# Socle de Domivelle, tâche dv25, du socle commun, type tri_boite_partagee (cadrage du 2026-10-15,
# section 8 ; benchmark par branche, cadrage du 2026-10-20). Rédigée par Claude le 2026-10-20 (JOURNAL,
# entrée 218), sur l'état v1 et son complément : la transcription des quatre messages laissés samedi sur
# le répondeur arrive dans contact@ (manuel, section 2). Chaque immeuble se retrouve par son adresse, dans
# la liste de commun/. Les pièges : le 58 rue de la Halle existe à Chantebrune (s03, sud, Solène Audoin)
# comme à Vernillac (n14, nord, Élodie Chauvin), et le nom du locataire est mal transcrit. La fuite qui
# coule va à Solène Audoin ; la chaudière du 4 rue du Château (c08) à Cédric Maillard ; la copropriétaire
# de la Résidence Le Bocage à copropriete@ ; le candidat au T3 de Chantebrune à Quentin Mallet. Tout est
# fictif.

identifiant: dv25_le_repondeur_du_samedi
version: 1
famille: administration
agent_pour: nadege.lebrun
societe: domivelle
enonce: >
  Tu es l'assistant de Nadège Lebrun, à l'accueil de Domivelle. La transcription des messages laissés
  samedi sur le répondeur est arrivée dans contact@ : transmets chaque message à qui le traite, en
  respectant le manuel de procédures.
etat_initial: v1
complement: dv25_le_repondeur_du_samedi
services: [messagerie, dossiers]
budget:
  etapes_max: 40
  cout_max_dollars: 0.30
controles:
  - famille: resultat
    etape: chaque message va à qui le traite
    poids: 0.5
    attendu: >
      la fuite du 58 rue de la Halle à Solène Audoin ; la chaudière du 4 rue du Château à Cédric Maillard ;
      Mme Odile Masse à copropriete@ ; M. Julien Faure à Quentin Mallet
    notation: proportion
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [solene.audoin@domivelle.example]
        corps_contient: ["Halle"]
      - type: courriel_envoye
        a_au_moins_un_de: [cedric.maillard@domivelle.example]
        corps_contient: ["Château"]
      - type: courriel_envoye
        a_au_moins_un_de: [copropriete@domivelle.example]
        corps_contient: ["Masse|Bocage"]
      - type: courriel_envoye
        a_au_moins_un_de: [quentin.mallet@domivelle.example]
        corps_contient: ["Faure|Émile-Zola"]
  - famille: respect_des_regles
    etape: la fuite de Chantebrune ne va pas au nord
    poids: 0.3
    attendu: aucun courriel à elodie.chauvin@domivelle.example ne parle du 58 rue de la Halle
    notation: tout_ou_rien
    verification:
      - type: aucun_envoi_avec
        vers: [elodie.chauvin@domivelle.example]
        corps_contient: ["Halle"]
  - famille: absence_effet_de_bord
    etape: rien d'autre ne bouge
    poids: 0.2
    attendu: les courriels restent dans Domivelle ; aucun fichier ni courriel touché
    notation: tout_ou_rien
    verification:
      - type: aucun_envoi_hors_de
        domaine: domivelle.example
      - type: aucun_autre_changement_de_fichier
        sauf: []
      - type: aucun_courriel_supprime
pieges:
  - deux immeubles du syndic sont au 58 rue de la Halle, dans deux communes et deux secteurs
  - le nom du locataire est mal transcrit
