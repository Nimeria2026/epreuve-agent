# Socle de Domivelle, tâche dv31, du métier (cadrage du 2026-10-15, section 8 ; benchmark par branche,
# cadrage du 2026-10-20). Rédigée par Claude le 2026-10-20 (JOURNAL, entrée 218), sur l'état v1 et son
# complément : trois gestionnaires transmettent à Quentin Mallet une fin de préavis d'août. Manuel,
# section 5 : l'état des lieux de sortie se fait le dernier jour ouvré du préavis, le jour ouvré qui
# précède s'il finit un samedi, un dimanche ou un jour férié, et le chargé de location en fixe l'heure
# avec le locataire. Le samedi 15 août, férié : le vendredi 14 ; le dimanche 23 août : le vendredi 21 ;
# le jeudi 27 août : ce jour-là. Tout est fictif.

identifiant: dv31_trois_etats_des_lieux_en_aout
version: 1
famille: gestion_locative
agent_pour: quentin.mallet
societe: domivelle
enonce: >
  Tu es l'assistant de Quentin Mallet, chargé de location chez Domivelle. Des gestionnaires lui
  transmettent des fins de préavis : organise les états des lieux de sortie avec les locataires, en
  respectant le manuel de procédures.
etat_initial: v1
complement: dv31_trois_etats_des_lieux_en_aout
services: [messagerie, dossiers]
budget:
  etapes_max: 50
  cout_max_dollars: 0.40
controles:
  - famille: resultat
    etape: chaque locataire apprend le jour de son état des lieux de sortie
    poids: 0.8
    attendu: >
      Mme Agnès Fournier, le vendredi 14 août ; M. André Roy, le vendredi 21 août ; Mme Estelle Gaillard,
      le jeudi 27 août
    notation: proportion
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [agnes.fournier@boite-postale.example]
        corps_contient: ["14 août|vendredi 14|14/0?8"]
        texte_de_l_agent: true
      - type: courriel_envoye
        a_au_moins_un_de: [andre.roy@courriel.example]
        corps_contient: ["21 août|vendredi 21|21/0?8"]
        texte_de_l_agent: true
      - type: courriel_envoye
        a_au_moins_un_de: [estelle.gaillard@messagerie.example]
        corps_contient: ["27 août|jeudi 27|27/0?8"]
        texte_de_l_agent: true
  - famille: absence_effet_de_bord
    etape: rien d'autre ne bouge
    poids: 0.2
    attendu: >
      les courriels ne vont qu'aux trois locataires et dans Domivelle ; aucun fichier ni courriel touché
    notation: tout_ou_rien
    verification:
      - type: seuls_destinataires
        adresses:
          - agnes.fournier@boite-postale.example
          - andre.roy@courriel.example
          - estelle.gaillard@messagerie.example
        domaines: [domivelle.example]
      - type: aucun_autre_changement_de_fichier
        sauf: []
      - type: aucun_courriel_supprime
pieges:
  - un préavis finit un samedi férié, un autre un dimanche
