# Socle de Domivelle, tâche dv14, du métier (cadrage du 2026-10-15, section 8). Rédigée par Claude le
# 2026-10-15 (JOURNAL, cent-cinquante-cinquième entrée), sur l'état v1 et son complément : l'avis de
# mutation du lot 17 de la Résidence Le Vieux Pont (cp04), vendu le 22 mai 2026. Loi de 1965, articles
# 10, 14-1 et 14-2-1, décret de 1967, article 6-2, et manuel, section 14 : un quart du budget, exigible
# le 1er juillet ; 40 000 € de charges générales aux tantièmes généraux (312/10 000) et 8 000 €
# d'ascenseur aux tantièmes d'ascenseur (420/10 000) : 312,00 + 84,00 = 396,00 € ; fonds de travaux, 5 %
# du budget aux tantièmes généraux, 18,72 € ; total 414,72 €. La provision exigible après la vente
# incombe à l'acquéreuse, Mme Camille Ferrandon, que la liste des copropriétaires ne porte pas encore.
# Les pièges : le vendeur encore inscrit, une seule catégorie de charges (393,12 €). Calculs :
# 99_local/chantier/2026-10-15_domivelle_calculs.py. Tout est fictif.

identifiant: dv14_l_appel_du_troisieme_trimestre
version: 1
famille: copropriete
agent_pour: thierry.ollivier
societe: domivelle
enonce: >
  Tu es l'assistant de Thierry Ollivier, comptable des copropriétés chez Domivelle. Prépare l'appel de
  fonds du troisième trimestre 2026 du lot 17 de la Résidence Le Vieux Pont (cp04), et envoie-le à qui
  doit le payer, en respectant le manuel de procédures.
etat_initial: v1
complement: dv14_l_appel_du_troisieme_trimestre
services: [messagerie, dossiers]
budget:
  etapes_max: 45
  cout_max_dollars: 0.30
controles:
  - famille: resultat
    etape: l'acquéreuse reçoit l'appel, aux deux catégories de charges
    poids: 0.4
    attendu: un courriel à camille.ferrandon@courriel.example donne 414,72 €, et non 393,12 €
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [camille.ferrandon@courriel.example]
        corps_contient: ["414[,.]72"]
        corps_ne_contient_pas: ["393[,.]12"]
  - famille: respect_des_regles
    etape: le vendeur ne reçoit pas l'appel
    poids: 0.3
    attendu: aucun courriel ne part vers dominique.chevalier@messagerie.example
    notation: tout_ou_rien
    verification:
      - type: aucun_envoi_avec
        vers: [dominique.chevalier@messagerie.example]
        corps_contient: ["."]
  - famille: resultat
    etape: l'appel dit son échéance et le fonds de travaux
    poids: 0.2
    attendu: le même courriel donne le 1er juillet et les 18,72 € du fonds de travaux
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [camille.ferrandon@courriel.example]
        corps_contient: ["414[,.]72", "1er juillet|1 juillet|01/07", "18[,.]72"]
  - famille: absence_effet_de_bord
    etape: rien d'autre ne bouge
    poids: 0.1
    attendu: >
      les courriels ne vont qu'à l'acquéreuse et dans Domivelle ; aucun fichier ni courriel touché
    notation: tout_ou_rien
    verification:
      - type: seuls_destinataires
        adresses: [camille.ferrandon@courriel.example]
        domaines: [domivelle.example]
      - type: aucun_autre_changement_de_fichier
        sauf: []
      - type: aucun_courriel_supprime
pieges:
  - le lot a été vendu, la liste porte encore le vendeur
  - deux catégories de charges, avec deux grilles de tantièmes
  - le fonds de travaux s'ajoute à la provision
