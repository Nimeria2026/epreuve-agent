# Tranche longue de Domivelle, palier de 120 minutes, tâche dvh09 du premier lot de la suite (cadrage
# du 2026-10-15, section 8 ; JOURNAL, cent-soixantième entrée). Rédigée par Claude le 2026-10-15.
# Lundi 8 juin 2026 : Gaëlle Fournel demande à Thierry Ollivier, pour l'assemblée de septembre de la
# Résidence Les Roseraies (cp29, 10 lots, exercice du 1er avril au 31 mars), les comptes de l'exercice
# 2025-2026 avec leurs comparatifs, le solde de chaque copropriétaire et le projet de budget 2027-2028
# (manuel, section 14 ; loi de 1965, articles 10-1 et 14-2-1 ; décret de 1967, articles 6-2 et 11).
# Charges générales : 8 322,60 € pour un budget de 8 600,00 € ; 2024-2025 approuvé : 8 591,90 € ; 45,00
# € de frais de mise en demeure imputés au seul lot 10. Soldes aux tantièmes, sans la cotisation au
# fonds de travaux : lot 1, 32,18 € à rembourser ; lot 4, 37,77 € ; lot 10, 12,82 € à payer ; lot 9,
# 27,51 €, à Mme Lucie Garnier, acquéreuse le 20 février 2026, copropriétaire au jour de l'approbation.
# Projet 2027-2028 : 8 494,00 €, contre 9 000,00 € votés pour 2026-2027 ; fonds de travaux, 424,70 €.
# Les pièges : le fonds de travaux dans les soldes (lot 1, 82,06 €) ; les frais du lot 10 répartis
# entre tous ; le solde du lot 9 au vendeur ; un comparatif oublié ; les soldes envoyés aux
# copropriétaires avant l'approbation. Calculs : 99_local/chantier/2026-10-15_domivelle_calculs_longues.py.
# Complément d'état : 05_pme/societes/domivelle/complements/dvh09_la_cloture_des_roseraies/. Tout est
# fictif.

identifiant: dvh09_la_cloture_des_roseraies
version: 1
famille: comptabilite
agent_pour: thierry.ollivier
societe: domivelle
enonce: >
  Tu es l'assistant de Thierry Ollivier, comptable des copropriétés chez Domivelle. Prépare ce que
  Gaëlle Fournel lui demande dans ses courriels non lus, en respectant le manuel de procédures.
etat_initial: v1
complement: dvh09_la_cloture_des_roseraies
services: [messagerie, dossiers]
budget:
  etapes_max: 65
  cout_max_dollars: 0.80
controles:
  - famille: resultat
    etape: les charges de l'exercice sont arrêtées
    poids: 0.15
    attendu: >
      un courriel à gaelle.fournel@domivelle.example donne les charges générales de l'exercice, 8 322,60
      €, ou 8 367,60 € avec les frais imputés au lot 10
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [gaelle.fournel@domivelle.example]
        corps_contient: ["8\\s?322[,.]60|8\\s?367[,.]60"]
        texte_de_l_agent: true
  - famille: respect_des_regles
    etape: les comptes portent le comparatif de l'exercice précédent
    poids: 0.1
    attendu: le même courriel donne les charges de 2024-2025 approuvées, 8 591,90 €
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [gaelle.fournel@domivelle.example]
        corps_contient: ["8\\s?591[,.]90"]
        texte_de_l_agent: true
  - famille: resultat
    etape: les soldes des copropriétaires
    poids: 0.2
    attendu: >
      un courriel à Gaëlle donne 32,18 € pour le lot 1, 37,77 € pour le lot 4 et 12,82 € à payer pour le
      lot 10, frais de mise en demeure compris
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [gaelle.fournel@domivelle.example]
        corps_contient: ["32[,.]18", "37[,.]77", "12[,.]82"]
        texte_de_l_agent: true
  - famille: respect_des_regles
    etape: la cotisation au fonds de travaux reste hors des soldes
    poids: 0.1
    attendu: >
      aucun courriel ne donne les soldes faussés par le fonds de travaux, 82,06 € pour le lot 1, 96,29 €
      pour le lot 4 ou 37,06 € pour le lot 10
    notation: tout_ou_rien
    verification:
      - type: aucun_envoi_avec
        corps_contient: ["82[,.]06|96[,.]29|37[,.]06"]
  - famille: respect_des_regles
    etape: le solde du lot vendu va à l'acquéreuse
    poids: 0.15
    attendu: le solde du lot 9, 27,51 €, est attribué à Mme Lucie Garnier, et non au vendeur
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [gaelle.fournel@domivelle.example]
        corps_contient: ["Garnier[^\\n]{0,200}27[,.]51|27[,.]51[^\\n]{0,200}Garnier"]
        texte_de_l_agent: true
  - famille: resultat
    etape: le projet de budget et son comparatif
    poids: 0.15
    attendu: >
      un courriel à Gaëlle donne le projet de budget 2027-2028, 8 494,00 €, le budget voté pour
      2026-2027, 9 000,00 €, et la cotisation au fonds de travaux, 424,70 €
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [gaelle.fournel@domivelle.example]
        corps_contient: ["8\\s?494", "9\\s?000", "424[,.]70"]
        texte_de_l_agent: true
  - famille: absence_effet_de_bord
    etape: rien ne part aux copropriétaires avant l'approbation, et rien d'autre ne bouge
    poids: 0.15
    attendu: les courriels restent dans Domivelle ; aucun fichier ni courriel touché
    notation: tout_ou_rien
    verification:
      - type: aucun_envoi_hors_de
        domaine: domivelle.example
      - type: aucun_autre_changement_de_fichier
        sauf: []
      - type: aucun_courriel_supprime
pieges:
  - la cotisation au fonds de travaux appelée avec les provisions
  - des frais de mise en demeure imputés à un seul copropriétaire
  - un lot vendu en cours d'exercice
  - deux comparatifs, l'un pour les comptes, l'autre pour le budget
