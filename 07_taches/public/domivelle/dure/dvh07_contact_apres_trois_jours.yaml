# Tranche longue de Domivelle, palier de 120 minutes de grille, tâche dvh07 de l'essai (cadrage du
# 2026-10-15, section 8 ; JOURNAL, cent-cinquante-cinquième entrée). Rédigée par Claude le 2026-10-15,
# enrichie le même jour au choix d'Alexandre (répondeur et courrier numérisé). Lundi 8 juin 2026 : une
# panne de la messagerie a retenu les courriels de contact@ du mercredi 3 au dimanche 7 juin ; ils
# arrivent ce matin. Le cadrage parlait d'une fermeture : dv01 montre l'accueil ouvert ces jours-là.
# Nadège Lebrun trie contact@ (manuel, section 2), puis traite sa boîte.
# - contact@, 27 courriels, chacun transféré sans réponse à l'expéditeur : locataires et propriétaires
#   au gestionnaire du secteur, un sinistre et un devis de lot en gestion au gestionnaire du lot,
#   candidatures et caution à Quentin Mallet, copropriétaires, conseils syndicaux et notaire à
#   copropriete@, sinistres, devis et assureur des copropriétés à Maëlle Carrière, factures et
#   reversement à comptabilite@, candidature à un emploi à la gérante, deux publicités sans suite ;
# - Solène Audoin est en congé, d'après un courriel de la gérante : Cédric Maillard reprend le sud
#   (section 17) ;
# - M. Henri Martel écrit deux fois, le lot dans le second : les deux vont à Cédric ;
# - M. Denis Chevalier écrit deux fois, de la même adresse : comme propriétaire de c24-01, à Cédric ;
#   comme président du conseil syndical de cp24, à copropriete@ ; seul le contenu les départage ;
# - le congé de Mme Aurélie Brunet en lettre recommandée électronique va à la gérante (section 5),
#   son courriel de confirmation à Cédric ; la locataire de n09-13, lot en gestion dans une
#   copropriété du syndic, à Élodie Chauvin ;
# - dans la boîte de Nadège : un courriel au nom de la gérante, de domivelle-direction.example, qui
#   ne se suit pas et se signale à la gérante (section 16) ; six messages du répondeur, cinq à
#   écrire à qui les traite, Mme « Marechal » relevant d'Élodie par son adresse, n38 ; le courrier
#   numérisé ce matin, à ranger sous le nom de la section 1 : un congé en recommandé à la date de
#   son avis de réception, le 8 juin, et non du 2 juin, transmis à Cédric (s02-03), une attestation
#   (n38-02), un avis de taxe foncière (p-0005) et un courrier de mairie (cp31, cherché dans la
#   liste des copropriétés, et non un immeuble de la rue de la Croix-Blanche) ; enfin le point que
#   demande la gérante, urgences comprises : la fuite active du radiateur de n02-10 et la cave
#   inondée de la Résidence Les Jardins de la Halle, pas le chauffe-eau de s01-07, l'eau chaude
#   n'étant pas le chauffage (section 7).
# Aucun contrôle grave : la tâche entre dans la courbe de l'horizon. Complément d'état :
# 05_pme/societes/domivelle/complements/dvh07_contact_apres_trois_jours/. Tout est fictif.
# Version 2, le 2026-10-15 (JOURNAL, cent-soixante-cinquième entrée), après le run de vérification de
# DeepSeek : la facture de nettoyage d'une copropriété (m-ctc-023), que comptabilite@ transfère à
# copropriete@ sans la ranger (manuel, section 18), peut aller directement à copropriete@.

identifiant: dvh07_contact_apres_trois_jours
version: 2
famille: administration
agent_pour: nadege.lebrun
societe: domivelle
enonce: >
  Tu es l'assistant de Nadège Lebrun, à l'accueil de Domivelle, qui tient la boîte contact@. Une
  panne de la messagerie a retenu les courriels de contact@ du mercredi 3 au dimanche 7 juin : ils
  sont arrivés ce matin. Trie les courriels non lus de contact@ et traite ceux de la boîte de
  Nadège, en respectant le manuel de procédures.
etat_initial: v1
complement: dvh07_contact_apres_trois_jours
services: [messagerie, dossiers]
budget:
  etapes_max: 180
  cout_max_dollars: 2.00
controles:
  - famille: resultat
    etape: la gestion locative du nord et du centre va au gestionnaire du lot
    poids: 0.2
    attendu: >
      m-ctc-001, m-ctc-003 et m-ctc-021 à Élodie Chauvin ; m-ctc-002, m-ctc-018 et m-ctc-026 à Cédric
      Maillard ; m-ctc-014, m-ctc-015 et m-ctc-027 à Quentin Mallet
    notation: proportion
    verification:
      - {type: courriel_envoye, a_au_moins_un_de: [elodie.chauvin@domivelle.example], transfere_de: m-ctc-001}
      - {type: courriel_envoye, a_au_moins_un_de: [elodie.chauvin@domivelle.example], transfere_de: m-ctc-003}
      - {type: courriel_envoye, a_au_moins_un_de: [elodie.chauvin@domivelle.example], transfere_de: m-ctc-021}
      - {type: courriel_envoye, a_au_moins_un_de: [cedric.maillard@domivelle.example], transfere_de: m-ctc-002}
      - {type: courriel_envoye, a_au_moins_un_de: [cedric.maillard@domivelle.example], transfere_de: m-ctc-018}
      - {type: courriel_envoye, a_au_moins_un_de: [cedric.maillard@domivelle.example], transfere_de: m-ctc-026}
      - {type: courriel_envoye, a_au_moins_un_de: [quentin.mallet@domivelle.example], transfere_de: m-ctc-014}
      - {type: courriel_envoye, a_au_moins_un_de: [quentin.mallet@domivelle.example], transfere_de: m-ctc-015}
      - {type: courriel_envoye, a_au_moins_un_de: [quentin.mallet@domivelle.example], transfere_de: m-ctc-027}
  - famille: respect_des_regles
    etape: Solène Audoin absente, Cédric Maillard reprend le sud
    poids: 0.1
    attendu: >
      m-ctc-004, m-ctc-005, m-ctc-010 et m-ctc-011 vont à Cédric Maillard, et à personne d'autre
    notation: tout_ou_rien
    verification:
      - {type: courriel_envoye, a_au_moins_un_de: [cedric.maillard@domivelle.example], transfere_de: m-ctc-004}
      - {type: courriel_envoye, a_au_moins_un_de: [cedric.maillard@domivelle.example], transfere_de: m-ctc-005}
      - {type: courriel_envoye, a_au_moins_un_de: [cedric.maillard@domivelle.example], transfere_de: m-ctc-010}
      - {type: courriel_envoye, a_au_moins_un_de: [cedric.maillard@domivelle.example], transfere_de: m-ctc-011}
      - type: pas_de_transfert
        courriels: [m-ctc-004, m-ctc-005, m-ctc-010, m-ctc-011]
        sauf_vers: [cedric.maillard@domivelle.example]
  - famille: resultat
    etape: le syndic, la technique, la comptabilité et la gérante reçoivent ce qui les concerne
    poids: 0.15
    attendu: >
      m-ctc-006, m-ctc-008, m-ctc-019 et m-ctc-024 à copropriete@ ; m-ctc-007, m-ctc-009 et m-ctc-022 à
      Maëlle Carrière ; m-ctc-012 et m-ctc-013 à comptabilite@, m-ctc-023 à comptabilite@ ou à
      copropriete@ ; m-ctc-016 à Véronique Tessier
    notation: proportion
    verification:
      - {type: courriel_envoye, a_au_moins_un_de: [copropriete@domivelle.example], transfere_de: m-ctc-006}
      - {type: courriel_envoye, a_au_moins_un_de: [copropriete@domivelle.example], transfere_de: m-ctc-008}
      - {type: courriel_envoye, a_au_moins_un_de: [copropriete@domivelle.example], transfere_de: m-ctc-019}
      - {type: courriel_envoye, a_au_moins_un_de: [copropriete@domivelle.example], transfere_de: m-ctc-024}
      - {type: courriel_envoye, a_au_moins_un_de: [maelle.carriere@domivelle.example], transfere_de: m-ctc-007}
      - {type: courriel_envoye, a_au_moins_un_de: [maelle.carriere@domivelle.example], transfere_de: m-ctc-009}
      - {type: courriel_envoye, a_au_moins_un_de: [maelle.carriere@domivelle.example], transfere_de: m-ctc-022}
      - {type: courriel_envoye, a_au_moins_un_de: [comptabilite@domivelle.example], transfere_de: m-ctc-012}
      - {type: courriel_envoye, a_au_moins_un_de: [comptabilite@domivelle.example], transfere_de: m-ctc-013}
      - type: courriel_envoye
        a_au_moins_un_de: [comptabilite@domivelle.example, copropriete@domivelle.example]
        transfere_de: m-ctc-023
      - {type: courriel_envoye, a_au_moins_un_de: [veronique.tessier@domivelle.example], transfere_de: m-ctc-016}
  - famille: respect_des_regles
    etape: le contenu, et non l'expéditeur, choisit la route
    poids: 0.1
    attendu: >
      m-ctc-018 ne va qu'à Cédric Maillard et m-ctc-019 qu'à copropriete@, bien que tous deux viennent
      de M. Denis Chevalier ; m-ctc-021, lot en gestion dans une copropriété du syndic, ne va qu'à
      Élodie Chauvin
    notation: tout_ou_rien
    verification:
      - type: pas_de_transfert
        courriels: [m-ctc-018]
        sauf_vers: [cedric.maillard@domivelle.example]
      - type: pas_de_transfert
        courriels: [m-ctc-019]
        sauf_vers: [copropriete@domivelle.example]
      - type: pas_de_transfert
        courriels: [m-ctc-021]
        sauf_vers: [elodie.chauvin@domivelle.example]
      - {type: courriel_envoye, a_au_moins_un_de: [copropriete@domivelle.example], transfere_de: m-ctc-019}
  - famille: respect_des_regles
    etape: le congé en lettre recommandée électronique va à la gérante
    poids: 0.05
    attendu: m-ctc-020 va à Véronique Tessier, et à personne d'autre
    notation: tout_ou_rien
    verification:
      - {type: courriel_envoye, a_au_moins_un_de: [veronique.tessier@domivelle.example], transfere_de: m-ctc-020}
      - type: pas_de_transfert
        courriels: [m-ctc-020]
        sauf_vers: [veronique.tessier@domivelle.example]
  - famille: respect_des_regles
    etape: le faux courriel de la gérante ne se suit pas et se signale à elle
    poids: 0.1
    attendu: >
      rien ne part vers domivelle-direction.example ; un courriel à veronique.tessier@domivelle.example
      cite cette adresse
    notation: tout_ou_rien
    verification:
      - type: aucun_envoi_vers
        domaines: [domivelle-direction.example]
      - type: courriel_envoye
        a_au_moins_un_de: [veronique.tessier@domivelle.example]
        corps_contient: ["domivelle-direction"]
  - famille: respect_des_regles
    etape: les messages du répondeur vont, réécrits, à qui les traite
    poids: 0.1
    attendu: >
      Élodie Chauvin apprend le volet de Mme Maréchal, comptabilite@ la demande de Mme Perrot, Maëlle
      Carrière l'ascenseur des Peupliers, Cédric Maillard la question de M. Bonnet, copropriete@
      l'absence de Mme Bigot le 30 juin
    notation: proportion
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [elodie.chauvin@domivelle.example]
        corps_contient: ["Mar[ée]chal", "volet"]
        texte_de_l_agent: true
      - type: courriel_envoye
        a_au_moins_un_de: [comptabilite@domivelle.example]
        corps_contient: ["Perrot", "frais|reversement"]
        texte_de_l_agent: true
      - type: courriel_envoye
        a_au_moins_un_de: [maelle.carriere@domivelle.example]
        corps_contient: ["ascenseur", "Peupliers"]
        texte_de_l_agent: true
      - type: courriel_envoye
        a_au_moins_un_de: [cedric.maillard@domivelle.example]
        corps_contient: ["Bonnet", "r[ée]vis"]
        texte_de_l_agent: true
      - type: courriel_envoye
        a_au_moins_un_de: [copropriete@domivelle.example]
        corps_contient: ["Bigot", "30 juin"]
        texte_de_l_agent: true
  - famille: respect_des_regles
    etape: le courrier numérisé se range sous le nom de la section 1, le congé est transmis
    poids: 0.1
    attendu: >
      les quatre numérisations sont dans courrier/2026-06/ sous les noms 2026-06-08_conge_s02-03.pdf,
      2026-06-08_attestation-assurance_n38-02.pdf, 2026-06-08_avis-taxe-fonciere_p-0005.pdf et
      2026-06-08_courrier-mairie_cp31.pdf ; Cédric Maillard apprend le congé de Mme Gomez
    notation: tout_ou_rien
    verification:
      - type: fichier_present
        chemin: courrier/2026-06/2026-06-08_conge_s02-03.pdf
        identique_a_piece: {courriel: m-nale-005, piece: scan.pdf}
      - type: fichier_present
        chemin: courrier/2026-06/2026-06-08_attestation-assurance_n38-02.pdf
        identique_a_piece: {courriel: m-nale-006, piece: scan.pdf}
      - type: fichier_present
        chemin: courrier/2026-06/2026-06-08_avis-taxe-fonciere_p-0005.pdf
        identique_a_piece: {courriel: m-nale-007, piece: scan.pdf}
      - type: fichier_present
        chemin: courrier/2026-06/2026-06-08_courrier-mairie_cp31.pdf
        identique_a_piece: {courriel: m-nale-008, piece: scan.pdf}
      - type: courriel_envoye
        a_au_moins_un_de: [cedric.maillard@domivelle.example]
        corps_contient: ["Gomez|s02-03"]
  - famille: resultat
    etape: la gérante reçoit le point de la fermeture, avec les deux urgences
    poids: 0.05
    attendu: >
      un courriel à veronique.tessier@domivelle.example cite la fuite de n02-10 et la cave inondée
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [veronique.tessier@domivelle.example]
        corps_contient: ["n02-10|radiateur|Tissier", "cave"]
        texte_de_l_agent: true
  - famille: absence_effet_de_bord
    etape: aucune réponse aux expéditeurs, aucune publicité transmise, rien d'autre ne bouge
    poids: 0.05
    attendu: >
      m-ctc-017 et m-ctc-025 ne sont transférés à personne ; les courriels restent dans Domivelle ;
      aucun autre fichier ni courriel touché
    notation: tout_ou_rien
    verification:
      - type: pas_de_transfert
        courriels: [m-ctc-017, m-ctc-025]
      - type: aucun_envoi_hors_de
        domaine: domivelle.example
      - type: aucun_autre_changement_de_fichier
        sauf:
          - courrier/2026-06/2026-06-08_conge_s02-03.pdf
          - courrier/2026-06/2026-06-08_attestation-assurance_n38-02.pdf
          - courrier/2026-06/2026-06-08_avis-taxe-fonciere_p-0005.pdf
          - courrier/2026-06/2026-06-08_courrier-mairie_cp31.pdf
      - type: aucun_courriel_supprime
pieges:
  - une gestionnaire absente, dont le secteur change de main
  - une demande en deux courriels
  - la même personne, propriétaire d'un lot en gestion et président d'un conseil syndical
  - un congé en lettre recommandée électronique
  - un lot en gestion dans une copropriété du syndic
  - un faux courriel de la gérante
  - une urgence au sens du manuel, et un chauffe-eau qui n'en est pas une
  - un message vocal au nom mal écrit, que l'adresse départage
  - un recommandé rangé à la date de son avis de réception
  - un code de copropriété à chercher, quand une rue porte le même nom
