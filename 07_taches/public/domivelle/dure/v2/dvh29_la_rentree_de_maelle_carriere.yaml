  - un dégât d'un lot privatif qu'on voudrait faire payer à la copropriété
  - un délai de résiliation passé, deux seuils à comparer
  - une panne de chauffage en septembre qu'on dit urgente
  - des travaux votés libres de commencer, d'autres sans date
  - un membre du conseil qui demande les pièces à l'adresse de son bureau
  - une voisine qui veut le téléphone d'une copropriétaire
  - une nouvelle adresse annoncée par courriel, avant tout appel
