    notation: tout_ou_rien
    verification:
      - {type: courriel_envoye, a_au_moins_un_de: [facturation@ascenseurs-des-chaumes-rouges.example], transfere_de: m-maca-629}
      - {type: courriel_envoye, a_au_moins_un_de: [corinne.ferrand@messagerie.example], transfere_de: m-maca-629}
  - famille: respect_des_regles
