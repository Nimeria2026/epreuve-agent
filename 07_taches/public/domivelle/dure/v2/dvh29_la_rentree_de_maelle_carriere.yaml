    notation: tout_ou_rien
    verification:
      - {type: courriel_envoye, a_au_moins_un_de: [rene.hamon@courriel.example], corps_contient: ["17 septembre"]}
      - {type: courriel_envoye, a_au_moins_un_de: [paul.pichon@mel-perso.example], corps_contient: ["17 septembre"]}
      - {type: courriel_envoye, a_au_moins_un_de: [valerie.chevalier@mel-perso.example], corps_contient: ["17 septembre"]}
      - type: destinataires_separes
        adresses: [rene.hamon@courriel.example, paul.pichon@mel-perso.example, valerie.chevalier@mel-perso.example]
      - {type: courriel_envoye, a_au_moins_un_de: [sinistres@mutuelle-des-deux-rives.example], corps_contient: ["Clos Saint-Roch|cp24|DR-2026-0784"], texte_de_l_agent: true}
      - {type: courriel_envoye, a_au_moins_un_de: [gaelle.fournel@domivelle.example], corps_contient: ["Chevalier", "adresse"]}
  - famille: resultat
    etape: le contrôle de l'ascenseur va à l'ascensoriste, et sa copie à la présidente du conseil syndical
    poids: 0.04
    attendu: >
      Ascenseurs des Chaumes-Rouges et Mme Ferrand, à son adresse de la liste, reçoivent le rapport du contrôle
