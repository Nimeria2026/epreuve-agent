pieges:
  - la date préférée du conseil syndical trop tôt pour la voie postale, une autre hors de la commune
  - des absents qui ne sont pas tous défaillants, des opposants oubliés
  - un chantier promis avant la fin du délai de contestation
  - un délai compté des premières notifications et non de la dernière
  - une question arrivée après la convocation
  - un devis à signer sans mise en concurrence
  - un dégât d'un lot privatif qu'on voudrait faire payer à la copropriété
  - un fonds de travaux qu'on croit facultatif
  - un échéancier qu'on demande au gestionnaire, des frais qu'on voudrait répartir
  - un document demandé à une autre adresse que celle de la liste
