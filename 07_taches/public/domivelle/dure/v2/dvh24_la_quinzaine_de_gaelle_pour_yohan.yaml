    poids: 0.05
    attendu: Mélanie Sabatier ou Nadège Lebrun apprend les trois copropriétaires « voie postale » de cp12
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [melanie.sabatier@domivelle.example, nadege.lebrun@domivelle.example]
        corps_contient: ["Pag[èe]s", "Martel", "Dupuy"]
        texte_de_l_agent: true
  - famille: respect_des_regles
    etape: le procès-verbal se notifie aux opposants et aux défaillants, dans le mois
    poids: 0.1
    attendu: >
      Mélanie Sabatier reçoit les trois opposants et les trois défaillants de cp08, et le 10 octobre
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [melanie.sabatier@domivelle.example]
        corps_contient: ["Lesage", "R[ée]gnier", "Bourdon", "Camus", "Masse", "Huet", "10 octobre|10/10"]
        texte_de_l_agent: true
  - famille: respect_des_regles
