    poids: 0.05
    attendu: Maëlle Carrière apprend que le ravalement du Bocage commence au plus tôt le 28 septembre
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [maelle.carriere@domivelle.example]
        corps_contient: ["28 septembre|28/0?9"]
        texte_de_l_agent: true
  - famille: respect_des_regles
