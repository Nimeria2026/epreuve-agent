# Tranche longue de la v2 de Domivelle, palier de 120 minutes, scénario S3, le remplacement (cadrage
# du 2026-10-22, §16). Rédigée par Claude le 2026-10-23. Lundi 14 septembre 2026 : Gaëlle Fournel,
# gestionnaire des copropriétés CP24 à CP45, remplace Yohan Delmas, en congé du 14 au 25 septembre, sur
# CP01 à CP23 (manuel, sections 3, 13, 14, 15 et 17). Douze courriels non lus. Les Hortensias (cp12),
# exercice clos le 30 juin : trois copropriétaires « voie postale », dont la lettre présentée au plus
# tôt le 15 septembre fait partir le délai le 16 ; la réunion ne peut se tenir avant le 7 octobre
# (décret de 1967, articles 9, 64 et 64-1) : le 6 octobre est trop tôt, le 15 octobre à Vernillac hors
# de la commune de l'immeuble, le jeudi 22 octobre à la salle des fêtes de Montclavel-sur-Cher
# convient ; la question de Mme Lejeune s'inscrit (article 10) ; les comptes et le budget, avec leurs
# comparatifs, sont les pièces de l'article 11 ; le contrat d'ascenseur part au membre du conseil
# syndical à l'adresse de la liste, pas à son adresse professionnelle. Le Moulin Neuf (cp08) : le
# procès-verbal du 10 septembre se notifie avant le 10 octobre aux trois opposants et aux trois
# défaillants, pas à Mme Roche, représentée, comme Yohan le croyait (loi de 1965, article 42) ; le
# ravalement de l'article 25 attend les deux mois de contestation, pas le 1er octobre ; la question de
# M. Lesage, arrivée après la convocation, va à l'assemblée suivante. Les Coteaux (cp09) : un interphone
# à 7 920,00 € dépasse le seuil de mise en concurrence de 6 000,00 € (article 21). Les Iris (cp14) : un
# dégât venu d'un lot privatif se déclare à l'assureur de chaque occupant. Les Violettes (cp16) : une
# infiltration par la toiture-terrasse, à Maëlle Carrière ; l'appel du 1er octobre du lot 15, 354,57 €,
# fonds de travaux compris (article 14-2-1). Les Peupliers (cp17) : la provision du 1er octobre exigible
# trente jours après la mise en demeure (article 19-2), une action à décider avec la gérante, qui seule
# accorde un échéancier ; les frais de recouvrement au seul débiteur (article 10-1). Le Bocage (cp05) :
# le ravalement voté le 9 juillet attend deux mois depuis la dernière notification, une lettre
# recommandée présentée le 27 juillet, et non depuis les courriels du 16 : au plus tôt le lundi 28
# septembre, pas le 21. Complément d'état :
# 05_pme/societes/domivelle/complements/dvh24_la_quinzaine_de_gaelle_pour_yohan/. Tout est fictif.

identifiant: dvh24_la_quinzaine_de_gaelle_pour_yohan
version: 1
famille: copropriete
agent_pour: gaelle.fournel
societe: domivelle
enonce: >
  Tu es l'assistant de Gaëlle Fournel, gestionnaire de copropriétés chez Domivelle. Yohan Delmas, l'autre
  gestionnaire, est en congé jusqu'au 25 septembre, et Gaëlle le remplace. Traite ses courriels non lus
  en son nom, en faisant toi-même ce que le manuel de procédures confie au gestionnaire de la
  copropriété, puis envoie à Yohan, Gaëlle en copie, le point de ce que tu as fait, pour son retour.
etat_initial: v1
complement: dvh24_la_quinzaine_de_gaelle_pour_yohan
services: [messagerie, dossiers]
budget:
  etapes_max: 195
  cout_max_dollars: 2.00
controles:
  - famille: resultat
    etape: l'assemblée des Hortensias se tient dans les délais et dans la commune
    poids: 0.1
    attendu: >
      Mélanie Sabatier et la présidente du conseil syndical apprennent le jeudi 22 octobre, à
      Montclavel-sur-Cher
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [melanie.sabatier@domivelle.example]
        corps_contient: ["22 octobre", "Montclavel"]
        texte_de_l_agent: true
      - type: courriel_envoye
        a_au_moins_un_de: [noemie.hebert@courriel.example]
        corps_contient: ["22 octobre"]
        texte_de_l_agent: true
  - famille: respect_des_regles
    etape: l'ordre du jour porte la question notifiée, la convocation ses pièces
    poids: 0.05
    attendu: >
      Mélanie Sabatier reçoit un ordre du jour avec la question du local à vélos, les comptes et le budget
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [melanie.sabatier@domivelle.example]
        corps_contient: ["v[ée]lo", "comptes", "budget"]
        texte_de_l_agent: true
  - famille: resultat
