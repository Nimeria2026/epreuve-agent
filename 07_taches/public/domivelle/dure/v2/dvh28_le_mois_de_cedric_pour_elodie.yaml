  non lus en son nom, en faisant toi-même ce que le manuel de procédures confie au gestionnaire, puis
  envoie à Cédric le point de ce que tu as fait sur le centre, pour son retour.
etat_initial: v1
complement: dvh28_le_mois_de_cedric_pour_elodie
services: [messagerie, dossiers]
