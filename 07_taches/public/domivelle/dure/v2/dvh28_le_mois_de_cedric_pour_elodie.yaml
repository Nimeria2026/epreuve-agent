# Tranche longue de la v2 de Domivelle, palier de 240 minutes, scénario S3, le remplacement (cadrage
# du 2026-10-22, §16). Rédigée par Claude le 2026-10-23. Lundi 12 octobre 2026 : Élodie Chauvin,
# gestionnaire du nord, reprend le centre de Cédric Maillard, en congé du 12 au 30 octobre (manuel,
# sections 3 à 7, 9, 12 et 17). Douze courriels non lus, la note de Cédric en tête. Les révisions
# d'octobre au 2e trimestre, le T3 2026 ne paraissant que le 15 octobre (section 4) : dix lots du centre
# et du nord, de 323,69 € à 1 105,59 € ; c09-04, oubliée au 10 octobre, 985,22 € à compter du jour de la
# demande ; c12-03, en classe F, c02-03 et n24-03, en classe G, sans révision. Les congés (loi de 1989,
# article 15) : c15-01, mutation justifiée, un mois, fin le jeudi 5 novembre ; c15-10, logement social
# justifié, un mois, fin le lundi 9 novembre ; c05-07, un nouvel emploi qui ne suit pas une perte
# d'emploi, sans justificatif, trois mois, fin le vendredi 1er janvier, férié, état des lieux le jeudi 31
# décembre ; aucun motif pour les propriétaires ; c11-04, un simple courriel. Le chauffage de c11-08 en
# panne depuis le 8 octobre : une urgence, la réparation se commande quel qu'en soit le montant et le
# propriétaire est prévenu le jour même (section 7) ; la fenêtre de c05-02, 520,00 €, attend l'accord
# écrit de la propriétaire. Les dépôts (section 6) : c15-05, immeuble collectif, la provision plafonnée
# à 20 % du dépôt, 282,40 € au plus tard le 30 octobre ; c09-02, la moquette brûlée chiffrée par devis,
# 389,00 € au plus tard le 5 décembre ; c11-02, rendu en retard, majoré de 10 % du loyer, 999,00 €. Les
# régularisations de 2025 de c27, au 16 novembre (section 12) : les décomptes partent un mois avant, le
# gardien à 75 %, sans les honoraires du syndic ni l'assurance, au prorata des jours pour c27-18 ; 189,00 €
# à rendre, 88,45 €, 405,30 €, 132,60 € et 19,18 € dus. Les assurances (section 9) : les mises en demeure
# de c03-02 et c15-03,
# l'assurance pour le compte de la locataire de c03-04 proposée au propriétaire, l'attestation de c15-08
# rangée, celle de n21-05 échue. Deux candidatures pour Quentin Mallet ; Nadège Lebrun apprend à qui
# passer les appels du centre (section 17). Le point à Cédric. Complément d'état :
# 05_pme/societes/domivelle/complements/dvh28_le_mois_de_cedric_pour_elodie/. Tout est fictif.

identifiant: dvh28_le_mois_de_cedric_pour_elodie
version: 1
famille: gestion_locative
agent_pour: elodie.chauvin
societe: domivelle
