# Tranche longue de la v2 de Domivelle, palier de 240 minutes, scénario S2, la clôture du mois (cadrage
# du 2026-10-22, §16). Rédigée par Claude le 2026-10-23. Mercredi 30 septembre 2026 : Thierry Ollivier,
# comptable des copropriétés, clôt septembre (manuel, sections 13, 14 et 15). Les appels du 1er octobre
# du Panorama (cp43), du Bocage (cp05) et des Roseraies (cp29), un courriel par copropriétaire : le quart
# du budget voté, la cotisation au fonds de travaux, 5 % du budget dans un immeuble de plus de dix ans
# (loi de 1965, articles 14-1 et 14-2-1), et les appels de travaux votés, la toiture du Panorama, 9 300,00
# €, et le ravalement du Bocage, 14 200,00 €, aux tantièmes généraux. Le lot 8 du Panorama, vendu le 15
# septembre, et le lot 9 des Roseraies, vendu le 20 février, que la liste donne encore aux vendeurs :
# l'appel va à l'acquéreuse (décret de 1967, article 6-2). Les impayés de septembre : une relance (cp43,
# lot 10), une mise en demeure par lettre recommandée de l'accueil (cp05, lot 6), une exigibilité à
# trente jours, à dire à la gestionnaire, qui décide d'une action avec la gérante (cp29, lot 2, article
# 19-2), ses frais au seul débiteur et non aux charges générales (article 10-1) ; une mise en demeure de
# moins de trente jours, un lot payé, un échéancier accordé par la gérante restent sans geste. La
# provision d'urgence des Violettes (cp16) s'arrête au tiers du devis, 4 200,00 € et non 6 300,00 €
# (décret, article 37). Les comptes des Marronniers (cp36), exercice clos le 30 juin, avec leurs
# comparatifs ; le trop-perçu du lot 23, vendu le 12 mars, 41,24 € sans le fonds de travaux, revient à
# l'acquéreur (article 6-2). Les totaux arrondis lot par lot ou au total sont tous deux acceptés. Le point à
# la gérante. Complément d'état :
# 05_pme/societes/domivelle/complements/dvh27_la_cloture_de_septembre_des_coproprietes/. Tout est fictif.

