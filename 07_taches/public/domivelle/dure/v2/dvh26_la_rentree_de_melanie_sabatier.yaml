# Tranche longue de la v2 de Domivelle, palier de 240 minutes, scénario S1, le retour (cadrage du
# 2026-10-22, §16). Rédigée par Claude le 2026-10-23. Lundi 31 août 2026 : Mélanie Sabatier, assistante
# de copropriété, rentre de quatre semaines de congé (manuel, sections 2, 3, 13, 14 et 15). Sa boîte,
# copropriete@ et notifications@. Les Roseraies (cp29) : Gaëlle Fournel propose le mardi 22 septembre,
# ou le jeudi 24 ; MM. Baudin et Weber, « voie postale », reçoivent une lettre présentée au plus tôt le
# 1er septembre, le délai part le 2, la réunion se tient au plus tôt le 23 (décret de 1967, articles 9,
# 64 et 64-1) : le 24 ; huit convocations électroniques, chacune à part, dont l'acquéreuse du lot 9,
# vendu le 20 février et encore au nom du vendeur dans la liste, deux lettres recommandées par
# l'accueil ; la question de Mme Marie, notifiée le 18 août, s'inscrit (article 10) ; le président du
# conseil syndical reçoit le contrat qu'il demande. Le Domaine des
# Saules (cp03) : la convocation du 8 octobre de Yohan Delmas, à dix copropriétaires, Mme Chevalier une
# fois pour ses deux lots, et deux lettres recommandées ; la question d'une locataire ne s'inscrit pas.
# Le Panorama (cp43) : le procès-verbal du 4 août aux deux opposants et aux deux défaillants, dont M.
# Maréchal par lettre recommandée, avant le 4 septembre, pas à M. Leclerc, représenté et pour (loi de
# 1965, article 42) ; la toiture, votée à l'article 25, attend les deux mois ; les appels de fonds à
# Thierry Ollivier. Le Square des Écoles (cp22) : la notification électronique du procès-verbal du 2
# juillet à M. Besnard est revenue le 31 juillet ; elle repart par lettre recommandée, et le ravalement
# ne se date pas du 5 octobre, deux mois après les lettres présentées les 3 et 4 août. Un membre du
# conseil syndical des Platanes (cp32) reçoit le contrat demandé à l'adresse de la liste, pas à celle
# de son bureau (section 15). copropriete@ se trie : Thierry, Yohan, Gaëlle, Maëlle Carrière, la
# gérante, comptabilite@, et une publicité sans suite (section 2) ; à notifications@, la contestation
# d'un copropriétaire des Charmilles (cp41) va à Gaëlle. Le point à chaque gestionnaire.
# Complément d'état : 05_pme/societes/domivelle/complements/dvh26_la_rentree_de_melanie_sabatier/.
# Tout est fictif.

