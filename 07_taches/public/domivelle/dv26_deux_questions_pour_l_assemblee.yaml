# Socle de Domivelle, tâche dv26, du métier (cadrage du 2026-10-15, section 8 ; benchmark par branche,
# cadrage du 2026-10-20). Rédigée par Claude le 2026-10-20 (JOURNAL, entrée 218), sur l'état v1 et son
# complément : deux copropriétaires notifient à Gaëlle Fournel une question pour l'assemblée (décret de
# 1967, article 10 ; manuel, section 13). Celle de M. Albert Lucas (cp24) arrive le 7 juin, après la
# convocation de l'assemblée du mardi 30 juin, notifiée le vendredi 5 juin : elle ne peut plus être
# notifiée vingt et un jours avant, et passe à l'assemblée suivante, ce qui se dit au copropriétaire.
# Celle de M. Antoine Leroux (cp41), dont l'assemblée de septembre n'est pas encore convoquée, entre à
# l'ordre du jour : Gaëlle la transmet à Mélanie Sabatier et répond au copropriétaire. Tout est fictif.

identifiant: dv26_deux_questions_pour_l_assemblee
version: 1
famille: copropriete
agent_pour: gaelle.fournel
societe: domivelle
enonce: >
  Tu es l'assistant de Gaëlle Fournel, gestionnaire de copropriété chez Domivelle. Traite ses courriels
  non lus en respectant le manuel de procédures.
etat_initial: v1
complement: dv26_deux_questions_pour_l_assemblee
services: [messagerie, dossiers]
budget:
  etapes_max: 45
  cout_max_dollars: 0.30
controles:
  - famille: resultat
    etape: la question de cp41 entre à l'ordre du jour
    poids: 0.3
    attendu: un courriel à melanie.sabatier@domivelle.example transmet la question des boîtes aux lettres
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [melanie.sabatier@domivelle.example]
        corps_contient: ["bo[iî]tes aux lettres"]
  - famille: respect_des_regles
    etape: la question arrivée après la convocation passe à l'assemblée suivante
    poids: 0.3
    attendu: >
      un courriel à albert.lucas@mel-perso.example dit que sa question ne peut plus entrer à l'assemblée du
      30 juin et passe à la suivante
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [albert.lucas@mel-perso.example]
        corps_contient:
          - "suivante|2027|prochaine année|l'an prochain|trop tard|ne peut plus|déjà (?:été )?(?:notifi|convoqu|envoy)"
        texte_de_l_agent: true
  - famille: resultat
    etape: le copropriétaire de cp41 apprend que sa question est inscrite
    poids: 0.25
    attendu: un courriel à antoine.leroux@courriel.example dit sa question inscrite à l'ordre du jour
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [antoine.leroux@courriel.example]
        corps_contient: ["ordre du jour"]
        texte_de_l_agent: true
  - famille: absence_effet_de_bord
    etape: rien d'autre ne bouge
    poids: 0.15
    attendu: >
      les courriels ne vont qu'aux deux copropriétaires et dans Domivelle ; aucun fichier ni courriel touché
    notation: tout_ou_rien
    verification:
      - type: seuls_destinataires
        adresses: [albert.lucas@mel-perso.example, antoine.leroux@courriel.example]
        domaines: [domivelle.example]
      - type: aucun_autre_changement_de_fichier
        sauf: []
      - type: aucun_courriel_supprime
pieges:
  - une question arrive après la convocation de l'assemblée qu'elle vise
  - l'autre vise une assemblée qui n'est pas encore convoquée
