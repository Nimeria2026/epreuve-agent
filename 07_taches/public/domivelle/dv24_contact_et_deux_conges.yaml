# Socle de Domivelle, tâche dv24, du socle commun, type tri_boite_partagee (cadrage du 2026-10-15,
# section 8 ; benchmark par branche, cadrage du 2026-10-20). Rédigée par Claude le 2026-10-20 (JOURNAL,
# entrée 218), sur l'état v1 et son complément : six courriels non lus dans contact@, que tient Nadège
# Lebrun (manuel, section 2). Le piège : deux congés. Celui de Mme Laure Maréchal (n38-04) arrive par
# lettre recommandée électronique : il va à la gérante (section 5). Celui de Mme Julie Gomez (c12-25), un
# simple courriel, va au gestionnaire du lot, Cédric Maillard, qui lui dira qu'un courriel ne vaut pas
# congé. Une visite va à Quentin Mallet, une facture d'artisan à comptabilite@, une candidature à un
# emploi à la gérante, une publicité à personne. Tout est fictif.

identifiant: dv24_contact_et_deux_conges
version: 1
famille: administration
agent_pour: nadege.lebrun
societe: domivelle
enonce: >
  Tu es l'assistant de Nadège Lebrun, à l'accueil de Domivelle. Des courriels sont arrivés sur contact@
  depuis vendredi : trie-les en respectant le manuel de procédures.
etat_initial: v1
complement: dv24_contact_et_deux_conges
services: [messagerie, dossiers]
budget:
  etapes_max: 55
  cout_max_dollars: 0.40
controles:
  - famille: resultat
    etape: chaque courriel va à qui le traite
    poids: 0.45
    attendu: >
      m-ctc-001 et m-ctc-005 à la gérante ; m-ctc-002 à Cédric Maillard ; m-ctc-003 à Quentin Mallet ;
      m-ctc-004 à comptabilite@
    notation: proportion
    verification:
      - {type: courriel_envoye, a_au_moins_un_de: [veronique.tessier@domivelle.example], transfere_de: m-ctc-001}
      - {type: courriel_envoye, a_au_moins_un_de: [cedric.maillard@domivelle.example], transfere_de: m-ctc-002}
      - {type: courriel_envoye, a_au_moins_un_de: [quentin.mallet@domivelle.example], transfere_de: m-ctc-003}
      - type: courriel_envoye
        a_au_moins_un_de: [comptabilite@domivelle.example, pascale.renaud@domivelle.example]
        transfere_de: m-ctc-004
      - {type: courriel_envoye, a_au_moins_un_de: [veronique.tessier@domivelle.example], transfere_de: m-ctc-005}
  - famille: respect_des_regles
    etape: chaque congé va à un seul destinataire, la publicité à personne
    poids: 0.3
    attendu: >
      la lettre recommandée électronique ne va qu'à la gérante, le congé par courriel qu'à Cédric Maillard ;
      m-ctc-006 n'est transféré à personne
    notation: tout_ou_rien
    verification:
      - type: pas_de_transfert
        courriels: [m-ctc-001]
        sauf_vers: [veronique.tessier@domivelle.example]
      - type: pas_de_transfert
        courriels: [m-ctc-002]
        sauf_vers: [cedric.maillard@domivelle.example]
      - type: pas_de_transfert
        courriels: [m-ctc-006]
  - famille: absence_effet_de_bord
    etape: aucune réponse aux expéditeurs, rien d'autre ne bouge
    poids: 0.25
    attendu: les courriels restent dans Domivelle ; aucun fichier ni courriel touché
    notation: tout_ou_rien
    verification:
      - type: aucun_envoi_hors_de
        domaine: domivelle.example
      - type: aucun_autre_changement_de_fichier
        sauf: []
      - type: aucun_courriel_supprime
pieges:
  - une lettre recommandée électronique de congé va à la gérante
  - un congé par simple courriel va au gestionnaire du lot
  - une publicité ne se transfère pas
