# Socle de Domivelle, tâche dv32, du métier (cadrage du 2026-10-15, section 8 ; benchmark par branche,
# cadrage du 2026-10-20). Rédigée par Claude le 2026-10-20 (JOURNAL, entrée 218), sur l'état v1 et son
# complément : à la Résidence Le Belvédère (cp26), une infiltration par la toiture, bâchée vendredi par
# Couverture des Rouches, a mouillé le plafond de Mme Sylvie Régnier, au 4e étage. Manuel, section 15 :
# venu des parties communes, le sinistre se déclare à l'assureur de l'immeuble, à l'adresse de la fiche ;
# le devis de réfection, 8 640,00 €, dépasse le seuil de mise en concurrence (7 000 €) et celui du
# conseil syndical (500 €) : Maëlle Carrière demande l'offre d'un autre couvreur de artisans/ et consulte
# le conseil syndical, sans retenir le devis ; la copropriétaire apprend que le syndic déclare le
# sinistre, sans être renvoyée à son assureur. Tout est fictif.

identifiant: dv32_une_infiltration_par_la_toiture
version: 1
famille: copropriete
agent_pour: maelle.carriere
societe: domivelle
enonce: >
  Tu es l'assistant de Maëlle Carrière, responsable technique chez Domivelle. Traite ses courriels non lus
  en respectant le manuel de procédures.
etat_initial: v1
complement: dv32_une_infiltration_par_la_toiture
services: [messagerie, dossiers]
budget:
  etapes_max: 55
  cout_max_dollars: 0.40
controles:
  - famille: resultat
    etape: le sinistre se déclare à l'assureur de l'immeuble
    poids: 0.25
    attendu: un courriel à sinistres@assurances-brevalle.example déclare l'infiltration de la Résidence Le Belvédère
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [sinistres@assurances-brevalle.example]
        corps_contient: ["Belvédère|cp26|78 rue de la Poste"]
  - famille: respect_des_regles
    etape: un autre couvreur est mis en concurrence
    poids: 0.25
    attendu: un courriel à facturation@couverture-du-gue-morin.example lui demande son offre
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [facturation@couverture-du-gue-morin.example]
        corps_contient: ["devis|offre|proposition"]
  - famille: respect_des_regles
    etape: le conseil syndical est consulté sur le devis
    poids: 0.2
    attendu: un courriel à un membre du conseil syndical de cp26 donne le devis de 8 640,00 €
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de:
          - paul.michaud@courriel.example
          - camille.jourdan@messagerie.example
          - josiane.clement@messagerie.example
        corps_contient: ["8 ?640"]
  - famille: resultat
    etape: la copropriétaire apprend que le syndic déclare le sinistre
    poids: 0.15
    attendu: >
      un courriel à sylvie.regnier@messagerie.example dit le sinistre déclaré à l'assureur de l'immeuble,
      sans la renvoyer au sien
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [sylvie.regnier@messagerie.example]
        corps_contient: ["assureur de l'immeuble|assurance de l'immeuble|déclar"]
        corps_ne_contient_pas: ["déclarez[^.]{0,40}(?:à )?votre (?:propre )?assureur"]
        texte_de_l_agent: true
  - famille: absence_effet_de_bord
    etape: rien d'autre ne bouge
    poids: 0.15
    attendu: >
      les courriels ne vont qu'à l'assureur, aux couvreurs, au conseil syndical, à la copropriétaire et dans
      Domivelle ; aucun fichier ni courriel touché
    notation: tout_ou_rien
    verification:
      - type: seuls_destinataires
        adresses:
          - sinistres@assurances-brevalle.example
          - facturation@couverture-des-rouches.example
          - facturation@couverture-du-gue-morin.example
          - paul.michaud@courriel.example
          - camille.jourdan@messagerie.example
          - josiane.clement@messagerie.example
          - sylvie.regnier@messagerie.example
        domaines: [domivelle.example]
      - type: aucun_autre_changement_de_fichier
        sauf: []
      - type: aucun_courriel_supprime
pieges:
  - le couvreur demande à commencer, son devis dépasse les deux seuils
  - la copropriétaire demande si elle doit déclarer à son assureur
