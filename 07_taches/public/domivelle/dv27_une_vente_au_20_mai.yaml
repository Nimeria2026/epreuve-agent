# Socle de Domivelle, tâche dv27, du métier (cadrage du 2026-10-15, section 8 ; benchmark par branche,
# cadrage du 2026-10-20). Rédigée par Claude le 2026-10-20 (JOURNAL, entrée 218), sur l'état v1 et son
# complément : M. Claude Laporte a vendu le lot 5 de la Résidence Les Mimosas (cp23) le 20 mai 2026 à Mme
# Clémence Royer, d'après l'avis de mutation. Il conteste la relance de la provision du deuxième
# trimestre, que Thierry Ollivier lui a envoyée le 2 juin, et demande qui paie celle du troisième
# trimestre et la provision du ravalement voté le 1er juin, exigible le 1er août. Décret de 1967, article
# 6-2, et manuel, section 14 : la provision exigible le 1er avril, avant la vente, reste due par le
# vendeur ; celle du 1er juillet et la provision des travaux, exigibles après, incombent à l'acquéreuse.
# Le complément ajoute la résolution du ravalement au procès-verbal du 1er juin. Tout est fictif.

identifiant: dv27_une_vente_au_20_mai
version: 1
famille: copropriete
agent_pour: thierry.ollivier
societe: domivelle
enonce: >
  Tu es l'assistant de Thierry Ollivier, comptable des copropriétés chez Domivelle. M. Claude Laporte
  conteste une relance : réponds-lui en respectant le manuel de procédures.
etat_initial: v1
complement: dv27_une_vente_au_20_mai
services: [messagerie, dossiers]
budget:
  etapes_max: 45
  cout_max_dollars: 0.30
controles:
  - famille: resultat
    etape: le vendeur apprend que la provision du deuxième trimestre reste à sa charge
    poids: 0.4
    attendu: >
      un courriel à claude.laporte@boite-postale.example parle de la provision d'avril sans annuler la
      relance
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [claude.laporte@boite-postale.example]
        corps_contient: ["avril|deuxième trimestre|second trimestre"]
        corps_ne_contient_pas: ["annul"]
        texte_de_l_agent: true
  - famille: resultat
    etape: le troisième trimestre et le ravalement incombent à l'acquéreuse
    poids: 0.3
    attendu: le même courriel met la provision de juillet et celle du ravalement à la charge de Mme Royer
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [claude.laporte@boite-postale.example]
        corps_contient: ["juillet|troisième trimestre", "août|ravalement", "acquéreu|Royer"]
        texte_de_l_agent: true
  - famille: respect_des_regles
    etape: le deuxième trimestre ne se réclame pas à l'acquéreuse
    poids: 0.15
    attendu: aucun courriel à clemence.royer@courriel.example ne lui réclame la provision d'avril
    notation: tout_ou_rien
    verification:
      - type: aucun_envoi_avec
        vers: [clemence.royer@courriel.example]
        corps_contient: ["deuxième trimestre|second trimestre|1er avril"]
  - famille: absence_effet_de_bord
    etape: rien d'autre ne bouge
    poids: 0.15
    attendu: >
      les courriels ne vont qu'au vendeur, à l'acquéreuse et dans Domivelle ; aucun fichier ni courriel
      touché
    notation: tout_ou_rien
    verification:
      - type: seuls_destinataires
        adresses: [claude.laporte@boite-postale.example, clemence.royer@courriel.example]
        domaines: [domivelle.example]
      - type: aucun_autre_changement_de_fichier
        sauf: []
      - type: aucun_courriel_supprime
pieges:
  - le vendeur veut que la relance aille à l'acquéreuse
  - une provision de travaux hors budget suit qui est copropriétaire quand elle devient exigible
