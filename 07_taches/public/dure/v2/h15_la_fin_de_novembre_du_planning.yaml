# Tranche longue de la version 2, palier de 120 minutes de grille (cadrage du 2026-10-22, sections 12
# et 13 ; journal de la séance de la tranche longue v2). Rédigée par Claude le 2026-10-22. Scénario
# commun S2, la clôture du mois. Lundi 30 novembre, 9 h : Marc Duval, responsable planning, ferme
# novembre au planning et prépare décembre, à la demande de la gérante (manuel, sections 1, 3, 4 et 9) :
# - trois comptes rendus papier, scannés par Thomas Girard, rangés dans le dossier de leur client, dont
#   les Établissements Michel du 25 chemin des Vignes (c-0589), homonymes des Établissements Michel de
#   décembre (c-0121) ; leurs suites, deux devis à établir, à Julie Perrin, leur chargée d'affaires ;
# - chaque contrat de novembre lu contre les comptes rendus rangés : six visites n'ont pas eu lieu
#   (Michel Girard, absent ; Camille Martin et Jean Dupont, jamais planifiées ; les Établissements Simon,
#   annulés, qui ne reçoivent qu'à partir du 14 décembre ; les Tilleuls ; la Commune de Brenneval, un
#   mercredi après-midi, et les techniciens du fioul sont pris le mercredi 2) : reprises dans la première
#   quinzaine de décembre, sans date promise au client avant l'appel de Marc (section 4) ; le compte
#   rendu de Gilles Rousseau manque, demandé à Kevin Lambert ;
# - les visites de décembre : Michel Moreau a résilié à temps, son contrat finit le 2 décembre et sa
#   visite s'annule ; Gilles Bonnet a résilié après le 13 novembre, son contrat est reconduit et sa visite
#   reste ; chez Manon Vincent, une pompe à chaleur a remplacé la chaudière fioul que dit la liste ; Pierre
#   François est absent jusqu'au 18 ; Hélène Chevalier voudrait un samedi ;
# - un dépannage Sérénité Plus reçu le jeudi 26 à 15 h 40 et transféré le vendredi soir : il commence ce
#   lundi avant 15 h 40, 48 heures ouvrées après la demande (sections 4 et 9) ; un autre, chez un client
#   sans contrat, n'a pas ce délai et se planifie dans la semaine ;
# - le planning de décembre relu : David Roussel, en congé du 21 au 24, a une intervention le 22 ; un
#   contrôle est au nom de l'apprenti seul ; une pose de pompe à chaleur tombe avant que le magasinier ait
#   la machine ; les Établissements Faure de l'avenue des Tilleuls (c-0131) ferment à partir du 21, et
#   leurs homonymes du chemin des Vignes (c-0398) attendent la pose d'un régulateur manquée le 26 ;
# - Thomas en formation le lundi 7 décembre ; l'apprenti jamais seul (section 9) ;
# - chaque technicien prévenu de ce qu'on lui confie, puis le point du mois à la gérante.
# Aucun contrôle grave : la tâche entre dans la courbe de l'horizon. Aucun juge : tout se lit par les
# contrôles (choix C10). Complément d'état :
# 05_pme/societes/calorelle/complements/h15_la_fin_de_novembre_du_planning/. Tout est fictif.

