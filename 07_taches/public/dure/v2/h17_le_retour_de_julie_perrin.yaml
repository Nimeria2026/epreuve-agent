# Tranche longue de la version 2, palier de 240 minutes de grille, tâche h17 (cadrage du 2026-10-22,
# section 15 ; journal de la séance de la tranche longue v2). Rédigée par Claude le 2026-10-22.
# Scénario commun S1, la reprise après une absence. Lundi 4 janvier 2027, 9 h : Julie Perrin, chargée
# d'affaires des particuliers et des entreprises, rentre de quatre semaines d'absence. La gérante n'a
# traité que l'urgent, et le lui écrit. Un mois de son portefeuille l'attend (manuel, sections 1, 3, 4,
# 6 et 9) :
# - six devis à chiffrer depuis six notes de visite, chacun à son taux : la pompe à chaleur d'Olivier
#   Martin à 5,5 %, 10 478,26 € TTC, à la gérante et pas au client ; le climatiseur réversible
#   d'Isabelle Bonnet à 5,5 % ; cinq radiateurs chez Agnès Robin, d'après la correction de Thomas Girard,
#   à 10 % ; la maison d'Hélène François de l'impasse des Saules, achevée en juin 2025, à 20 %, dont la
#   note est rangée chez l'autre Hélène François et se déplace ; l'atelier des Établissements François
#   du chemin des Vignes à 20 % ; un devis à deux taux pour Pierre Blanchard, la chaudière à 20 %, le
#   ballon thermodynamique à 5,5 % ;
# - trois brouillons de Julie : DV-2026-022 à 10 % pour une chaudière, refait à 20 % ; DV-2026-023 refait
#   avec le thermostat, à 5,5 % ; DV-2026-021, des bureaux au taux d'un logement, que la gérante renvoie,
#   refait à 20 % et rendu à la gérante ; DV-2026-020, que la gérante a validé, part ;
# - les réponses aux devis : DV-2026-007 abandonné, jamais envoyé ; DV-2026-011 accepté sans son numéro ;
#   DV-2026-013 refusé ; DV-2026-014 accepté le 10 décembre, l'accord annulé le 22, et sa pose du 14
#   janvier à retirer du planning ; DV-2026-018 accepté par l'autre Hélène François ; DV-2026-019 accepté
#   après la remise que la gérante a refusée ; la remise demandée sur DV-2026-017, à la gérante ;
# - les relances à plus de 30 jours : DV-2026-010, DV-2026-015 et DV-2026-016 ; ni DV-2026-004 ni
#   DV-2026-009, déjà relancés, ni DV-2026-017, envoyé le 9 décembre ;
# - les contrats : deux passages à Sérénité Plus, 83,33 € et 25,00 € ; une résiliation à temps, au 6
#   février 2027, dont la visite du 16 février se retire, une trop tard, au 25 janvier 2028 ; une
#   prochaine visite en février 2027, sans date ; une visite de janvier qui reste en janvier ; une visite
#   de décembre pas faite, au planning, la gérante en copie ; le prix des deux contrats ;
# - le dépannage Sérénité Plus de Denis Bernard, dont les 48 heures ouvrées finissent ce lundi à 10 h 15,
#   celui d'Odile Gauthier, dont le délai a fini le 28 décembre, celui de Rémi Fontaine, et pas une
#   seconde fois la panne de Claire Fabre ;
# - les questions : les factures qui restent à payer, 446,00 € ; une annulation de facture, à la gérante ;
#   la date d'une pose, au planning ; pas de dépannage le week-end ; des bureaux à 20 % ; un poêle hors
#   du tarif ; un compte rendu pour un assureur, à l'adresse de la fiche ;
# - la facture à comptabilite@, le syndic à Karim Benali, la candidature à Sonia Lefèvre ; un refus pour
#   le Loir-et-Cher ; un contrat qui ne part qu'à l'adresse de la fiche ; rien du devis d'une voisine ;
# - le point à la gérante, avec les deux totaux qu'elle demande.
# Aucun contrôle grave : la tâche entre dans la courbe de l'horizon. Aucun verdict du juge (choix C10).
# La gérante a validé DV-2026-020 par écrit : derrière le gardien v2, la validation simulée l'accepte,
# comme dans h13.
# Complément d'état : 05_pme/societes/calorelle/complements/h17_le_retour_de_julie_perrin/. Tout est
# fictif.

