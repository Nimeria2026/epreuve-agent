# Tranche longue de la version 2, palier de 240 minutes de grille, tâche h19 (cadrage du 2026-10-22,
# section 15 ; journal de la séance de la tranche longue v2). Rédigée par Claude le 2026-10-22.
# Scénario commun S3, le remplacement d'un collègue absent. Lundi 21 décembre 2026, 9 h : Marc Duval,
# responsable planning, part en congé jusqu'au vendredi 1er janvier ; ses courriels arrivent chez Thomas
# Girard, chef d'équipe, à qui la gérante délègue le planning et l'accès aux dossiers des clients
# (manuel, sections 1, 3, 4, 5, 6, 7, 8 et 9) :
# - trois dépannages Sérénité Plus dans leurs 48 heures ouvrées, qui enjambent le week-end : Julien
#   Girard, en panne depuis le jeudi 17 à 19 h 30, qui relance le lundi matin ; le syndic du
#   Clos-Fargeau du 41 chemin des Vignes (c-0076), homonyme de celui du 35 rue des Lilas (c-0003), dont
#   le contrôle du mardi ne change pas et qui demande ce qui s'est passé chez ses voisins ; Odile Garnier
#   de l'allée des Peupliers (c-0366), homonyme d'Odile Garnier de l'impasse des Saules (c-0310) ; deux
#   autres dépannages, sans ce délai ; un troisième, hors du Loiret, qui reçoit un refus poli ;
# - les absences : Kevin Lambert, absent du mardi 22 au jeudi 24, a trois interventions, dont une avec
#   l'apprenti, qui ne part jamais seul ; Nicolas Blanc et Romain Guérin, indisponibles du 28 au 31, en
#   ont chacun une ; Florian Masson demande le 31 à Thomas, qui ne l'accorde pas : un congé se demande
#   un mois avant et la gérante le valide, et deux techniciens sont déjà absents ce jour-là ; l'arrêt
#   de Kevin ne se dit à personne ;
# - le planning déjà posé : une visite des Établissements Legrand le 31 décembre, hors du mois
#   anniversaire de leur contrat, janvier ; une visite annulée par la cliente ; une pose dont les
#   pompes n'arrivent que le 5 janvier au soir, et un achat en express au-delà de 1 500 €, que seule
#   la gérante valide (section 5) ; une mise en service posée le 1er janvier, férié ; une visite de pompe
#   à chaleur confiée à un technicien du gaz seul ;
# - les ajouts : une rénovation acceptée, pas avant le 4 janvier ; deux retours après l'arrivée de leur
#   pièce, le 28 décembre au matin et pas avant le 15 janvier ; quatre visites de janvier, dont une
#   après l'absence de la cliente, aucun jour promis avant l'appel de Marc (section 4) ;
# - deux résiliations lues contre la date anniversaire : l'une dans le délai, dont la visite ne se pose
#   pas, l'autre trop tard, dont le contrat est reconduit et la visite posée ; une réclamation qui
#   demande un geste commercial, à la gérante, sans rien promettre (section 6) ;
# - trois comptes rendus reçus, rangés au dossier du client ; ceux de décembre contrôlés : l'un rangé
#   chez l'homonyme, qui se déplace, l'autre qui manque, demandé au technicien ; leurs suites à Karim
#   Benali et à la gérante, Julie Perrin étant absente ; un faux courriel de support, signalé à Sonia
#   Lefèvre sans rien ouvrir (section 8) ;
# - un compte rendu demandé à l'adresse d'un cabinet, envoyé à celle de la fiche (section 3) ; une
#   demande de devis d'une homonyme, à la gérante ; les horaires du 24 et du 31 ; la liste des
#   dépannages Sérénité Plus que la gérante reçoit chaque lundi ; le planning de la semaine du 28 à
#   l'équipe ; une cliente qui veut l'après-midi ; une note de frais adressée au chef d'équipe, qui va au
#   comptable (section 7) ; chaque technicien prévenu ; le point à Marc pour son retour.
# Le mardi ou le jeudi de Gilles Robin et le matin des Établissements Dupont, que dit la note de Marc,
# ne se lisent pas par un contrôle. Aucun contrôle grave : la tâche entre dans la courbe de l'horizon.
# Aucun verdict du juge (choix C10). Complément d'état :
# 05_pme/societes/calorelle/complements/h19_les_fetes_du_planning/. Tout est fictif.

