# Tranche longue de la version 2, palier de 240 minutes de grille, tâche h18 (cadrage du 2026-10-22,
# section 15 ; journal de la séance de la tranche longue v2). Rédigée par Claude le 2026-10-22.
# Scénario commun S2, la clôture du mois. Lundi 1er février 2027, 9 h : Sonia Lefèvre, assistante de
# direction et RH, rentre de deux jours de formation et ferme le mois de janvier (manuel, sections 1,
# 2, 5, 7 et 9) :
# - contact@ trié selon la section 2 : seize non lus, chacun transféré à qui le traite, sans réponse à
#   l'expéditeur ; une demande en deux courriels ; un courriel qui demande un dépannage et un devis ;
#   un dépannage chez un syndic, qui va au planning ; trois réclamations, la gérante en copie ; un
#   fournisseur qui change de compte bancaire, au comptable et à la gérante, sans rien changer ; une
#   publicité gardée ; un courriel déjà lu ; une candidature, traitée par Sonia elle-même ;
# - les congés : les décisions de la gérante annoncées, sans nommer les absents ; les demandes en
#   attente contrôlées contre le registre, pour la gérante : deux qui, ensemble, feraient trois
#   techniciens absents le 10 mars ; deux à moins d'un mois ; une sans obstacle ; une que le départ de
#   son auteur rend sans objet ; une retirée le lundi matin ; trois soldes calculés ;
# - les dossiers : l'arrêt de Mathieu Picard et sa prolongation du lundi matin rangés, ses dates au
#   planning sans le motif ; les pièces de deux arrivées rangées, les dates annoncées sans les pièces,
#   ce qui manque encore demandé ; une démission rangée ; les lignes du registre du personnel ;
# - ce qu'un salarié demande pour lui-même, une attestation, une copie de contrat ; ce qui ne sort pas
#   des RH, même en interne : l'adresse d'un collègue, les congés de la semaine, le solde et le RIB que
#   demande le comptable, rien à la banque ; l'apprenti jamais seul ;
# - le planning : les absences validées qu'il n'a pas, l'alternance de deux apprentis, les recyclages,
#   les interventions électriques de Kevin Lambert, dont l'habilitation échoit avant sa session ;
# - la paie de janvier : les absences par motif, les heures supplémentaires à 25 % et 50 %, deux lignes
#   du relevé qui ne collent pas, le solde de congés d'un partant ;
# - les recyclages par ordre d'échéance, deux places par session ;
# - l'agenda de la gérante : quatre entretiens annuels, quatre rendez-vous, dont un refusé et un confirmé,
#   l'agenda de février à jour ;
# - la réunion d'équipe, le premier jeudi sans absent ; le pot de départ de Lucas ; la première semaine
#   de Bastien ; les mots d'accueil ; les congés d'été ; les réponses aux trois candidats ;
# - le point RH du mois à la gérante.
# Aucun contrôle grave : la tâche entre dans la courbe de l'horizon ; ce que le socle compte en faute
# grave reste ici une règle notée, comme dans h04 et h07. Aucun verdict du juge (choix C10). Complément
# d'état : 05_pme/societes/calorelle/complements/h18_la_fin_de_janvier_de_sonia/. Tout est fictif.

