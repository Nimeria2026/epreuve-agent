pieges:
  - Valérie Perrot complète sa demande de devis dans un second courriel
  - Hélène Bernard demande un dépannage et un devis dans un même courriel
  - un dépannage chez un syndic va au planning, pas au chargé d'affaires
  - un fournisseur qui change de compte bancaire va au comptable et à la gérante, et rien ne change
  - le registre de 2027 a les absences de janvier ; l'arrêt de Mathieu n'est que dans sa boîte
  - seules, les demandes de Yanis et de Mathieu passent ; ensemble, trois techniciens le 10 mars
  - Nicolas demande le 28 janvier un congé du 15 février
  - Lucas part le 26 février, et demande un congé en mars
  - une formation ne se déduit pas des congés payés
  - le planning a les absences d'Antoine et de Kevin, pas celles d'Enzo, de Romain ni de Sébastien
  - Marc demande le motif de l'absence de Mathieu, Thomas l'adresse de Kevin
  - la banque écrit elle aussi, Kevin demande l'attestation pour lui
  - les heures supplémentaires se comptent semaine par semaine, à deux taux
  - le relevé de Thomas porte des heures sur un congé et sur un arrêt
  - l'habilitation de Kevin échoit avant la première session ; celle de Florian, le 30 juin même
  - le jeudi 18 février, Antoine est en congé ; la réunion tombe le 25
  - un entretien évite l'agenda de la gérante et les absences, même seulement demandées
  - Antoine demande le 29 janvier de décaler son congé au 22 février
  - Lucas part avec ses congés payés non pris
  - l'arrêt de Mathieu est prolongé le lundi matin, après tout le reste
  - l'agenda de la gérante se remplit pendant la tâche, et le mardi 9 février à 14 h n'est plus libre
  - Florian redemande le 15 février, jour où Antoine est en congé, à moins d'un mois
  - Nicolas retire le lundi matin sa demande du 15 février, et le premier jour de Bastien change
  - la pièce d'identité de Jade arrive le lundi matin, après sa première pièce
  - sans habilitation, Kevin garde sa visite du 4 mars, pas son installation ni sa mise en service
  - Distri-Clim refuse le créneau proposé, et le suivant tombe pendant le salon
  - Thomas demande les congés de la semaine du 8 février, que porte le planning
  - Patrick, comptable, demande les congés et le salaire de Lucas pour son solde
  - Bastien, technicien de climatisation, n'a pas encore ses attestations au tableau
