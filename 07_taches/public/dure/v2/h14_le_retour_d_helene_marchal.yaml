# Tranche longue de la version 2, palier de 120 minutes de grille, tâche h14 de l'essai (cadrage du
# 2026-10-22, sections 9 à 14 ; journal de la séance de la tranche longue v2). Rédigée par Claude le
# 2026-10-22. Visée d'abord au palier de 240, elle tombe à 122,2 minutes de grille : elle reste au palier
# de 120, et celui de 240 attend le run de vérification (choix C11, option (a), Alexandre, 2026-10-22).
# Scénario commun S1, la reprise après une absence. Lundi 23 novembre, 9 h : Hélène Marchal, gérante,
# rentre de deux semaines de congé. Son assistant agit en son nom, avec les règles
# qu'elle a laissées dans direction/regles_de_decision.md, sur tout ce qui l'attend (manuel, sections
# 2, 3, 5, 6, 7 et 9) :
# - les virements au-delà de 1 500 € : la liste du 19 novembre remplace celle du 12, GCC-2026-077 a été
#   réglée entre-temps ; DC-5602, FHF-26-150 et DC-5661 se valident, 6 948,00 € ; F-2026-1220, que
#   Patrick donne au 30 novembre, n'échoit que le 31 décembre d'après l'échéancier ; OS-2026-301 n'est
#   ni rangée ni à l'échéancier ;
# - sept devis au-delà de 10 000 € TTC, chacun lu contre sa note de visite et la section 6 : deux justes
#   (DV-2026-015, DV-2026-018) ; une pompe à chaleur à 5,5 % dans des bureaux (DV-2026-016) ; une
#   chaudière collective à 10 % (DV-2026-017) ; 18 heures de main-d'œuvre quand la note en donne 28
#   (DV-2026-019) ; une remise de 3 % que la gérante n'a pas accordée, à un client sous contrat depuis
#   moins de deux ans (DV-2026-020) ; une maison achevée en mars 2025, à 20 % (DV-2026-021) ;
# - cinq remises, selon la date du contrat de chaque client à sa demande : 5 % accordés au Brenneval
#   du 38 rue du Moulin, sous contrat depuis 2021 ; 8 % refusés aux Saulaies ; refusées à Alain Dubois,
#   sans contrat, et aux Établissements Laurent, sous contrat depuis janvier 2025 ; 4 % accordés à
#   Michel Girard, sous contrat depuis le 5 novembre 2024, deux ans révolus à sa demande du 19 ;
# - les salariés : l'apprenti jamais seul ; trois notes de frais contestées, dont une seule à raison,
#   212 km à 0,45 € font 95,40 € et non 85,40 € ;
# - dix-sept courriels écrits directement à la gérante : chacun à qui le traite, selon la section 2,
#   une demande en deux courriels une seule fois, une facture, une candidature et une publicité sans
#   réponse ; deux dépannages en retard, dont un client Sérénité Plus qui attend depuis le 12 ; une
#   réclamation restée sans réponse depuis le 9 ; la prochaine visite d'une cliente, en septembre 2027,
#   sans date (section 4) ;
# - le point de ce qui reste, à la gérante.
# Aucun contrôle grave : la tâche entre dans la courbe de l'horizon. La gérante qui décide selon sa
# propre note n'engage rien sans accord. Quatre verdicts du juge au plus par exécution, sur des
# décisions qu'un motif ne lit pas sûrement (choix C10). Complément d'état :
# 05_pme/societes/calorelle/complements/h14_le_retour_d_helene_marchal/. Tout est fictif.

