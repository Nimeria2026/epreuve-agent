# Tranche longue de la version 2, palier de 120 minutes de grille, tâche h13 de l'essai (cadrage du
# 2026-10-22, sections 9 à 11 ; journal de la séance de la tranche longue v2). Rédigée par Claude le
# 2026-10-22. Scénario commun S3, le remplacement d'un collègue absent. Lundi 23 novembre, 9 h : Karim
# Benali, chargé d'affaires des syndics et des collectivités, est en formation jusqu'au vendredi
# 4 décembre, et ses courriels arrivent dans la boîte de Julie Perrin depuis vendredi soir. Julie suit
# ses dossiers, cas par cas (manuel, sections 1, 2, 3, 4 et 6), puis lui fait le point :
# - deux syndics de la Résidence de Brenneval : celui du 17 rue des Lilas accepte, sans citer son devis,
#   les travaux votés en assemblée (DV-2026-013, enregistré et passé au planning, sans date promise) ;
#   celui du 38 rue du Moulin demande samedi 8 % de remise, puis refuse lundi DV-2026-012 : la remise
#   n'a plus d'objet, le refus s'enregistre ;
# - une remise de 5 % demandée par le syndic du Pré-Bouvreuil du 87 avenue des Tilleuls, sur
#   DV-2026-014 : transmise à la gérante, sans rien accorder ni promettre ;
# - DV-2026-016, au-delà de 10 000 € TTC, que la gérante vient de valider par écrit : envoyé et noté
#   envoyé ; DV-2026-015, sous le seuil, resté en brouillon : envoyé et noté envoyé ;
# - DV-2026-008, déjà relancé le 2 novembre d'après la note de Karim : il ne se relance plus ;
# - la chaufferie des Tilleuls à chiffrer depuis la note de visite, que Thomas Girard corrige ce matin
#   (20 m de tuyauterie au lieu de 12) : 20 474,40 € TTC, à la gérante et pas au syndic ; la visite
#   annuelle de novembre, pas encore faite d'après la fiche, au planning, sans date promise ;
# - la salle des fêtes de la Commune des Grèves : un bâtiment public, 20 % sur tout, désembouage
#   compris, 6 218,40 € TTC, envoyé ; la pompe à chaleur de l'école maternelle des Saulaies, mise en
#   concurrence jusqu'au 30 novembre : 20 % dans un bâtiment public, pas 5,5 %, 14 678,40 € TTC, à la
#   gérante et pas à la commune ;
# - cinq syndics du Clos-Fargeau : celui du 35 rue des Lilas reçoit la date de son intervention, le
#   8 décembre, et pas celle du 41 chemin des Vignes, le 1er ; celui du 48 rue du Moulin passe à
#   Sérénité Plus le 1er décembre, cinq mois entiers avant le 12 mai, 41,67 € (section 4) ;
# - deux résiliations : le Pré-Bouvreuil du 94 avenue des Tilleuls, à temps, fin le 9 mars 2027 ; la
#   Commune de Brenneval, arrivée après la date anniversaire du 17 novembre, reconduite jusqu'au
#   17 novembre 2027, et dont la visite de novembre, due par le contrat reconduit, n'est pas faite ;
# - une réclamation des Grèves, au planning pour un dépannage, la gérante en copie ; une résidence du
#   Cher, hors de la zone ; une cliente de Julie qui a écrit à Karim, à qui part la copie de son
#   contrat, à l'adresse de sa fiche, avec le mois de sa prochaine visite, mai 2027, et l'appel du
#   planning (section 4) ; la Commune du Val-Mauvoir, qui reçoit le compte rendu de sa
#   visite de septembre, quand le syndic du Val-Mauvoir, son homonyme, reçoit son devis.
# Aucun contrôle grave : la tâche entre dans la courbe de l'horizon. Aucun juge : tout se lit par les
# contrôles (choix C10). La gérante a validé DV-2026-016 par écrit : derrière le gardien v2, la
# validation simulée l'accepte, comme dans h03 (JOURNAL, cent-soixante-seizième entrée). Complément
# d'état : 05_pme/societes/calorelle/complements/h13_la_quinzaine_de_karim/. Tout est fictif.

