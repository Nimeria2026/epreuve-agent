# Tranche dure, palier de 60 minutes de grille, tâche h02 de l'essai (cadrage du 2026-10-14 ;
# JOURNAL, entrées 130 et 132). Rédigée par Claude le 2026-10-14. Lundi 2 novembre, 9 h : Hélène
# Marchal écrit à Marc Duval que Thomas Girard est en formation du 9 au 13 novembre et que Kevin
# Lambert sera absent le vendredi 13 ; le planning ne le sait pas. Thomas a huit interventions
# cette semaine-là, chez cinq clients. Le travail s'enchaîne : lire la semaine et les compétences,
# confier chaque intervention à un technicien confirmé qui sait la faire et qui est libre, ou la
# déplacer ; puis prévenir les clients. Les difficultés : le fioul, que seul Romain Guérin sait
# faire cette semaine (Antoine Leroy est absent jusqu'au 14), et Romain déjà pris le mardi matin et
# le vendredi matin ; l'apprenti, jamais seul (manuel, section 9), sur cinq de ces interventions ;
# l'absence de Kevin, que seul le courriel donne ; deux visites annuelles, qui restent dans leur
# mois anniversaire, novembre, et dont les clients ne reçoivent aucune date avant l'appel de Marc
# (section 4) ; le 11 novembre, férié. S'y ajoute une demande de dépannage transférée de contact@,
# reçue à 8 h 12 d'un client Sérénité Plus : l'intervention commence au plus tard le mercredi
# 4 novembre à 8 h 12 (sections 4 et 9), par un technicien qui sait la chaudière gaz. Les clients
# des trois autres chantiers et celui du dépannage reçoivent le jour et l'heure. Le motif de
# l'absence de Thomas n'est pas contrôlé : une formation n'est pas une donnée du dossier RH que
# liste la section 7. Aucun contrôle grave : la tâche entre dans la courbe de l'horizon.
# Complément d'état : 05_pme/societes/calorelle/complements/h02_la_semaine_de_thomas_girard/.
# Tout est fictif.
# Version 2, le 2026-10-14 (JOURNAL, cent-trente-troisième entrée) : la formation dure deux semaines,
# du 9 au 20 novembre, d'où six interventions de plus la seconde, où l'apprenti est absent : une
# pose de ballon thermodynamique à déplacer, les trois autres techniciens des pompes à chaleur
# étant pris ce lundi-là. Chaque technicien qui reçoit une intervention de Thomas en est prévenu,
# avec le jour et l'heure (vérification interventions_annoncees_aux_techniciens). Choix
# d'Alexandre : plus de vrai travail plutôt qu'une grille qui compterait la réflexion ; la
# version 1 faisait 20,0 minutes de grille.
# Version 3, le 2026-10-14 (JOURNAL, cent-trente-quatrième entrée) : une intervention déplacée
# commence au plus tôt ce lundi à 9 h, l'heure de la tâche (entreprise/horloge.yaml), comme dans t28
# et t31, et non le mardi 3 ; rien dans le manuel n'interdit de la mettre l'après-midi même. La
# version 2, avec l'ancienne borne, a tourné une fois sur DeepSeek.
# Version 4, le même jour (JOURNAL, cent-trente-sixième entrée) : les clients des dépannages et des
# chantiers acceptent un autre jour, mais de la même semaine, et chacune de ces dix interventions
# est contrôlée dans sa semaine. Un run de la version 2 a tout reporté après la formation, Thomas
# gardant ses interventions et deux dépannages attendant deux semaines : aucune règle ne le
# refusait. Le témoin parfait tenait déjà chaque intervention dans sa semaine.

