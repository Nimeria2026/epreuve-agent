# Tranche dure, palier de 120 minutes de grille, tâche h09 (cadrage du 2026-10-14, section 11 ;
# JOURNAL, entrées 139 et 150). Rédigée par Claude le 2026-10-15. Mardi 10 novembre, 9 h : la vague
# de froid. Marc Duval, responsable planning, a dix-sept demandes de dépannage d'hier et de ce matin :
# quinze transférées par Sonia Lefèvre depuis contact@, sans code de client, et deux syndics qui lui
# écrivent. Le travail, cas par cas (manuel, sections 4 et 9) :
# - chaque client retrouvé dans la liste, deux homonymes compris (deux Jean Leroux, deux syndics de
#   la Résidence du Clos-Fargeau), et son contrat lu dans sa fiche ;
# - dix contrats Sérénité Plus, dépannés sous 48 heures ouvrées depuis la réception sur contact@,
#   que donne l'en-tête du transfert ; mercredi 11 est férié ;
# - le technicien qui a la compétence : fioul, pompe à chaleur, climatisation, ventilation ; Antoine
#   Leroy est absent toute la semaine, Yanis Haddad jeudi et vendredi, ce que seul un courriel dit ;
# - Thomas Girard propose de confier des dépannages à l'apprenti, qui n'intervient jamais seul ;
# - Nathalie André signale deux fois la même panne : une seule intervention, et son délai court
#   depuis la première demande ;
# - un client absent mardi, un autre libre seulement jeudi après-midi, un syndic qui veut une
#   intervention avant vendredi soir ;
# - chaque client reçoit le jour et l'heure, chaque technicien ses nouveaux dépannages.
# Aucun contrôle grave : la tâche entre dans la courbe de l'horizon. Complément d'état :
# 05_pme/societes/calorelle/complements/h09_la_vague_de_froid/. Tout est fictif.

