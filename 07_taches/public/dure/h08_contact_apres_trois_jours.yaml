    verification:
      - type: envois
        nombre: 1
        transfere_de: [m-ctc-801, m-ctc-823]
      - type: envois
        nombre: 1
        transfere_de: [m-ctc-810, m-ctc-816, m-ctc-824]
      - type: pas_de_transfert
