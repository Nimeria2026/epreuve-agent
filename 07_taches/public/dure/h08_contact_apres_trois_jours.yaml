  - famille: respect_des_regles
    etape: une demande ne se transmet qu'une fois, et rien ne part qui ne doit partir
    poids: 0.1
    attendu: >
      un seul transfert de la demande de Pauline Masse, un seul de celle de Martine Lopez ; les
      candidatures et les publicités ne sont transférées à personne ; aucun courriel déjà lu n'est
      transféré
