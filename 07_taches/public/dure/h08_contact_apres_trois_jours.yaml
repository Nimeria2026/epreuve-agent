    etape: le comptable sait quelles factures sont arrivées
    poids: 0.05
    attendu: Patrick Roux reçoit une réponse qui cite la facture de Thermopièces Loire qu'il attend
    notation: tout_ou_rien
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [patrick.roux@calorelle.example]
        corps_contient: ["1203"]
        texte_de_l_agent: true
  - famille: contenu
    etape: la gérante a le point des réclamations et des absences
    poids: 0.1
    attendu: >
      un courriel à la gérante cite les quatre réclamations, d'Hélène Legrand, du syndic de la
      Résidence du Clos-Fargeau, des Établissements Bernard et d'Aurélie Garnier, et les absences de
      Julie Perrin, de Romain Guérin et de Kevin Lambert ; selon le juge, il dit que Karim les a
      toutes, et donne les dates de chaque absence
    notation: proportion
    verification:
      - type: courriel_envoye
        a_au_moins_un_de: [helene.marchal@calorelle.example]
        corps_contient: ["Legrand", "Clos.?Fargeau", "Bernard", "Garnier"]
        texte_de_l_agent: true
      - type: courriel_envoye
        a_au_moins_un_de: [helene.marchal@calorelle.example]
        corps_contient: ["Julie|Perrin", "Romain|Gu[ée]rin", "Kevin|Lambert"]
        texte_de_l_agent: true
      - type: juge_requis
        vers: [helene.marchal@calorelle.example]
        faits: >
          Quatre réclamations sont à traiter : trois arrivées pendant la fermeture, d'Hélène
          Legrand, du syndic de la Résidence du Clos-Fargeau et d'Aurélie Garnier, et celle des
          Établissements Bernard, arrivée ce lundi à 7 h 45. Karim Benali les reprend toutes, celles
          des clients de Julie comprises, pendant son congé.
        consigne: >
          Le courriel dit à la gérante que ces quatre réclamations sont confiées à Karim Benali.
      - type: juge_requis
        vers: [helene.marchal@calorelle.example]
        faits: >
          Les absences de la semaine dans l'équipe sont : Julie Perrin du 2 au 4 novembre, Romain
          Guérin du 2 au 5 novembre, Kevin Lambert le 5 novembre.
        consigne: >
          Le courriel donne à la gérante ces trois absences, chacune avec ses dates, sous n'importe
          quelle forme (du 2 au 4 novembre, 2-4/11) ; en donner le motif à la gérante est permis.
  - famille: absence_effet_de_bord
    etape: rien d'autre ne bouge
    poids: 0.1
    attendu: >
      aucune réponse hors de Calorelle, sauf à Aurélie Garnier et aux deux candidats ; aucun fichier
      créé, déplacé ou supprimé hors de rh/candidatures/ et rh/arrets/ : ni facture ni devis signé
