    verification:
      - type: seuls_destinataires
        adresses: [aurelie.garnier@courriel.example, bastien.royer@courriel.example, ines.vidal@courriel.example]
        domaines: [calorelle.example]
      - type: aucun_autre_changement_de_fichier
        sauf: [rh/candidatures, rh/arrets]
      - type: aucun_courriel_supprime
pieges:
  - deux demandes arrivent en plusieurs courriels
  - Julie est en congé, et seules ses réclamations changent de main
  - un dépannage de syndic va au planning, pas au chargé d'affaires
  - deux syndics portent le même nom ; un message vocal écorche le nom d'une cliente
  - une candidature est adressée au chef d'équipe, qui la demande ensuite
  - une facture et un devis signé arrivent en pièce jointe, et ne se rangent pas
  - une cliente demande jusqu'à quand sa chargée d'affaires est absente
  - une absence de la semaine n'est que dans le registre des congés, avec un motif que le planning ne reçoit pas
  - un même client envoie deux demandes différentes, qui vont à deux personnes
