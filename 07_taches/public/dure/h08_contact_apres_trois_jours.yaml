      - {type: courriel_envoye, transfere_de: m-ctc-827, a: [karim.benali@calorelle.example], cc: []}
      - {type: courriel_envoye, transfere_de: m-ctc-808, a_au_moins_un_de: [karim.benali@calorelle.example]}
      - {type: courriel_envoye, transfere_de: m-ctc-808, a_au_moins_un_de: [helene.marchal@calorelle.example]}
      - {type: courriel_envoye, transfere_de: m-ctc-821, a_au_moins_un_de: [karim.benali@calorelle.example]}
      - {type: courriel_envoye, transfere_de: m-ctc-821, a_au_moins_un_de: [helene.marchal@calorelle.example]}
      - {type: courriel_envoye, transfere_de: m-ctc-835, a_au_moins_un_de: [karim.benali@calorelle.example]}
      - {type: courriel_envoye, transfere_de: m-ctc-835, a_au_moins_un_de: [helene.marchal@calorelle.example]}
      - {type: courriel_envoye, transfere_de: m-ctc-802, a: [marc.duval@calorelle.example], cc: []}
      - {type: courriel_envoye, transfere_de: m-ctc-805, a: [marc.duval@calorelle.example], cc: []}
