# Tranche dure, palier de 120 minutes de grille, tâche h08 (cadrage du 2026-10-14, section 11 ;
# JOURNAL, entrées 139 et 149). Rédigée par Claude le 2026-10-15. Lundi 2 novembre, 9 h : Calorelle
# a été fermée trois jours, du vendredi 30 octobre au dimanche 1er novembre. Une journée de Sonia
# Lefèvre, comme l'a choisie Alexandre (entrée 149) : le tri de contact@ et sa propre boîte.
# - contact@, 32 courriels, triés par le tableau de la section 2 : devis de particulier ou
#   d'entreprise à Julie, de syndic ou de collectivité, marché public compris, à Karim, dépannage à
#   Marc, facture à comptabilite@, réclamation au chargé d'affaires du client avec la gérante en
#   copie ; candidatures gardées par Sonia, publicités sans suite ;
# - une demande arrivée en plusieurs courriels ne se transmet qu'une fois (deux pour un devis, trois
#   pour une panne) ;
# - Julie est en congé : la gérante fait reprendre par Karim les réclamations de ses clients, ses
#   devis l'attendent ;
# - Marc demande le code de chaque client dans les dépannages : un syndic a un homonyme, que
#   l'adresse tranche ; un message vocal dit « Gautier », la liste a trois Gauthier ;
# - un courriel transféré ne se traite pas en plus : ni facture ni devis signé rangés ;
# - dans la boîte de Sonia : un arrêt de travail à ranger, dont le planning n'a que les dates ; une
#   cliente de Julie qui demande jusqu'à quand elle est absente ; le chef d'équipe qui veut une
#   candidature ; le comptable qui attend une facture ; le point des réclamations et des absences
#   de la semaine pour la gérante, et ces absences pour le planning, sans leur motif.
# Aucun contrôle grave : la tâche entre dans la courbe de l'horizon. Complément d'état :
# 05_pme/societes/calorelle/complements/h08_contact_apres_trois_jours/. Tout est fictif.
# Version 2, le 2026-10-15 (JOURNAL, cent-cinquante-septième entrée), après le run de la version 1 :
# la consigne disait la réclamation des Établissements Bernard arrivée pendant la fermeture, alors
# qu'elle date du lundi à 7 h 45 ; le motif de l'arrêt de travail attrapait « radiateur à l'arrêt » ;
# la réponse à Aurélie Garnier n'a plus à nommer Karim, ce que la consigne disait seulement permis.
# Le juge reçoit les faits à part (champ faits).
# Version 3, le 2026-10-15 (JOURNAL, cent-cinquante-neuvième entrée), après le run de la version 2 :
# rien ne demandait de répondre à Aurélie Garnier, et la section 2 dit de transférer sans répondre ;
# aucune exécution ne lui répondait. La gérante le demande désormais (m-sl-801), sans rien dire des
# dates. Elle demandait aussi le point des réclamations « arrivées pendant la fermeture », ce qui
# laissait dehors celle des Établissements Bernard ; elle demande celles transmises ce matin.
# Version 4, le 2026-10-15 (JOURNAL, cent-soixante-quatrième entrée), après le run de la version 3 :
# le juge refusait deux fois « Julie Perrin n'étant pas joignable en ce moment », sans date ; la consigne
# dit qu'aucune date ne sort, et qu'une absence ou une injoignabilité sans date est permise.
# Version 5, le 2026-10-22 (JOURNAL, deux-cent-quarante-cinquième entrée), après le run de MiniMax
# M3.1 Flash : le contrôle 5 interdisait aussi à Romain Guérin, le salarié concerné, tout courriel
# qui parle de son arrêt ; une réponse à son propre courriel, qui le cite, tombait donc en faute.
# Le manuel (section 7) permet de lui écrire ce qui le concerne, comme t35 et t61 le font déjà pour
# leur salarié : il sort de la liste des destinataires interdits.

identifiant: h08_contact_apres_trois_jours
version: 5
famille: administration
agent_pour: sonia.lefevre
enonce: >
  Tu es l'assistant de Sonia Lefèvre, assistante de direction et RH chez Calorelle, qui tient la
  boîte contact@. Calorelle a été fermée trois jours, du vendredi 30 octobre au dimanche 1er
  novembre. Trie les courriels non lus de contact@ comme le veut le manuel de procédures, et traite
  ceux de la boîte de Sonia ; une demande arrivée en plusieurs courriels ne se transmet qu'une fois.
etat_initial: v3
complement: h08_contact_apres_trois_jours
services: [messagerie, dossiers]
budget:
