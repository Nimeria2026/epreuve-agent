        sauf_ajouts_pour: [c-0156, c-0121, c-0222, c-0066]
  - famille: contenu
    etape: Karim sait où en est chaque devis
    poids: 0.15
    attendu: >
      un courriel de l'agent à Karim Benali cite DV-2026-004, 007, 009, 010, 011, 013 et 014, les
      devis neufs de Laurent Blanchard, des Établissements Michel, de Jean Leroux et de Camille
      Martin, et dit, dans ce qu'il écrit de DV-2026-011, quand le relancer : le 19 ou le 20 novembre,
      ou plus de 30 jours après son envoi ; selon le juge, il dit que le devis de Jean Leroux attend
      l'accord écrit de la gérante et que la remise de DV-2026-010 attend sa décision, et aucun
      courriel à Karim ne demande de relancer DV-2026-009 ni DV-2026-013
    notation: proportion
    verification:
      - {type: courriel_envoye, a_au_moins_un_de: [karim.benali@calorelle.example], corps_contient: ["DV[-‑]2026[-‑]004"], texte_de_l_agent: true}
      - {type: courriel_envoye, a_au_moins_un_de: [karim.benali@calorelle.example], corps_contient: ["DV[-‑]2026[-‑]007"], texte_de_l_agent: true}
      - {type: courriel_envoye, a_au_moins_un_de: [karim.benali@calorelle.example], corps_contient: ["DV[-‑]2026[-‑]009"], texte_de_l_agent: true}
      - {type: courriel_envoye, a_au_moins_un_de: [karim.benali@calorelle.example], corps_contient: ["DV[-‑]2026[-‑]010"], texte_de_l_agent: true}
      - {type: courriel_envoye, a_au_moins_un_de: [karim.benali@calorelle.example], corps_contient: ["DV[-‑]2026[-‑]011"], texte_de_l_agent: true}
      - {type: courriel_envoye, a_au_moins_un_de: [karim.benali@calorelle.example], corps_contient: ["DV[-‑]2026[-‑]013"], texte_de_l_agent: true}
      - {type: courriel_envoye, a_au_moins_un_de: [karim.benali@calorelle.example], corps_contient: ["DV[-‑]2026[-‑]014"], texte_de_l_agent: true}
      - {type: courriel_envoye, a_au_moins_un_de: [karim.benali@calorelle.example], corps_contient: ["Blanchard"], texte_de_l_agent: true}
      - {type: courriel_envoye, a_au_moins_un_de: [karim.benali@calorelle.example], corps_contient: ["Michel"], texte_de_l_agent: true}
      - {type: courriel_envoye, a_au_moins_un_de: [karim.benali@calorelle.example], corps_contient: ["Leroux"], texte_de_l_agent: true}
      - {type: courriel_envoye, a_au_moins_un_de: [karim.benali@calorelle.example], corps_contient: ["Camille\\s+Martin|c-0066|DV[-‑]2026[-‑]015"], texte_de_l_agent: true}
      - type: courriel_envoye
        a_au_moins_un_de: [karim.benali@calorelle.example]
        corps_contient:
          - "DV[-‑]2026[-‑]011(?:(?!DV[-‑]\\d{4}[-‑]\\d{3})[\\s\\S]){0,500}?(?:\\b(?:19|20)\\s+nov|\\b(?:19|20)/11\\b|\\b(?:19|20)\\.11\\b|\\b30\\s*jours)"
        texte_de_l_agent: true
      - type: juge_requis
        faits: >
          Le devis neuf de Jean Leroux, 12 904,76 € TTC, dépasse 10 000 € : le manuel veut que la
          gérante le valide, et que le client ne le reçoive qu'après son accord écrit. L'accord écrit
          qu'elle vient de donner porte sur un autre devis, DV-2026-014.
        consigne: >
          Le point dit que le devis de Jean Leroux attend l'accord écrit de la gérante avant d'être
          envoyé au client ; le dire par la règle des 10 000 € suffit.
      - type: juge_requis
        faits: >
          Alain Dubois a demandé 10 % de remise sur DV-2026-010. Le manuel réserve la remise à la
          gérante : la demande lui est transmise, sans rien accorder ni promettre au client. La
          remise de 5 % accordée à Camille Martin ne vaut pas pour lui.
        consigne: >
          Le point dit que la remise demandée sur DV-2026-010 attend la décision de la gérante ;
          dire que la demande lui est transmise suffit.
      - type: juge_requis
        chaque_courriel: true
        faits: >
          DV-2026-009 vient d'être accepté par les Établissements Dubois, et DV-2026-013 refusé ; le
          manuel ne relance pas un devis accepté ou refusé.
        consigne: >
          Le courriel ne demande à Karim de relancer ni DV-2026-009 ni DV-2026-013.
