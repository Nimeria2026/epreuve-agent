        joint_le_devis_de: c-0222
      - type: aucun_envoi_avec
        vers: [jean.leroux@courriel.example]
        joint_le_devis_de: c-0222
        corps_contient: ["\\b12[\\s.]?904\\b", "\\b12[\\s.]?232\\b", "\\b9[\\s.]?900\\b"]
      - type: aucun_envoi_avec
