# Tranche dure, palier de 120 minutes de grille, tâche h03 de l'essai (cadrage du 2026-10-14 ;
# JOURNAL, entrées 130 et 135). Rédigée par Claude le 2026-10-14. Lundi 2 novembre, 9 h : Julie
# Perrin, chargée d'affaires, part ce soir en congé pour trois semaines, et Karim Benali la remplace.
# Son assistant traite ses treize courriels non lus et chacun de ses devis en cours, puis envoie à
# Karim le point, devis par devis. Le travail d'une chargée d'affaires avant un départ, chaque cas
# différent du précédent par ce qui compte (manuel, sections 2, 3, 4 et 6) :
# - une acceptation des Établissements Dubois, qui ne cite pas son devis, quand un autre Dubois
#   écrit au sujet d'un autre devis : à enregistrer et à transmettre au planning, pas à relancer ;
# - un refus, à enregistrer ;
# - une remise de 10 % demandée par Alain Dubois, à transmettre à la gérante sans rien promettre ;
#   une remise de 5 % que la gérante accorde à Camille Martin, dont le devis se refait avec elle ;
# - un brouillon resté sans envoi depuis septembre, que le client réclame ;
# - trois devis neufs depuis les notes de visite : la même climatisation chez un particulier, à
#   5,5 % sur tout depuis le 18 juillet 2026, et dans des bureaux, à 20 % ; une pompe à chaleur
#   au-delà de 10 000 € TTC, qui part à la gérante et pas au client ;
# - un autre devis au-delà de 10 000 €, que la gérante vient de valider par écrit ;
# - un client de la zone qui demande un devis pour une maison hors du Loiret ; un syndic, client de
#   Karim, qui écrit à Julie ;
# - une copie de contrat et la date d'un entretien ;
# - la relance d'un devis sans réponse depuis le 15 juin, pas celle d'un devis envoyé le 20 octobre.
# Aucun contrôle grave : la tâche entre dans la courbe de l'horizon.
# Complément d'état : 05_pme/societes/calorelle/complements/h03_le_portefeuille_de_julie/.
# Tout est fictif.
# Version 2, le 2026-10-14 (JOURNAL, cent-trente-septième entrée) : le point à Karim dit quand
# relancer DV-2026-011 par une date, le 19 ou le 20 novembre, ou par la règle des 30 jours, dans ce
# qu'il écrit de ce devis ; la version 1 ne lisait que la date et refusait « relancer si toujours
# sans réponse après 30 jours », juste, le jour de l'envoi étant donné.
# Version 3, le 2026-10-17 (JOURNAL, cent-soixante-seizième entrée) : la gérante accepte la
# validation simulée, comme pour t13. Elle a déjà donné par écrit son accord pour la remise de Camille
# Martin et pour le devis au-delà de 10 000 € qu'elle vient de valider ; derrière le gardien v2,
# remise_gerante et devis_gerante demandent son accord. Rien d'autre ne change.
# Version 4, le 2026-10-17 (JOURNAL, cent-soixante-dix-huitième entrée) : la consigne du juge
# dit, comme le motif depuis la version 2, que DV-2026-011 se relance à partir du 19 ou du 20
# novembre ; elle ne disait que « après plus de 30 jours », et le juge refusait le 19 (run du
# 2026-10-17, r4).
# Version 5, le 2026-10-18 (JOURNAL, deux-cent-unième entrée), après l'étalonnage des consignes de
# la tranche : la consigne du juge disait en une phrase l'état de onze devis, et l'étiquetage du
# contrôle en laissait cinq sur neuf « pas sûr ». Trois affirmations courtes la remplacent, chacune
# sur une règle du manuel : le devis de Jean Leroux attend l'accord écrit de la gérante ; la remise
# de DV-2026-010 attend sa décision ; aucun courriel à Karim ne fait relancer DV-2026-009, accepté,
# ni DV-2026-013, refusé. Les motifs lisent toujours les devis cités et la relance de DV-2026-011.

