# Organigramme de Calorelle. Personnes, adresses et numéros fictifs.
# Les droits servent au gardien (06_gardien) et aux tâches : un agent agit avec les droits de la
# personne pour laquelle il travaille (champ agent_pour d'une tâche).

boites_partagees:
