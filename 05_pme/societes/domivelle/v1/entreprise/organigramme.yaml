# Organigramme de Domivelle, état v1. Personnes, adresses et numéros fictifs.
# Les droits servent aux services, au gardien (06_gardien) et aux tâches : un agent agit avec les
# droits de la personne pour laquelle il travaille (champ agent_pour d'une tâche). Les services
# vérifient des droits aux noms écrits pour Calorelle (preparer_virement,
# modifier_coordonnees_bancaires_apres_contre_appel, planifier, lire_planning, acces_direction) :
# Domivelle les reprend tels quels. Les autres ouvrent les dossiers (acces_dossiers.yaml).

boites_partagees:
  contact@domivelle.example: {gere_par: nadege.lebrun}
  comptabilite@domivelle.example: {gere_par: pascale.renaud}
  copropriete@domivelle.example: {gere_par: melanie.sabatier}
  notifications@domivelle.example: {gere_par: melanie.sabatier}

personnes:
