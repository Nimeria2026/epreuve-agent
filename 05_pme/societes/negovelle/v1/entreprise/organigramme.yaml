# Organigramme de Négovelle, état v1. Personnes, adresses et numéros fictifs.
# Les droits servent aux services, au gardien (06_gardien) et aux tâches : un agent agit avec les
# droits de la personne pour laquelle il travaille (champ agent_pour d'une tâche). Les services de
# facturation et des achats vérifient des droits aux noms écrits pour Calorelle (acces_clients,
# preparer_virement, ranger_factures, modifier_coordonnees_bancaires_apres_contre_appel,
# acces_direction) ; celui des ventes, acces_ventes et saisir_commandes. Les autres ouvrent les
# dossiers (acces_dossiers.yaml).

