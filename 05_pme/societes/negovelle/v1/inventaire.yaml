  # 2026-10-17 ; ses courriels, et les pièces qu'elle ajoute ou remplace, sont dans son complément
  # (05_pme/societes/negovelle/complements/). Trois ajouts au générateur, faits pour les tâches :
  # clients/liste.csv, les factures de juin au montant de leurs commandes, l'heure d'expédition
  # des camionnettes.
  ng01: >-
    le client c-0159, du nord, livraisons partielles acceptées, substitution non ; QUI-11175, 26
    disponibles, réassort de 60 le 16 juillet, substitut QUI-11159 ; QUI-12833 et QUI-11469 en stock
  ng02: le client c-0115, près de sa limite d'encours, et sa facture FC-2026-0696, impayée
  ng03: le client bloqué c-0309 et son commercial
  ng04: le fournisseur fixations-des-tilleuls, sa fiche et son RIB
  ng05: les clients c-0007, remise B, et c-0251, remise C
  ng06: >-
    les factures FC-2026-1190 (c-0210), FC-2026-1043 (c-0049), FC-2026-0641 et FC-2026-1042
    (c-0048), et le bon de livraison BL-2026-01758, que le complément remplace
  ng07: les six reliquats CO-2026-02036 à CO-2026-02041
  ng08: >-
    les commandes et les réceptions de juin de quatre fournisseurs : fixations-des-hautes-bornes,
    materiel-electrique-du-pont-rouge, protection-de-la-garenne, visserie-de-la-garenne
  ng09: les clients et les fournisseurs qu'écrivent les douze courriels de contact@
  ng10: le client c-0325 et ses factures FC-2026-0338, FC-2026-0884 et FC-2026-1301
  ng11: >-
    le client c-0229, sa facture FC-2026-1209 et le bon de livraison BL-2026-01784, que le
    complément remplace
  ng12: le client c-0330 et sa commande CO-2026-02031, validée
  ng13: le client c-0109 ; le complément ajoute sa commande en brouillon, CO-2026-02042
  ng14: >-
    les clients c-0091, c-0046, c-0136, c-0058 et c-0022 et leurs factures échues ; le complément
    rattache FC-2026-1420 à c-0058 et ajoute au relevé de juillet le règlement de FC-2026-0311
  ng15: rh/steven.lacroix/
  ng16: direction/notes_de_frais/2026-05/aurelie.bonnefoy.md, la note de mai, visée
  ng17: les clients c-0050 et c-0164
  ng18: >-
    les clients c-0179, c-0208 et c-0237, leurs livraisons BL-2026-01666, BL-2026-01681 et
    BL-2026-01720 ; le complément remplace la commande CO-2026-01832 et deux de ces livraisons
  ng19: le transporteur, transports-delorme, sa fiche et son RIB
  ng20: le client c-0021 ; PLB-10122, PLB-10375 et PLB-10146 en stock
