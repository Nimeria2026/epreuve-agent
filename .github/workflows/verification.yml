name: verification

# Sur main, la garde et le contrôle du code seulement, deux à trois minutes : le crochet avant
# poussée lance déjà tous les tests et make qualite sur le poste. Tous les tests (1 h 30) à la
# demande, par « Run workflow », par exemple avant une publication (JOURNAL, entrée 255).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: pnpm, à la version fixée dans package.json
        run: corepack enable pnpm
      - name: Arborescence conforme au plan
        run: make verifier
      - name: Installer uv, puis les environnements Python et TypeScript
        run: |
          python -m pip install uv
          make installer
      - name: Tests, à la demande seulement
        if: github.event_name == 'workflow_dispatch'
        run: make tests
      - name: Qualité du code (ruff, pyright strict)
        run: make qualite
