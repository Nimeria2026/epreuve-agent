# Auteur et relecteur (03_orchestrations, JOURNAL, entrées 80 et 92) sur DeepSeek V4.1 Flash, les
# deux rôles par le compte officiel : chaque action qui écrit ou envoie est relue avant de partir.
# Tarif des heures creuses : EASE arrête le run avant toute exécution qui toucherait les heures
# pleines (ease.creneaux). Réglages, prix et sources : 00_docs/sources/2026-10-05_reglages_des_modeles.md.
fiche:
  identifiant: auteur_relecteur_deepseek_flash
  nom: Auteur et relecteur sur DeepSeek V4.1 Flash
  version: "0.2.0"
  origine: fait_main
  division: a_modele_egal
  branchement: mcp
  editeur: Épreuve d'agent
  url: null
  modeles:
    - nom: deepseek-flash
      fournisseur: DeepSeek
  cout_mesurable: true
  conditions_utilisation: null
configuration:
  modeles:
    - role: auteur
      nom: deepseek-flash
      fournisseur: DeepSeek
      version_renvoyee: "?"
      parametres: {}
      tarif:
        entree_dollars_par_million: 0.15
        entree_en_cache_dollars_par_million: 0.003
        sortie_dollars_par_million: 0.6
        source: https://api-docs.deepseek.com/quick_start/pricing
        releve_le: "2026-10-05"
    - role: relecteur
      nom: deepseek-flash
      fournisseur: DeepSeek
      version_renvoyee: "?"
      parametres: {}
      tarif:
        entree_dollars_par_million: 0.15
        entree_en_cache_dollars_par_million: 0.003
        sortie_dollars_par_million: 0.6
        source: https://api-docs.deepseek.com/quick_start/pricing
        releve_le: "2026-10-05"
machine: null
lancement:
  module: orchestrations.auteur_relecteur
  arguments:
    - --configuration
    - 03_orchestrations/src/orchestrations/configurations/deepseek_flash.yaml
    - --relecteur
    - 03_orchestrations/src/orchestrations/configurations/deepseek_flash.yaml
  delai_secondes: 3600
  # Le relecteur lit par un accès en lecture seule, hors du budget de la tâche (JOURNAL, entrée 94).
  acces_lecture: true
  sonde: null
  # Le tarif noté plus haut est celui des heures creuses : pas d'exécution en heures pleines.
  creneau: heures_creuses_deepseek
  energie: null
  empreinte_de:
    - 03_orchestrations/src/orchestrations/consignes/auteur.md
    - 03_orchestrations/src/orchestrations/consignes/relecteur.md
    - 03_orchestrations/src/orchestrations/configurations/deepseek_flash.yaml
