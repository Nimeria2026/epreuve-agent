# Auteur et relecteur (03_orchestrations, JOURNAL, entrées 80 et 92) sur Qwen 3.8 27B, servi sur
# le poste d'Alexandre par make qwen : chaque action qui écrit ou envoie est relue avant de partir.
# Réglages, versions et sources : 00_docs/sources/2026-10-05_reglages_des_modeles.md.
fiche:
  identifiant: auteur_relecteur_qwen_local
  nom: Auteur et relecteur sur Qwen 3.8 27B (W4A16, en local)
  version: "0.2.0"
  origine: fait_main
  division: a_modele_egal
  branchement: mcp
  editeur: Épreuve d'agent
  url: null
  modeles:
    - nom: qwen3.8-27b-w4a16
      fournisseur: local
  # Les jetons se comptent, mais l'électricité n'a pas de prix : pas de coût en dollars.
  cout_mesurable: false
  conditions_utilisation: null
configuration:
  modeles:
    - role: auteur
      nom: qwen3.8-27b-w4a16
      fournisseur: local
      version_renvoyee: "?"
      parametres: {}
      tarif: null
    - role: relecteur
      nom: qwen3.8-27b-w4a16
      fournisseur: local
      version_renvoyee: "?"
      parametres: {}
      tarif: null
# Relevé du 2026-10-05 : vLLM par /version, système d'après infra/moteur.md de Nimeria.
machine:
  systeme: Ubuntu 24.04
  processeur: "?"
  carte_graphique: NVIDIA GeForce RTX 3090
  service_modele: vLLM 0.27.1
lancement:
  module: orchestrations.auteur_relecteur
  arguments:
    - --configuration
    - 03_orchestrations/src/orchestrations/configurations/qwen_local.yaml
    - --relecteur
    - 03_orchestrations/src/orchestrations/configurations/qwen_local.yaml
  delai_secondes: 3600
  # Le relecteur lit par un accès en lecture seule, hors du budget de la tâche (JOURNAL, entrée 94).
  acces_lecture: true
  sonde: http://127.0.0.1:30100/version
  # Le contexte que le serveur doit annoncer, vérifié avant le run (cadrage du second Qwen local).
  contexte_serveur: 40960
  creneau: null
  energie: nvidia_smi
  empreinte_de:
    - 03_orchestrations/src/orchestrations/consignes/auteur.md
    - 03_orchestrations/src/orchestrations/consignes/relecteur.md
    - 03_orchestrations/src/orchestrations/configurations/qwen_local.yaml
