# Diagnostic, jamais publié ni assemblé avec les runs officiels (identifiant à part ; JOURNAL,
# entrée 333) : agent_seul_qwen_flash_next_strata, avec la seule configuration
# qwen_flash_next_strata_choix_outil.yaml (tool_choice: auto). Strata lancé comme d'habitude
# (make strata). Mesuré seulement sur les tâches où des appels se sont perdus.
fiche:
  identifiant: agent_seul_qwen_flash_next_strata_choix_outil
  nom: Diagnostic de Flash-Next par Strata, avec tool_choice auto
  version: "0.1.0"
  origine: fait_main
  division: a_modele_egal
  branchement: mcp
  editeur: Épreuve d'agent
  url: null
  modeles:
    - nom: qwen3.8-flash-next-iq3_s
      fournisseur: local
  # Les jetons se comptent ; l'électricité n'est relevée que pour la carte, pas la mémoire vive.
  cout_mesurable: false
  conditions_utilisation: null
configuration:
  modeles:
    - role: agent
      nom: qwen3.8-flash-next-iq3_s
      fournisseur: local
      version_renvoyee: "?"
      parametres:
        temperature: 1.0
        top_p: 0.95
        top_k: 20
        tool_choice: auto
      tarif: null
# Relevé de l'essai du 2026-10-25 (journal du moteur) : Strata 0.2.4.2, contexte de 131 072 jetons.
machine:
  systeme: Ubuntu 24.04
  processeur: "?"
  carte_graphique: NVIDIA GeForce RTX 3090
  service_modele: Strata 0.2.4.2, contexte de 131 072 jetons
lancement:
  module: orchestrations.agent_seul
  arguments: [--configuration, 03_orchestrations/src/orchestrations/configurations/qwen_flash_next_strata_choix_outil.yaml]
  delai_secondes: 7200
  # Pas de sonde tant que l'adresse que Strata réserve à son état n'est pas relevée : make essai
  # montre d'abord que le serveur répond.
  sonde: null
  creneau: null
  energie: nvidia_smi
  empreinte_de:
    - 03_orchestrations/src/orchestrations/consignes/agent_seul.md
    - 03_orchestrations/src/orchestrations/configurations/qwen_flash_next_strata_choix_outil.yaml
    # Le préréglage du moteur : un préréglage nouveau change l'empreinte, et les runs ne s'assemblent pas.
    - 02_ease/src/ease/moteurs/strata_flash_next.json
