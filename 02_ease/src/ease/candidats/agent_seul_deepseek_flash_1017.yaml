# L'agent seul (03_orchestrations) sur DeepSeek V4.1 Flash, par le compte officiel.
# Tarif des heures creuses : EASE arrête le run avant toute exécution qui toucherait les heures
# pleines (ease.creneaux).
# Réglages, prix et sources : 00_docs/sources/2026-10-05_reglages_des_modeles.md.
# DeepSeek V4.1 Flash 1017 : depuis son annonce, le 2026-10-17 au soir, le nom d'API deepseek-flash
# est « now served by DeepSeek-V4.1-Flash-1017 », et l'ancienne version n'est plus servie
# (https://api-docs.deepseek.com/quick_start/pricing, consulté le 2026-10-21 ; prix inchangés). Un
# candidat à part, pour que ses runs ne s'assemblent jamais avec ceux d'avant (JOURNAL,
# deux-cent-trente-et-unième entrée).
fiche:
  identifiant: agent_seul_deepseek_flash_1017
  nom: Agent seul sur DeepSeek V4.1 Flash 1017
  version: "0.1.0"
  origine: fait_main
  division: a_modele_egal
  branchement: mcp
  editeur: Épreuve d'agent
  url: null
  modeles:
    - nom: deepseek-flash
      fournisseur: DeepSeek
  cout_mesurable: true
  conditions_utilisation: null
configuration:
  modeles:
    - role: agent
      nom: deepseek-flash
      fournisseur: DeepSeek
      version_renvoyee: "?"
      parametres: {}
      tarif:
        entree_dollars_par_million: 0.15
        entree_en_cache_dollars_par_million: 0.003
        sortie_dollars_par_million: 0.6
        source: https://api-docs.deepseek.com/quick_start/pricing
        releve_le: "2026-10-21"
machine: null
lancement:
  module: orchestrations.agent_seul
  arguments: [--configuration, 03_orchestrations/src/orchestrations/configurations/deepseek_flash.yaml]
  delai_secondes: 3600
  sonde: null
  # Le tarif noté plus haut est celui des heures creuses : pas d'exécution en heures pleines.
  creneau: heures_creuses_deepseek
  energie: null
  empreinte_de:
    - 03_orchestrations/src/orchestrations/consignes/agent_seul.md
    - 03_orchestrations/src/orchestrations/configurations/deepseek_flash.yaml
