# L'agent seul (03_orchestrations) sur Qwen 3.8 27B, servi sur le poste d'Alexandre par make qwen.
# Réglages, versions et sources : 00_docs/sources/2026-10-05_reglages_des_modeles.md.
fiche:
  identifiant: agent_seul_qwen_local
  nom: Agent seul sur Qwen 3.8 27B (W4A16, en local)
  version: "0.1.0"
  origine: fait_main
  division: a_modele_egal
  branchement: mcp
  editeur: Épreuve d'agent
  url: null
  modeles:
    - nom: qwen3.8-27b-w4a16
      fournisseur: local
  # Les jetons se comptent, mais l'électricité n'est pas encore mesurée : pas de prix.
  cout_mesurable: false
  conditions_utilisation: null
configuration:
  modeles:
    - role: agent
      nom: qwen3.8-27b-w4a16
      fournisseur: local
      version_renvoyee: "?"
      parametres: {}
      tarif: null
# Relevé du 2026-10-05 : vLLM par /version, système d'après infra/moteur.md de Nimeria.
machine:
  systeme: Ubuntu 24.04
  processeur: "?"
  carte_graphique: NVIDIA GeForce RTX 3090
  service_modele: vLLM 0.27.1
lancement:
  module: orchestrations.agent_seul
  arguments: [--configuration, 03_orchestrations/src/orchestrations/configurations/qwen_local.yaml]
  delai_secondes: 3600
  # Le serveur lancé par make qwen doit répondre ici avant un run.
  sonde: http://127.0.0.1:30100/version
  # Le contexte que le serveur doit annoncer, vérifié avant le run (cadrage du second Qwen local).
  contexte_serveur: 40960
  creneau: null
  # Électricité de la carte graphique relevée pendant chaque exécution (un minimum).
  energie: nvidia_smi
  empreinte_de:
    - 03_orchestrations/src/orchestrations/consignes/agent_seul.md
    - 03_orchestrations/src/orchestrations/configurations/qwen_local.yaml
